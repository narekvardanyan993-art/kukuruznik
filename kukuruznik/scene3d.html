<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кукурузник — 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: -webkit-fill-available; height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1230;
}
html.fs-big { font-size: 120%; }
#c { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;   touch-action: none; }
#paper-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 1;
}
#fps {
  position: fixed; top: env(safe-area-inset-top, 8px); right: 12px;
  color: rgba(47,42,37,0.5); font: 500 13px/1 monospace;
  z-index: 10; pointer-events: none;
}
#label { position: fixed; top: env(safe-area-inset-top, 8px); left: 12px;
  font-size: 13px; color: rgba(47,42,37,0.5); z-index: 10; pointer-events: none; }
body.night #fps { color: rgba(186,194,214,0.5); }
body.night #label { color: rgba(186,194,214,0.5); }

/* --- HUD AND MENU STYLES FROM style.css --- */
#hud {
  position: fixed;
  left: calc(50% - 31px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 54px);
  z-index: 10;
  width: 62px;
  height: 62px;
  transition: opacity 380ms ease;
}

#hudBtn {
  position: absolute;
  inset: 0;
  width: 62px;
  height: 62px;
  border: 1px solid var(--g-line);
  margin: 0;
  padding: 0;
  border-radius: 31px;
  color: var(--g-text);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  cursor: pointer;
  z-index: 10;
  transition: transform 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
  box-shadow: inset 0 1.5px 0 var(--g-top), inset 0 -1px 0 var(--g-bot), var(--g-drop);
  -webkit-tap-highlight-color: transparent;
}
#hudBtn:active {
  transform: scale(0.90);
}
#hud.ring #hudBtn:active {
  transform: rotate(180deg) scale(0.86);
}
#hudBtn svg { width: 26px; height: 26px; display: block; }
#hudBtn .close-i, #hudBtn .back-i { display: none; }
#hud.ring #hudBtn, #hud.sub #hudBtn { background: var(--g-on-bg); color: var(--g-on-text); }
#hud.ring #hudBtn { transform: rotate(180deg) scale(0.94); }
#hud.ring #hudBtn .open-i { display: none; }
#hud.ring #hudBtn .close-i { display: block; }
#hud.sub #hudBtn .open-i { display: none; }
#hud.sub #hudBtn .back-i { display: block; }

.rs {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 60px;
  height: 60px;
  margin: -30px 0 0 -30px;
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transform: translate(0, 0) scale(0.5);
  transition: transform 380ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease;
}
#hud.ring .rs {
  opacity: 1;
  pointer-events: auto;
  transform: translate(var(--x), var(--y)) scale(1);
}

.ri {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px solid var(--g-line);
  background: var(--g-bg);
  color: var(--g-text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: inset 0 1.5px 0 var(--g-top), inset 0 -1px 0 var(--g-bot), var(--g-drop);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s, transform 0.15s;
}
.ri:active { transform: scale(0.88); }
.ri[aria-pressed="true"] { background: var(--g-on-bg); color: var(--g-on-text); }
.ri svg { width: 22px; height: 22px; display: block; }

#sub {
  position: absolute;
  left: 50%;
  bottom: 84px;
  width: 320px;
  margin-left: -160px;
  background: var(--g-bg);
  border: 1px solid var(--g-line);
  border-radius: 28px;
  padding: 20px 22px 24px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px) scale(0.95);
  transition: transform 380ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease;
  box-shadow: inset 0 1.5px 0 var(--g-top), inset 0 -1px 0 var(--g-bot), var(--g-drop);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  color: var(--g-text);
}
#hud.sub #sub {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}
.sub-head { font: 600 15px/1 -apple-system, sans-serif; text-align: center; margin-bottom: 22px; }
#tod-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
#tod { flex: 1; width: 100%; accent-color: var(--g-accent); }
.edge { flex: none; width: 22px; height: 22px; opacity: 0.72; display: flex; align-items: center; justify-content: center; }
.edge svg { width: 100%; height: 100%; }
.chips { display: flex; gap: 8px; justify-content: center; }
.chip {
  flex: 1;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--g-line);
  color: var(--g-text);
  padding: 8px 0;
  border-radius: 14px;
  font: 500 13px/1 -apple-system, sans-serif;
  cursor: pointer;
}
.chip:active { background: rgba(255, 255, 255, 0.2); }

:root {
  --g-bg: rgba(251, 250, 247, 0.75);
  --g-text: #2f2a25;
  --g-line: rgba(47, 42, 37, 0.12);
  --g-top: rgba(255, 255, 255, 0.7);
  --g-bot: rgba(0, 0, 0, 0.04);
  --g-drop: 0 4px 12px rgba(47, 42, 37, 0.08);
  --g-on-bg: #2f2a25;
  --g-on-text: #fbfaf7;
  --g-accent: #a3472a;
}
body.night {
  --g-bg: rgba(22, 28, 58, 0.65);
  --g-text: #e9edf7;
  --g-line: rgba(233, 237, 247, 0.15);
  --g-top: rgba(255, 255, 255, 0.08);
  --g-bot: rgba(0, 0, 0, 0.15);
  --g-drop: 0 4px 12px rgba(0, 0, 0, 0.3);
  --g-on-bg: #e9edf7;
  --g-on-text: #0d1230;
  --g-accent: #6f8ecc;
}

body.ui-off #hud { opacity: 0; pointer-events: none; }
#back-tip {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 20px); left: 50%;
  transform: translateX(-50%);
  background: rgba(10, 14, 32, 0.75); color: #fff;
  padding: 10px 16px; border-radius: 16px; font: 500 14px/1 -apple-system, sans-serif;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
body.ui-off #back-tip { opacity: 1; transition-delay: 0.5s; }
body.ui-off.menu #back-tip { opacity: 0; }
</style>
</head>

<body>

<canvas id="c"></canvas>
<canvas id="paper-bg"></canvas>
<div id="fps">-- fps</div>
<div id="label">Three.js POC · только башня</div>

  
  
  <div id="hud">

        <button class="chip" type="button" data-v="92" aria-pressed="false">Ночь</button>
      </div>
    </div>
    
    <div class="rs" style="--x:96.6px;--y:-25.9px" data-cap="Погода">
      <button id="weatherBtn" class="ri lg" type="button" aria-label="Погода" data-cap="Погода"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="sun-g"><circle cx="12" cy="12" r="4.6"/><path d="M12 3.6v2.3M12 18.1v2.3M4.6 12H2.3M21.7 12h-2.3M6.34 6.34L4.73 4.73M19.27 19.27l-1.61-1.61M17.66 6.34l1.61-1.61M4.73 19.27l1.61-1.61"/></g></svg></button>
    </div>
    <div class="rs" style="--x:60.9px;--y:-79.3px" data-cap="Облёт">

    </div>

      <button id="hideBtn" class="ri lg" type="button" aria-label="Экран" data-cap="Экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="brackets"><path d="M9.2 3H3v6.2M14.8 3H21v6.2M21 14.8V21h-6.2M3 14.8V21h6.2"/></g></svg></button>
    </div>
    
    <button id="hudBtn" class="lg" type="button" aria-expanded="false" aria-label="Меню" data-cap="Меню"><svg class="open-i" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.7"/><circle cx="19.6" cy="12" r="1.85"/><circle cx="15.8" cy="5.42" r="1.85"/><circle cx="8.2" cy="5.42" r="1.85"/><circle cx="4.4" cy="12" r="1.85"/><circle cx="8.2" cy="18.58" r="1.85"/><circle cx="15.8" cy="18.58" r="1.85"/></svg><svg class="close-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.8 6.8l10.4 10.4M17.2 6.8L6.8 17.2"/></svg><svg class="back-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 5.4L8 12l6.6 6.6"/></svg></button>
  </div>
  
  <div id="back-tip" class="lg">Коснись экрана, чтобы вернуть панель</div>





<div id="loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; background: #fbfaf7; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans Armenian', -apple-system, sans-serif; font-size: 20px; font-weight: 500; color: #2f2a25; transition: opacity 0.5s ease;">
  <span id="loaderText">Загрузка...</span>
</div>

<div id="spinNote"></div>

<a id="toHub" class="lg" href="./" aria-label="Закрыть 3D" style="position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; z-index: 10; height: 38px; padding: 0 14px 0 8px; border-radius: 19px; display: flex; align-items: center; gap: 4px; text-decoration: none; font: 500 16px/1 'Noto Sans Armenian', -apple-system, sans-serif; background: rgba(255,255,255,0.45); color: #2f2a25; transform: translateX(-50%); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; display: block;"><path d="M14.6 5.4L8 12l6.6 6.6"/></svg>

<style>
#spinNote { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); left: 50%; transform: translateX(-50%); color: rgba(47,42,37,0.6); font-size: 13px; pointer-events: none; z-index: 10; }
body.night #spinNote { color: rgba(186,194,214,0.6); }
body.night #toHub { background: rgba(150,178,240,0.20); color: #e9edf7; }

#bigHint {
  position: fixed; left: 50%; z-index: 12;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  display: flex; align-items: center; gap: 12px;
  width: max-content; max-width: calc(100vw - 32px);
  padding: 14px 20px;
  border-radius: 22px;
  background: rgba(10, 14, 32, 0.78);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  color: #fff;

</style>
<script>
(function() {
  if (window.top !== window.self) {
    var toHub = document.getElementById('toHub');
    if (toHub) toHub.addEventListener('click', function(e) { e.preventDefault(); parent.postMessage({ chka: 'close-3d' }, '*'); });
  }

  var l = 'hy';
  try {
    l = localStorage.getItem('chka-lang') || ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0, 2).toLowerCase();
    if (localStorage.getItem('chka-fs') === 'big') document.documentElement.classList.add('fs-big');
  } catch (e) {}

  var T_hint = { hy: 'Պտտեք մատով · երկու մատով՝ մոտեցնել', ru: 'Крутите пальцем · щипок — приблизить', en: 'Drag to spin · pinch to zoom' };
  var T_spin = { hy: 'Պտույտն արագացված է', ru: 'Вращение ускорено', en: 'Rotation is sped up' };
  var T_hub = { hy: 'Չկա', ru: 'Назад', en: 'Back' };
  var T_load = { hy: 'Բեռնում...', ru: 'Загрузка...', en: 'Loading...' };
  
  if (!T_hint[l]) l = 'hy';
  document.getElementById('bigHintText').textContent = T_hint[l];
  document.getElementById('spinNote').textContent = T_spin[l];
  document.getElementById('toHubText').textContent = T_hub[l];
  document.getElementById('loaderText').textContent = T_load[l];

  var box = document.getElementById('bigHint');
  var KEY = 'chka-3d-hint';
  var hasHint = false;
  try { hasHint = !!localStorage.getItem(KEY); } catch (e) {}
  if (!hasHint) {
    box.hidden = false;
    function hide() {
      box.classList.add('gone');
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      window.removeEventListener('pointerdown', hide, true);
      window.removeEventListener('touchstart', hide, true);
      setTimeout(function () { box.hidden = true; }, 600);
    }
    window.addEventListener('pointerdown', hide, true);
  }
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { initEngine } from '../engine3d/core.js';
import { setupBuilding } from './builder.js';
import { shaftY1, yCenter } from './params.js';

const engine = initEngine(document.getElementById('c'), {
  targetY: (shaftY1 * 0.45) - yCenter,
  initialTOD: 0.30
});

setupBuilding(engine);

const todSlider = document.getElementById('tod');
todSlider.addEventListener('input', () => engine.applyTOD(todSlider.value / 100));
document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    todSlider.value = btn.dataset.v;
    engine.applyTOD(parseInt(btn.dataset.v) / 100);
  });
});

let menuMode = '';
const hud = document.getElementById('hud');
const hudBtn = document.getElementById('hudBtn');
function setMenu(m) {
  menuMode = m;
  hud.classList.toggle('ring', m === 'ring');
  hud.classList.toggle('sub', m === 'sub');
  document.body.classList.toggle('menu', m !== '');
  hudBtn.setAttribute('aria-expanded', m === '' ? 'false' : 'true');
}

hudBtn.addEventListener('click', () => {
  setMenu(menuMode === 'sub' ? 'ring' : (menuMode === '' ? 'ring' : ''));
});
document.getElementById('weatherBtn').addEventListener('click', () => setMenu('sub'));
document.getElementById('hideBtn').addEventListener('click', () => {
  setMenu('');
  document.body.classList.toggle('ui-off');
});
document.getElementById('resetBtn').addEventListener('click', () => {
  engine.controls.reset();
  setMenu('');
});
let droneActive = false;
document.getElementById('droneBtn').addEventListener('click', () => {
  droneActive = !droneActive;
  document.getElementById('droneBtn').setAttribute('aria-pressed', droneActive);
  engine.controls.autoRotate = droneActive;
  setMenu('');
});
document.getElementById('c').addEventListener('click', () => {
  if (menuMode !== '') setMenu('');
  if (document.body.classList.contains('ui-off')) document.body.classList.remove('ui-off');
});


const isPhone = window.innerWidth <= 450;
let lowFpsFrames = 0;
const fpsEl = document.getElementById('fps');
let frameCount = 0, lastFpsTime = performance.now();
engine.onUpdate(() => {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 250) {
    const fps = frameCount / ((now - lastFpsTime) / 1000);
    fpsEl.textContent = Math.round(fps) + ' fps';
    if (isPhone && fps < 30) lowFpsFrames++;
    else lowFpsFrames = 0;
    if (lowFpsFrames > 4 && engine.setHatchEnabled) engine.setHatchEnabled(false);
    frameCount = 0;
    lastFpsTime = now;
  }
});

engine.start();
document.getElementById("loader").style.opacity = 0;
setTimeout(() => document.getElementById("loader").remove(), 500);
</script>
