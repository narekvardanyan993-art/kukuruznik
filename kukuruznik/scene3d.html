<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кукурузник — 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: -webkit-fill-available; height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1230;
}
#c { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; mix-blend-mode: multiply;  touch-action: none; }
#paper-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 1;
}
#fps {
  position: fixed; top: env(safe-area-inset-top, 8px); right: 12px;
  color: rgba(47,42,37,0.5); font: 500 13px/1 monospace;
  z-index: 10; pointer-events: none;
}
#controls {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 20px;
  background: rgba(255,255,255,0.28);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  z-index: 10; flex-wrap: wrap; justify-content: center;
}
#controls label { font-size: 13px; color: #2f2a25; white-space: nowrap; }
#tod { width: 130px; accent-color: #a3472a; }
.chip {
  border: none; padding: 5px 10px; border-radius: 10px; font-size: 12px;
  background: rgba(255,255,255,0.45); color: #2f2a25; cursor: pointer;
}
.chip:active { background: rgba(163,71,42,0.2); }
#label { position: fixed; top: env(safe-area-inset-top, 8px); left: 12px;
  font-size: 13px; color: rgba(47,42,37,0.5); z-index: 10; pointer-events: none; }
body.night #controls { background: rgba(18,24,46,0.50); }
body.night #controls label { color: #bac2d6; }
body.night .chip { background: rgba(150,178,240,0.20); color: #e9edf7; }
body.night #fps { color: rgba(186,194,214,0.5); }
body.night #label { color: rgba(186,194,214,0.5); }
</style>
</head>
<body>
<div id="stage" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; isolation: isolate; z-index: 0;">
<canvas id="c"></canvas>
<canvas id="paper-bg"></canvas>
<div id="fps">-- fps</div>
<div id="label">Three.js POC · только башня</div>
<div id="controls">
  <label>☀️</label>
  <input type="range" id="tod" min="0" max="100" value="30">
  <label>🌙</label>
  <button class="chip" data-v="12">Утро</button>
  <button class="chip" data-v="30">День</button>
  <button class="chip" data-v="50">Закат</button>
  <button class="chip" data-v="92">Ночь</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { initEngine } from '../engine3d/core.js';
import { setupBuilding } from './builder.js';
import { shaftY1, yCenter } from './params.js';

const engine = initEngine(document.getElementById('c'), {
  targetY: (shaftY1 * 0.45) - yCenter,
  initialTOD: 0.30
});

setupBuilding(engine);

const todSlider = document.getElementById('tod');
todSlider.addEventListener('input', () => engine.applyTOD(todSlider.value / 100));
document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    todSlider.value = btn.dataset.v;
    engine.applyTOD(parseInt(btn.dataset.v) / 100);
  });
});

const fpsEl = document.getElementById('fps');
let frameCount = 0, lastFpsTime = performance.now();
engine.onUpdate(() => {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 250) {
    fpsEl.textContent = Math.round(frameCount / ((now - lastFpsTime) / 1000)) + ' fps';
    frameCount = 0;
    lastFpsTime = now;
  }
});

engine.start();
</script>
</div>
</body>
</html>
