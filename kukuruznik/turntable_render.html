<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #c { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  #paper-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="paper-bg"></canvas>
<canvas id="c"></canvas>
<script type="module">
import { initEngine } from '../engine3d/core.js';
import { setupBuilding } from './builder.js';
import { shaftY1, yCenter } from './params.js';

const engine = initEngine(document.getElementById('c'), {
  targetY: (shaftY1 * 0.45) - yCenter,
  initialTOD: 0.35
});
window.engine = engine; 
try {
  setupBuilding(engine);
} catch (e) {
  console.error(e);
}
engine.start();
</script>
</body>
</html>
