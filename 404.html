<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Չկա — страница не найдена</title>
<script>
(function () {
  var p = location.pathname;
  var base = /\.github\.io$/.test(location.hostname) ? '/kukuruznik/' : '/';
  var rest = p.indexOf(base) === 0 ? p.slice(base.length) : p.replace(/^\//, '');
  var first = rest.split('/')[0].toLowerCase();
  var known = { kukuruznik: 'kukuruznik/', 'index.html': '' };
  var target = base + (known.hasOwnProperty(first) ? known[first] : '');
  if (target !== p) location.replace(target + location.hash);
  document.addEventListener('DOMContentLoaded', function () { document.getElementById('home').href = base; });
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: #fbfaf7; color: #15171a; font: 600 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  a { color: #a3472a; text-underline-offset: 3px; }
</style>
</head>
<body>
<p>Такой страницы нет — как и этих зданий.<br><a id="home" href="/">На главную альбома</a></p>
</body>
</html>
