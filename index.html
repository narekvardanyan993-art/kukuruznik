<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4ead7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Кукурузник — 3D</title>
</head>
<body>

<div id="stage">
  <canvas id="paper"></canvas>
  <canvas id="scene"></canvas>
</div>

<div id="fps">— fps</div>

<div id="dock">
  <div id="todWrap" class="glass">
    <span class="ic">&#9728;</span>
    <input type="range" id="tod" min="0" max="100" value="26" aria-label="Время суток">
    <span class="ic">&#9790;</span>
  </div>
  <div id="panel">
    <button id="droneBtn" class="glass" type="button" aria-pressed="false">Дрон</button>
    <button id="autoBtn" class="glass" type="button" aria-pressed="false">Поворот</button>
    <button id="resetBtn" class="glass" type="button">Сброс</button>
  </div>
</div>

<div id="hint">Крути пальцем · два пальца — приблизить</div>

<script>
/* Загрузчик против кэша.

   GitHub Pages отдаёт index.html с кэшем на 10 минут. Браузер брал
   старую страницу, а в ней были ссылки на старые версии js — и правки
   не доезжали, сколько ни поднимай номер версии вручную: номер лежал
   внутри той самой закэшированной страницы.

   Теперь страница не называет версию. Она считает её сама при каждой
   загрузке — по минуте текущего времени — и подставляет в адреса.
   Даже старая закэшированная страница тянет свежий код. */
(function () {
  var v = Math.floor(Date.now() / 60000);   // новая метка раз в минуту

  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'css/style.css?v=' + v;
  document.head.appendChild(css);

  var files = ['js/model.js', 'js/controls.js', 'js/engine.js'];
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement('script');
    s.src = files[i] + '?v=' + v;
    s.async = false;        // порядок важен: движку нужны модель и управление
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
