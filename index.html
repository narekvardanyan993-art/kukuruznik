<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1230">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<!-- «На экран Домой» на iPhone: открывается без адресной строки и
     полосок Safari — это и есть настоящий полноэкранный режим,
     API браузера для него в Safari попросту нет. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кукурузник">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">

<title>Кукурузник — 3D</title>
</head>
<body>

<div id="stage">
  <canvas id="paper"></canvas>
  <canvas id="scene"></canvas>
</div>

<div id="fps">— fps</div>
<div id="hint">Крути пальцем · два пальца — приблизить</div>

<div id="hud">
    <div class="rs" style="--x:143.0px;--y:-38.3px">
      <button id="weatherBtn" class="ri lg" type="button" aria-label="Погода" data-cap="Погода"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="sun-g"><circle cx="9.3" cy="15" r="2.9"/><path d="M9.3 10.3V8.6M9.3 19.7v1.7M4.6 15H2.9M14 15h1.7M12.62 11.68l1.21-1.21M5.98 18.32l-1.21 1.21M12.62 18.32l1.21 1.21M5.98 11.68L4.77 10.47"/></g><path d="M20.4 7.3A3.96 3.96 0 0 1 15.4 2.3 3.96 3.96 0 1 0 20.4 7.3z"/></svg></button>
    </div>
    <div class="rs" style="--x:90.1px;--y:-117.4px">
      <button id="droneBtn" class="ri lg" type="button" aria-pressed="false" aria-label="Облёт" data-cap="Облёт"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><g class="orbit"><circle cx="20.6" cy="12" r="1.9" fill="currentColor" stroke="none"/></g></svg></button>
    </div>
    <div class="rs" style="--x:0px;--y:-148.0px">
      <button id="autoBtn" class="ri lg" type="button" aria-pressed="false" aria-label="Поворот" data-cap="Поворот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="spin-slow"><path d="M20.2 12a8.2 8.2 0 1 1-2.4-5.8"/><path d="M20.2 4v4.9h-4.9"/></g></svg></button>
    </div>
    <div class="rs" style="--x:-90.1px;--y:-117.4px">
      <button id="resetBtn" class="ri lg" type="button" aria-label="Сброс" data-cap="Сброс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="snap"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></g></svg></button>
    </div>
    <div class="rs" style="--x:-143.0px;--y:-38.3px">
      <button id="hideBtn" class="ri lg" type="button" aria-label="Экран" data-cap="Экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 3H3v6.2M14.8 3H21v6.2M21 14.8V21h-6.2M3 14.8V21h6.2"/></svg></button>
    </div>

  <div id="sub" class="lg">
    <div class="sub-head">Время суток</div>
    <div id="tod-row">
      <span class="edge" id="sun-edge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.3M12 19.3v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.4 12h2.3M19.3 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/></svg></span>
      <input type="range" id="tod" min="0" max="100" value="80" aria-label="Время суток">
      <span class="edge" id="moon-edge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.5A8.6 8.6 0 0 1 9.5 3.6 8.6 8.6 0 1 0 20.4 14.5z"/></svg></span>
    </div>
    <div class="chips">
      <button class="chip" type="button" data-v="12" aria-pressed="false">Утро</button>
      <button class="chip" type="button" data-v="30" aria-pressed="false">День</button>
      <button class="chip" type="button" data-v="50" aria-pressed="false">Закат</button>
      <button class="chip" type="button" data-v="92" aria-pressed="false">Ночь</button>
    </div>
  </div>

  <div id="toast" class="lg"></div>

  <button id="hudBtn" class="lg" type="button" aria-expanded="false" aria-label="Меню"><svg class="open-i" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.7"/><circle cx="19.6" cy="12" r="1.85"/><circle cx="15.8" cy="5.42" r="1.85"/><circle cx="8.2" cy="5.42" r="1.85"/><circle cx="4.4" cy="12" r="1.85"/><circle cx="8.2" cy="18.58" r="1.85"/><circle cx="15.8" cy="18.58" r="1.85"/></svg><svg class="close-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.8 6.8l10.4 10.4M17.2 6.8L6.8 17.2"/></svg><svg class="back-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 5.4L8 12l6.6 6.6"/></svg></button>
</div>

<div id="back-tip" class="lg">Коснись экрана, чтобы вернуть панель</div>

<script>
(function () {
  var v = Math.floor(Date.now() / 60000);
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'css/style.css?v=' + v;
  document.head.appendChild(css);
  var files = ['js/model.js', 'js/controls.js', 'js/engine.js'];
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement('script');
    s.src = files[i] + '?v=' + v; s.async = false;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
