<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D-фото — тест параллакса глубины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5ecda; --paper-2: #ede0c2; --ink: #2f2a25;
    /* Пружина как в iOS: response 0.65 с, damping ratio 0.86 (мягкий разгон, плавное торможение,
       оседание ~0.5% без заметного отскока). Кривая — ступенчатый отклик пружины, оседает за ~0.86 с. */
    --spring: cubic-bezier(0.22, 1, 0.36, 1);   /* запасной вариант, если браузер не знает linear() */
    --dur: 860ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);     /* прежняя кривая — только шторка и окна подсказок на телефоне */
    --panelW: 320px;
    --fs-body: 18px; --fs-small: 15px; --fs-card: 22px;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, 0.0193, 0.0683, 0.1365, 0.2155, 0.2993, 0.3832, 0.4643, 0.5405, 0.6104, 0.6734, 0.7293, 0.7782, 0.8205, 0.8565, 0.8869, 0.9123, 0.9332, 0.9502, 0.9639, 0.9748, 0.9834, 0.9899, 0.9949, 0.9985, 1.0011, 1.0029, 1.0041, 1.0047, 1.005, 1.005, 1.0048, 1.0045, 1.0042, 1.0038, 1.0033, 1.0029, 1.0025, 1.0021, 1.0018, 1); }
  }
  /* Размер текста: «крупный» по умолчанию (аудитория пожилая). */
  html[data-textsize="normal"] { --fs-body: 15px; --fs-small: 13px; --fs-card: 17px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Armenian", sans-serif;
    overscroll-behavior: none;
  }
  body { user-select: none; }
  #layout { height: 100%; }
  #view { height: 100%; }
  #stage {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: none;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  /* Телефон (до 1024 px): картинка на весь экран, WebGL сам обрезает кадр
     по принципу "cover" (uCoverScale/uCoverOffset), без искажения. */

  /* ПК (от 1024 px): слева панель 320 px, справа картинка по центру с
     бумажными полями. Панель сворачивается в тонкую полоску. */
  @media (min-width: 1024px) {
    #layout {
      display: grid; grid-template-columns: var(--panelW) 1fr;
      transition: grid-template-columns var(--dur) var(--spring);
    }
    body.panel-collapsed { --panelW: 48px; }
    #view {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; min-width: 0;
    }
    #stage {
      width: min(100%, calc((100vh - 48px) * var(--natW, 768) / var(--natH, 1365)));
      width: min(100%, calc((100dvh - 48px) * var(--natW, 768) / var(--natH, 1365)));
      height: auto;
      aspect-ratio: var(--natW, 768) / var(--natH, 1365);
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(47,42,37,0.35), 0 14px 44px rgba(60,45,20,0.28);
    }
  }

  #stage.loading #gl, #stage.loading #fallback { visibility: hidden; }
  /* Простой бумажный экран, пока все кадры и карты глубины не загружены
     и не декодированы (иначе картинка мигает при смене кадра). Сплошной
     фон, без прозрачности, поверх всего. */
  #loader {
    position: absolute; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: rgba(47,42,37,0.7);
    font: 700 26px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    transition: opacity var(--dur) var(--spring);
  }
  #stage:not(.loading) #loader { opacity: 0; pointer-events: none; }

  /* Откат без WebGL: два слоя (фон + здание) на кадр, двигаются CSS-ом. */
  #fallback { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #fallback[hidden] { display: none; }
  .fb-frame { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .fb-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; will-change: transform; pointer-events: none;
  }

  /* Меню в тон скетча: бумажный фон, крупно — аудитория пожилая. */
  #topBar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 8;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(rgba(245,236,218,0.92), rgba(245,236,218,0.55) 80%, transparent);
  }
  #backLink {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(47,42,37,0.08);
    color: var(--ink); text-decoration: none;
    font: 600 16px/1 -apple-system, BlinkMacSystemFont, "Noto Sans Armenian", sans-serif;
  }
  #backLink:active { background: rgba(47,42,37,0.18); }
  #pageTitle {
    flex: 1; min-width: 0;
    font: 700 24px/1.15 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(20, 16, 8, 0.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: none; color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background var(--dur) var(--spring), opacity var(--dur) var(--spring);
  }
  .nav-btn:hover { background: rgba(20, 16, 8, 0.55); }
  .nav-btn:active { background: rgba(20, 16, 8, 0.7); }
  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }

  #dots {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 5;
  }
  #dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background var(--dur) var(--spring), transform var(--dur) var(--spring);
  }
  #dots span.on { background: #fff; transform: scale(1.25); }

  /* Кнопка гироскопа в стиле меню (бумага + чернила, как «на сайт»).
     На iPhone разрешение можно запросить только по нажатию. */
  #gyroBtn {
    position: absolute; left: 50%; z-index: 9;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
    transform: translateX(-50%);
    padding: 12px 22px; border: none; border-radius: 14px;
    background: rgba(245,236,218,0.96); color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    font: 700 22px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    white-space: nowrap; cursor: pointer;
  }
  #gyroBtn[hidden] { display: none; }
  #gyroBtn:active { background: rgba(232,221,196,0.98); }

  #build-version {
    position: absolute; right: 8px; bottom: 4px; z-index: 5;
    font: 500 9px/1 -apple-system, sans-serif; color: #fff; opacity: 0.55;
    pointer-events: none;
  }

  /* ---------- Панель (скетч-стиль: бумага, карандашная рамка, мягкая тень) ---------- */
  .sketch {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;
    box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14);
    outline: 1px solid rgba(47,42,37,0.3); outline-offset: -7px;
  }
  #panel { position: relative; overflow: hidden; z-index: 50; }
  .panel-card {
    position: absolute; top: 16px; bottom: 16px; left: 16px; width: 288px;
    overflow-y: auto; padding: 16px 16px 14px; font-size: var(--fs-body);
    transition: opacity var(--dur) var(--spring), transform var(--dur) var(--spring);
    scrollbar-width: thin;
  }
  body.panel-collapsed .panel-card { opacity: 0; transform: translateX(-44px); pointer-events: none; }
  /* Пункты панели (ПК) появляются вслед за карточкой с задержкой 30 мс между пунктами. */
  .panel-card > * { transition: opacity var(--dur) var(--spring), transform var(--dur) var(--spring); }
  @media (min-width: 1024px) {
    .panel-card > *:nth-child(1) { transition-delay: 90ms; }
    .panel-card > *:nth-child(2) { transition-delay: 120ms; }
    .panel-card > *:nth-child(3) { transition-delay: 150ms; }
    .panel-card > *:nth-child(4) { transition-delay: 180ms; }
    .panel-card > *:nth-child(5) { transition-delay: 210ms; }
    .panel-card > *:nth-child(6) { transition-delay: 240ms; }
    .panel-card > *:nth-child(7) { transition-delay: 270ms; }
    .panel-card > *:nth-child(8) { transition-delay: 300ms; }
    .panel-card > *:nth-child(9) { transition-delay: 330ms; }
    body.panel-collapsed .panel-card > * { opacity: 0; transform: translateX(-22px); transition-delay: 0ms; }
  }
  .p-title { font: 700 32px/1.1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif; display: block; margin: 0 26px 8px 0; }
  .p-sec { margin: 0 0 14px; }
  .p-sec h3 { margin: 0 0 6px; font: 700 26px/1.1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif; }
  .seg { display: flex; gap: 0; border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 9px 4px; border: none; border-right: 1px solid rgba(47,42,37,0.5);
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 var(--fs-small)/1.1 -apple-system, "Noto Sans Armenian", sans-serif;
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  #thumbs button {
    padding: 0; border: 2px solid rgba(47,42,37,0.35); border-radius: 8px 4px 8px 4px;
    overflow: hidden; cursor: pointer; background: #000; aspect-ratio: 4 / 5;
    transition: border-color var(--dur) var(--spring), transform var(--dur) var(--spring);
  }
  #thumbs button img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; }
  #thumbs button.on { border-color: var(--ink); transform: scale(1.04); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .p-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch {
    flex: none; width: 54px; height: 30px; border-radius: 15px; border: 2px solid var(--ink);
    background: transparent; position: relative; cursor: pointer;
    transition: background var(--dur) var(--spring);
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--ink); transition: transform var(--dur) var(--spring), background var(--dur) var(--spring);
  }
  .switch.on { background: var(--ink); }
  .switch.on::after { transform: translateX(24px); background: var(--paper); }
  .p-btn {
    display: block; width: 100%; padding: 11px 12px; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px;
    background: transparent; color: var(--ink); text-align: center;
    font: 700 var(--fs-body)/1.1 -apple-system, "Noto Sans Armenian", sans-serif;
    transition: background var(--dur) var(--spring), color var(--dur) var(--spring);
  }
  .p-btn[hidden] { display: none; }
  .p-about p { margin: 0 0 6px; font-size: var(--fs-small); line-height: 1.35; }
  .p-about a { color: var(--ink); font-weight: 700; font-size: var(--fs-small); }

  /* Наведение мышью (только устройства с мышью): кнопка чуть приподнимается, тень больше,
     фон чуть темнее бумаги, курсор-рука; 300 мс. */
  @media (hover: hover) and (pointer: fine) {
    .seg button, .p-btn, .switch, #thumbs button, #panelBtn { cursor: pointer; }
    .seg button, .p-btn, .switch, #thumbs button, #panelBtn {
      transition: transform 300ms var(--spring), box-shadow 300ms var(--spring), background-color 300ms var(--spring), border-color 300ms var(--spring);
    }
    #panelBtn { transition: left var(--dur) var(--spring), transform 300ms var(--spring), box-shadow 300ms var(--spring), background-color 300ms var(--spring); }
    .seg button:not(.on):hover, .p-btn:hover, #panelBtn:hover {
      background: #e8dbbd; transform: translateY(-1.5px); box-shadow: 0 5px 11px rgba(60,45,20,0.24);
    }
    .seg button.on:hover { transform: translateY(-1.5px); box-shadow: 0 5px 11px rgba(60,45,20,0.3); }
    .switch:hover { transform: translateY(-1.5px); box-shadow: 0 5px 11px rgba(60,45,20,0.24); }
    #thumbs button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(60,45,20,0.3); }
    #thumbs button.on:hover { transform: scale(1.04) translateY(-2px); }
    .seg button:active, .p-btn:active, .switch:active, #thumbs button:active, #panelBtn:active { transform: translateY(0); box-shadow: none; }
  }

  /* кнопка панели: на ПК — стрелка свернуть/развернуть, на телефоне — круглая кнопка снизу слева */
  #panelBtn {
    position: fixed; z-index: 60; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; padding: 0; font: 700 22px/1 -apple-system, sans-serif;
    box-shadow: 0 6px 16px rgba(60,45,20,0.3), 2px 3px 0 rgba(47,42,37,0.14);
    display: flex; align-items: center; justify-content: center;
    transition: left var(--dur) var(--spring), transform var(--dur) var(--spring), background var(--dur) var(--spring);
  }
  #panelBtn:active { background: var(--paper-2); }
  #panelBtn svg { display: block; flex: none; }
  #panelBtn .ic-arrow { display: none; }
  #scrim { display: none; }

  @media (min-width: 1024px) {
    #panelBtn {
      top: 22px; left: calc(var(--panelW) - 54px); width: 40px; height: 40px; border-radius: 50% 42% 50% 42%;
    }
    #panelBtn .ic-menu { display: none; }
    #panelBtn .ic-arrow { display: block; transition: transform var(--dur) var(--spring); }
    body.panel-collapsed #panelBtn { left: 4px; }
    body.panel-collapsed #panelBtn .ic-arrow { transform: rotate(180deg); }
  }

  /* Телефон: та же панель, свёрнутая в круглую кнопку; по тапу выезжает снизу шторкой на 60% высоты */
  @media (max-width: 1023.98px) {
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; height: 60dvh; overflow: visible;
      transform: translateY(108%); transition: transform 400ms var(--ease); z-index: 70;
    }
    body.sheet-open #panel { transform: none; }
    .panel-card {
      left: 8px; right: 8px; top: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: auto;
      border-radius: 22px 22px 12px 12px / 18px 18px 12px 12px; padding-top: 18px;
    }
    #panelBtn {
      left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 54px; height: 54px; border-radius: 50%;
      transition: transform 350ms var(--ease), background 250ms var(--ease);
    }
    body.sheet-open #panelBtn { transform: scale(0.9); }
    #scrim {
      display: block; position: fixed; inset: 0; z-index: 65; background: rgba(20,16,8,0.32);
      opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
    }
    body.sheet-open #scrim { opacity: 1; pointer-events: auto; }
  }

  /* без WebGL время суток — CSS-фильтром (окна ночью не светятся) */
  .fb-frame { transition: filter 1500ms var(--spring); }
  #fallback[data-tod="sunset"] .fb-frame { filter: sepia(0.55) saturate(1.5) hue-rotate(-12deg) brightness(0.93); }
  #fallback[data-tod="night"] .fb-frame { filter: brightness(0.38) sepia(0.35) hue-rotate(185deg) saturate(1.5); }

  #hint {
    position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%);
    z-index: 5; font-size: 12px; color: #fff; text-align: center; max-width: calc(100% - 24px);
    background: rgba(20, 16, 8, 0.4); padding: 6px 12px; border-radius: 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0.9; pointer-events: none;
    transition: opacity var(--dur) var(--spring);
  }
  #hint.gone { opacity: 0; }

  /* Точки-подсказки: маленький пульсирующий маркер, привязанный к
     объекту на слое (двигается вместе с ним при параллаксе — позиция
     считается в JS той же формулой смещения, что и в шейдере). */
  /* Птицы в небе — единственная анимация помимо теней облаков, летят
     медленно и независимо от параллакса (они и так на предельно
     дальнем плане, где смещение практически нулевое). */
  #birds { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .bird {
    position: absolute; left: -10%; top: var(--y, 10%);
    width: 26px; height: 13px;
    fill: none; stroke: #3a332a; stroke-width: 1.4; stroke-linecap: round;
    opacity: 0.5;
    animation: birdFly var(--fly-dur, 42s) linear infinite;
    animation-delay: var(--fly-delay, 0s);
  }
  @keyframes birdFly {
    0%   { left: -10%; margin-top: 0; }
    48%  { margin-top: -9px; }
    50%  { left: 52%; }
    100% { left: 112%; margin-top: 0; }
  }

  #hotspots { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .hs-dot {
    position: absolute; top: 0; left: 0;
    width: 22px; height: 22px; margin: -11px;
    border: none; padding: 0; background: none;
    pointer-events: auto; cursor: pointer;
    opacity: 0; transition: opacity var(--dur) var(--spring);
  }
  .hs-dot.show { opacity: 1; }
  .hs-dot::before, .hs-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .hs-dot::before {
    width: 10px; height: 10px;
    background: #fff; border: 2px solid rgba(20,16,8,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hs-dot::after {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.7);
    animation: hsPulse 2.2s var(--ease) infinite;
  }
  @keyframes hsPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  /* Карточка подсказки: бумага, крупный текст, растёт из точки (0.9 -> 1, 350 мс),
     закрывается за 300 мс. Фон за ней темнеет/размывается/обесцвечивается. */
  #hsPopup {
    position: absolute; z-index: 7;
    width: max-content; max-width: min(84vw, 360px);
    padding: 16px 18px 14px;
    font-size: var(--fs-card); line-height: 1.35; color: var(--ink);
    --shift: 0px;
    transform-origin: calc(50% - var(--shift)) calc(100% + 16px);
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(0.9);
    opacity: 0; pointer-events: none;
    transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  #hsPopup.show {
    opacity: 1; pointer-events: auto;
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(1);
    transition-duration: 350ms;
  }
  /* точка у верхнего края — карточка раскрывается вниз */
  #hsPopup.below { transform-origin: calc(50% - var(--shift)) -16px; transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(0.9); }
  #hsPopup.below.show { transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(1); }
  #hsPopup::after {
    /* хвостик остаётся над точкой, даже если сам блок сдвинут от края */
    content: ''; position: absolute; left: calc(50% - var(--shift)); top: 100%;
    width: 14px; height: 14px; margin-left: -7px; margin-top: -8px;
    background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transform: rotate(45deg);
  }
  #hsPopup.below::after { top: 0; margin-top: -6px; border: none; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); }
  #hsText { margin-bottom: 12px; }
  #hsBack { display: inline-block; width: auto; padding: 8px 16px; font-size: var(--fs-small); }
  .lbl-phone { display: none; }
  /* Телефон: заметная кнопка «× закрыть» внизу карточки (не ниже 44 px), тап мимо тоже закрывает */
  @media (max-width: 1023.98px) {
    .lbl-pc { display: none; }
    .lbl-phone { display: inline; }

    scenePrg = makeProgram(SCENE_FRAG, ['uBgA', 'uDepthA', 'uBldA', 'uEmA', 'uBgB', 'uDepthB', 'uBldB', 'uEmB',
      'uKdA', 'uKdB', 'uStarQ', 'uMix', 'uShift', 'uZoom', 'uScale', 'uCoverScale', 'uCoverOffset', 'uTime', 'uCloudT',
      'uSunset', 'uNight', 'uAspect', 'uWindAmp', 'uWindOn', 'uCellPx', 'uShoot', 'uShootP'], US);
    // юниты: A = 0..3 (земля, глубина+окружение, здание, окна), B = 4..7. Сами текстуры
    // подставляются при отрисовке — подгрузки во время показа нет.
    ['uBgA', 'uDepthA', 'uBldA', 'uEmA', 'uBgB', 'uDepthB', 'uBldB', 'uEmB'].forEach(function (n, i) { gl.uniform1i(US[n], i); });
    gl.uniform1f(US.uScale, CONFIG.BASE_SCALE);

  function makeTexture(filter) {

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);

  }

    return tex;

  // Заливает в GPU уже декодированные данные кадра. Вызывается один раз
  // при загрузке (и повторно, если iOS потеряет WebGL-контекст).
  function uploadFrame(f) {

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, f.bgSrc);
    f.depthTex = makeTexture(gl.LINEAR);   // R глубина, G небо, B высота дерева, A фаза (вдвое мельче)
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, f.ew, f.eh, 0, gl.RGBA, gl.UNSIGNED_BYTE, f.gpuDepth);
    f.bldTex = makeTexture(gl.LINEAR);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true); // края здания без тёмной каймы
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, f.bldSrc);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    f.emTex = makeTexture(gl.LINEAR);      // окна: R/G свет ночью (башня/другие здания), B/A сами маски
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, f.ew, f.eh, 0, gl.RGBA, gl.UNSIGNED_BYTE, f.emis);
  }

  function uploadEm(f) {
    if (!f || !f.emDirty) return;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, f.emTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, f.ew, f.eh, gl.RGBA, gl.UNSIGNED_BYTE, f.emis);
    f.emDirty = false;
  }

  function bindFrame(f, unit0) {
    var t = [f.bgTex, f.depthTex, f.bldTex, f.emTex];
    for (var i = 0; i < 4; i++) {
      gl.activeTexture(gl.TEXTURE0 + unit0 + i);
      gl.bindTexture(gl.TEXTURE_2D, t[i]);
    }
  }

  function ensureFbo(w, h) {
    if (fbo && fboW === w && fboH === h) return;
    if (sceneTex) gl.deleteTexture(sceneTex);
    if (fbo) gl.deleteFramebuffer(fbo);
    sceneTex = makeTexture(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    fboW = w; fboH = h;
  }

  // s = состояние кадра: fa/fb (готовые кадры), mix, shiftX/Y, zoom, t
  function drawGL(fa, fb, mix, shiftX, shiftY, zoom, t, tAmb) {

    gl.viewport(0, 0, canvas.width, canvas.height);
    uploadEm(fa); uploadEm(fb);
    var aspect = canvas.width / canvas.height, visW = coverUvW / CONFIG.BASE_SCALE, visH = coverUvH / CONFIG.BASE_SCALE;
    // --- проход 1: сцена (параллакс, ветер, закат, ночь) -> текстура ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.useProgram(scenePrg);
    bindFrame(fa, 0);
    if (fb) bindFrame(fb, 4);
    gl.uniform2f(US.uKdA, fa.kB, fa.dB);
    if (fb) gl.uniform2f(US.uKdB, fb.kB, fb.dB);
    gl.uniform2f(US.uStarQ, fa.starQ, fb ? fb.starQ : 0);
    gl.uniform2f(US.uShift, shiftX, shiftY);
    gl.uniform1f(US.uZoom, zoom);
    gl.uniform1f(US.uMix, mix);
    gl.uniform1f(US.uTime, tAmb);
    gl.uniform1f(US.uCloudT, t);
    gl.uniform1f(US.uSunset, tod.s);
    gl.uniform1f(US.uNight, tod.n);
    gl.uniform1f(US.uAspect, aspect);
    gl.uniform1f(US.uWindAmp, fx.windAmp);
    gl.uniform1f(US.uWindOn, fx.windOn ? 1 : 0);
    gl.uniform2f(US.uCellPx, canvas.width / (32 * visW), canvas.height / (57 * visH));
    gl.uniform4f(US.uShoot, fx.shoot[0], fx.shoot[1], fx.shoot[2], fx.shoot[3]);
    gl.uniform2f(US.uShootP, fx.shootP, fx.shootLen);
    gl.uniform2f(US.uCoverScale, coverUvW, coverUvH);
    gl.uniform2f(US.uCoverOffset, coverOffX, coverOffY);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // --- проход 2: длинные тени (закат) и фонари (ночь) -> экран ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(postPrg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1f(UP.uSunset, tod.s);
    gl.uniform1f(UP.uNight, tod.n);
    gl.uniform1f(UP.uAspect, aspect);
    gl.uniform3fv(UP.uLampH, fx.lampH);
    gl.uniform3fv(UP.uLampB, fx.lampB);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var glLost = false;
  var tod = { s: 0, n: 0 }; // время суток: вес заката и ночи (0..1), день = оба 0
  if (useGL) {
    try { initGLProgram(); } catch (err) { console.warn('WebGL shader failed, fallback:', err); useGL = false; canvas.style.display = 'none'; }
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); glLost = true; });
    canvas.addEventListener('webglcontextrestored', function () {
      try {
        initGLProgram();
        // текстуры заново: CPU-копии картинок мы не держим (память iPhone),
        // поэтому перечитываем файлы — кэш браузера отдаёт их сразу.
        Promise.all(FRAMES.map(function (_, k) { return preloadFrame(k); }))
          .then(function () { resize(true); glLost = false; });
      } catch (err) { console.warn('WebGL restore failed', err); }
    });
  }

  // ---------- загрузка и подготовка картинок ----------
  function whenLoaded(img) {
    return new Promise(function (resolve, reject) {
      if (img.complete && img.naturalWidth) return resolve(img);
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('не загрузилось: ' + img.src)); };
    });
  }

  // Картинка полностью загружена И декодирована до первого показа —
  // иначе iOS декодирует её лениво прямо во время кроссфейда (мерцание).
  function loadImage(url) {
    var img = new Image();
    img.src = url;
    return whenLoaded(img).then(function () {
      return typeof img.decode === 'function' ? img.decode().catch(function () {}) : null;
    }).then(function () { return img; });
  }

  // Не больше MAX_TEX_SIZE по длинной стороне — иначе iPhone выгружает
  // большие кадры из памяти. Возвращает {src, w, h}: src — img или canvas.
  function fitToCap(img) {
    var w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h), cap = CONFIG.MAX_TEX_SIZE;
    if (m <= cap) return { src: img, w: w, h: h };
    var s = cap / m, c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { src: c, w: c.width, h: c.height };
  }

  // Скользящий бокс-блюр по одной оси с зажатием краёв.
  function blurPass(src, dst, w, h, r, horiz) {

    for (var l = 0; l < lines; l++) {

      for (k = -r; k <= r; k++) sum += src[base + Math.min(n - 1, Math.max(0, k)) * stride];
      for (i = 0; i < n; i++) {
        dst[base + i * stride] = (sum / div + 0.5) | 0;
        sum += src[base + Math.min(n - 1, i + r + 1) * stride] - src[base + Math.max(0, i - r) * stride];
      }

    var tmp = new Uint8Array(a.length);
    blurPass(a, tmp, w, h, r, true);
    blurPass(tmp, a, w, h, r, false);
  }

  // Карта глубины -> 1 канал: растягиваем контраст по 2–98 перцентилю
  // (плоскость фокуса всегда в середине диапазона), затем размываем
  // 3 проходами бокс-блюра (~CONFIG.DEPTH_BLUR_PX) — резкие ступеньки
  // глубины на границе здания и неба иначе рвут картинку.
  function prepareDepth(img) {
    var fit = fitToCap(img), w = fit.w, h = fit.h;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fit.src, 0, 0, w, h);
    var px = ctx.getImageData(0, 0, w, h).data, n = w * h;
    var a = new Uint8Array(n), hist = new Uint32Array(256), i;
    for (i = 0; i < n; i++) { a[i] = px[i * 4]; hist[a[i]]++; }
    var lo = 0, hi = 255, acc = 0;
    for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= n * 0.02) { lo = i; break; } }
    acc = 0;
    for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n * 0.02) { hi = i; break; } }
    if (hi - lo < 8) { lo = 0; hi = 255; }
    var span = hi - lo;
    for (i = 0; i < n; i++) a[i] = clamp(Math.round((a[i] - lo) * 255 / span), 0, 255);

      blurPass(tmp, a, w, h, r, false);

  // Вырезка здания (RGBA, маска SAM): оставляем только самый большой
  // связный кусок (обрывки фона в маске не должны ехать вместе со зданием),
  // считаем маску окон (окна темнее своего окружения) и среднюю глубину
  // здания — по ней здание двигается целиком.
  function analyzeBuilding(img, depth, frameImg, bgImg) {
    var fit = fitToCap(img), w = fit.w, h = fit.h, n = w * h, i;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fit.src, 0, 0, w, h);
    var id = ctx.getImageData(0, 0, w, h), px = id.data;

    // 1) самый большой связный кусок маски (alpha > 128)
    var lab = new Int32Array(n), stack = new Int32Array(n), sizes = [0], nl = 0, best = 0, bestSize = 0;
    for (i = 0; i < n; i++) {
      if (lab[i] || px[i * 4 + 3] <= 128) continue;
      nl++;
      var sp = 0, size = 0;
      stack[sp++] = i; lab[i] = nl;
      while (sp) {
        var p = stack[--sp], x = p % w, y = (p / w) | 0;
        size++;
        if (x > 0 && !lab[p - 1] && px[(p - 1) * 4 + 3] > 128) { lab[p - 1] = nl; stack[sp++] = p - 1; }
        if (x < w - 1 && !lab[p + 1] && px[(p + 1) * 4 + 3] > 128) { lab[p + 1] = nl; stack[sp++] = p + 1; }
        if (y > 0 && !lab[p - w] && px[(p - w) * 4 + 3] > 128) { lab[p - w] = nl; stack[sp++] = p - w; }
        if (y < h - 1 && !lab[p + w] && px[(p + w) * 4 + 3] > 128) { lab[p + w] = nl; stack[sp++] = p + w; }
      }
      if (size > bestSize) { bestSize = size; best = nl; }
    }
    // Пиксели чужих кусков и мягкий ореол вокруг них убираем; ореол главного
    // куска (label 0, но рядом с ним) оставляем как есть.
    var keep = new Uint8Array(n);
    for (i = 0; i < n; i++) keep[i] = lab[i] === best ? 1 : 0;
    var grown = new Uint8Array(n); // главный кусок, расширенный на 6 px — там мягкий край оставляем
    for (i = 0; i < n; i++) grown[i] = keep[i] * 255;
    boxBlur(grown, w, h, 6);
    for (i = 0; i < n; i++) if (!keep[i] && grown[i] === 0) px[i * 4 + 3] = 0;
    for (i = 0; i < n; i++) if (lab[i] && lab[i] !== best) px[i * 4 + 3] = 0;

    // 2) маска окон: темнее своего окружения (окно 9 px против 2 px)
    var L = new Uint8Array(n), sum = 0, cnt = 0;

    for (i = 0; i < n; i++) if (!keep[i]) L[i] = mean;
    var big = L.slice(), small = L.slice();
    boxBlur(big, w, h, 9);
    boxBlur(small, w, h, 2);
    var win = new Uint8Array(n);
    for (i = 0; i < n; i++) {
      var dv = (big[i] - small[i]) / 255;
      var wv = clamp((dv - 0.06) / 0.10, 0, 1);
      win[i] = keep[i] ? (wv * (px[i * 4 + 3] / 255) * 255) | 0 : 0;
    }
    blurPass(win, small, w, h, 1, true); blurPass(small, win, w, h, 1, false); // мягкое свечение

    // 3) средняя глубина здания по маске
    var dsum = 0, dc = 0, dm = depth;
    for (i = 0; i < n; i++) {
      if (!keep[i]) continue;
      var xx = i % w, yy = (i / w) | 0;
      dsum += dm.d[clamp(((yy + 0.5) / h * dm.h) | 0, 0, dm.h - 1) * dm.w + clamp(((xx + 0.5) / w * dm.w) | 0, 0, dm.w - 1)];

    // самого здания — фон без здания. Здание поверх едет жёстко и открывает этот фон.
    function pixelsOf(im) {
      var cc = document.createElement('canvas');
      cc.width = w; cc.height = h;
      var x2 = cc.getContext('2d', { willReadFrequently: true });
      x2.drawImage(im, 0, 0, w, h);
      return { cv: cc, ctx: x2, id: x2.getImageData(0, 0, w, h) };
    }
    var G = pixelsOf(frameImg), gp = G.id.data, bp = pixelsOf(bgImg).id.data;
    var hole = new Uint8Array(n);
    for (i = 0; i < n; i++) hole[i] = px[i * 4 + 3];
    boxBlur(hole, w, h, 3); // маска чуть шире здания: его ореол в землю не попадает
    for (i = 0; i < n; i++) {
      var ha = Math.min(255, hole[i] * 3) / 255;
      if (ha <= 0) continue;
      gp[i * 4] = gp[i * 4] * (1 - ha) + bp[i * 4] * ha;
      gp[i * 4 + 1] = gp[i * 4 + 1] * (1 - ha) + bp[i * 4 + 1] * ha;
      gp[i * 4 + 2] = gp[i * 4 + 2] * (1 - ha) + bp[i * 4 + 2] * ha;
    }
    G.ctx.putImageData(G.id, 0, 0);

    ctx.putImageData(id, 0, 0);
    return { src: c, ground: G.cv, win: { w: w, h: h, d: win }, meanD: meanD };
  }

  function makeThumb(img) {
    var c = document.createElement('canvas'), w = 180, h = Math.round(w * img.naturalHeight / img.naturalWidth);
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    try { return c.toDataURL('image/jpeg', 0.7); } catch (e) { return ''; }
  }

  // (окна башни: analyzeBuilding даёт bld.win — мягкая маска)
  // ---------- окружение кадра: небо, деревья (ветер), окна, лампы ----------
  // Маски строит tools/build_env_masks.py: <имя>_env.png (R небо, G высота дерева, B фаза дерева)
  // и <имя>_win2.png (окна других зданий). Для GPU всё хранится вдвое мельче — этого хватает.
  function rng(seed) { // mulberry32: одинаковые «случайные» окна при каждом запуске
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rand(R, a, b) { return a + (b - a) * R(); }

  function readChannels(img, w, h) { // RGBA -> Uint8Array RGBA нужного размера
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, w, h);
    return x.getImageData(0, 0, w, h).data;
  }

  function halfMax(src, w, h, stride, ch) { // уменьшение вдвое, берём максимум 2×2 (маска окон не тает)
    var w2 = (w + 1) >> 1, h2 = (h + 1) >> 1, out = new Uint8Array(w2 * h2), x, y;
    for (y = 0; y < h2; y++) for (x = 0; x < w2; x++) {

    }
    return out;
  }

  // Каждое связное пятно маски — одно окно: индексы пикселей + сила маски в них. Форма проверяется
  // (окно — не длинная линия), «кольцо» по контуру заливается целиком, чтобы светилось всё окно.
  function labelWindows(mask, w, h, thr) {
    var n = w * h, lab = new Int32Array(n), stack = new Int32Array(n), out = [], nl = 0, i;
    for (i = 0; i < n; i++) {
      if (lab[i] || mask[i] <= thr) continue;
      var sp = 0, list = [], x0 = w, x1 = 0, y0 = h, y1 = 0;
      stack[sp++] = i; lab[i] = ++nl;
      while (sp) {
        var p = stack[--sp], x = p % w, y = (p / w) | 0;
        list.push(p);
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && !lab[p - 1] && mask[p - 1] > thr) { lab[p - 1] = nl; stack[sp++] = p - 1; }
        if (x < w - 1 && !lab[p + 1] && mask[p + 1] > thr) { lab[p + 1] = nl; stack[sp++] = p + 1; }
        if (y > 0 && !lab[p - w] && mask[p - w] > thr) { lab[p - w] = nl; stack[sp++] = p - w; }
        if (y < h - 1 && !lab[p + w] && mask[p + w] > thr) { lab[p + w] = nl; stack[sp++] = p + w; }
      }
      var bw = x1 - x0 + 1, bh = y1 - y0 + 1, aspect = bw / bh;
      if (list.length < 4 || bw * bh > 900 || aspect > 3.2 || aspect < 0.3) continue; // мусор, слипшиеся пятна и линии — не окна
      // заливка по строкам между крайними пикселями окна

  var needsPermission = hasOrientation && typeof DeviceOrientationEvent.requestPermission === 'function';
  // кнопка наклона нужна только на устройствах с пальцем (на ПК Chrome тоже знает requestPermission)
  var isTouchDevice = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches
    : (('ontouchstart' in window) || (navigator.maxTouchPoints > 0));

  if (needsPermission && isTouchDevice) {
    // iOS: разрешение можно запросить только из нажатия пользователя.
    gyroBtn.hidden = false;
    gyroBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      // requestPermission вызываем синхронно в обработчике тапа — иначе iOS откажет.
      DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state === 'granted') startGyro();
        hideGyroBtn(); // отказ — кнопка исчезает, остаётся управление пальцем
      }).catch(function (err) {
        console.warn('Гироскоп: разрешение не выдано —', err && err.message);
        hideGyroBtn();
      });
    });
  } else if (hasOrientation && isTouchDevice) {
    if (window.isSecureContext === false) {
      // Без https iOS вообще не отдаёт события наклона и не показывает
      // запрос — кнопку показываем, а по тапу честно объясняем причину.
      gyroBtn.hidden = false;
      gyroBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        console.warn('Гироскоп недоступен: страница открыта не по https (небезопасный контекст).');
        setHint('gyroNeedsHttps');
        hideGyroBtn();
      });
    } else {
      startGyro(); // Android и прочие — разрешение не нужно
    }
  }

  // ---------- ночные эффекты, ветер, контроль fps ----------
  var fx = {
    windAmp: 0, windOn: true,
    shoot: [0, 0, 0, 0], shootP: -1, shootLen: 0.3,
    lampH: new Float32Array(48), lampB: new Float32Array(48)
  };
  var perfLevel = 0;                 // 0 — всё; 1 — ветер выключен; 2 — ещё и падающие звёзды
  var perfOn = !/[?&]perf=0/.test(location.search);
  var fpsFrames = 0, fpsT0 = 0, perfSince = 0;
  var nextToggleAt = 0, nextShootAt = 0, shootT0 = -1, secondPending = false;
  var fxRng = rng(99);

  // Куда на экране (доли ширины/высоты сцены) попадёт точка картинки при текущем сдвиге — та же формула, что в шейдере.
  function projectImg(u, v, d, k, sx, sy, zoom) {
    var z = 1 + zoom * d, S = CONFIG.BASE_SCALE;
    var px = 0.5 + (u + k * sx - 0.5) * z, py = 0.5 + (v + k * sy - 0.5) * z;
    px = 0.5 + (px - 0.5) * S; py = 0.5 + (py - 0.5) * S;
    return [(px - coverOffX) / coverUvW, (py - coverOffY) / coverUvH];
  }

  // Фонари: ореол у лампы и светлое пятно на земле под ней; «дыхание» яркости ±8%, у каждого свой период 4–6 с.
  function fillLamps(fa, fb, mix, sx, sy, zoom, tAmb) {
    var H = fx.lampH, B = fx.lampB, n = 0;
    function add(f, wgt) {
      if (!f || wgt <= 0.001) return;
      f.lamps.forEach(function (l) {
        if (n >= 16) return;
        var gate = clamp((tod.n - l.delay) / (1 - CONFIG.TOD_SPREAD), 0, 1);
        var I = gate * (1 + CONFIG.LAMP_BREATH * Math.sin(tAmb * 2 * Math.PI / l.period + l.phase)) * wgt;
        var h = projectImg(l.hu, l.hv, l.hd, l.hd * 2 - 1, sx, sy, zoom);
        var b = projectImg(l.bu, l.bv, l.bd, l.bd * 2 - 1, sx, sy, zoom);
        H[n * 3] = h[0]; H[n * 3 + 1] = 1 - h[1]; H[n * 3 + 2] = I;
        B[n * 3] = b[0]; B[n * 3 + 1] = 1 - b[1]; B[n * 3 + 2] = I;
        n++;
      });
    }
    add(fa, fb ? 1 - mix : 1);
    add(fb, mix);
    for (; n < 16; n++) { H[n * 3 + 2] = 0; B[n * 3 + 2] = 0; }
  }

  // Окна, раз в 8–12 с одно случайное окно плавно зажигается/гаснет (1.5 с); падающие звёзды раз в 40–60 с.
  function stepNightFx(fa, fb, now) {
    [fa, fb].forEach(function (f) {
      if (f && updateWindows(f, tod.n, now)) f.emDirty = true;
    });
    if (tod.n > 0.6) {
      if (nextToggleAt === 0) nextToggleAt = now + rand(fxRng, CONFIG.WINDOW_TOGGLE_S[0], CONFIG.WINDOW_TOGGLE_S[1]) * 1000;
      else if (now >= nextToggleAt) {
        if (!fb && fa.wins.length) {
          var towerOnly = fa.wins.filter(function (w) { return w.ch === 0; });
          var pool = (towerOnly.length && fxRng() < 0.75) ? towerOnly : fa.wins;
          var w = pool[(fxRng() * pool.length) | 0];
          w.on = !w.on; w.animFrom = w.cur; w.animT0 = now;
        }
        nextToggleAt = now + rand(fxRng, CONFIG.WINDOW_TOGGLE_S[0], CONFIG.WINDOW_TOGGLE_S[1]) * 1000;
      }
    } else nextToggleAt = 0;

    if (perfLevel < 2 && tod.n > 0.7) {
      if (shootT0 < 0) {
        if (nextShootAt === 0) nextShootAt = now + rand(fxRng, CONFIG.SHOOT_EVERY_S[0], CONFIG.SHOOT_EVERY_S[1]) * 1000;
        else if (now >= nextShootAt) {
          var dirX = (fxRng() < 0.5 ? -1 : 1) * rand(fxRng, 0.75, 0.95), dirY = rand(fxRng, 0.30, 0.48);
          fx.shoot = [rand(fxRng, 0.2, 0.8), rand(fxRng, 0.04, 0.3), dirX, dirY];
          shootT0 = now;
          if (!secondPending && fxRng() < 0.4) { secondPending = true; nextShootAt = now + rand(fxRng, 1500, 3000); }
          else { secondPending = false; nextShootAt = now + rand(fxRng, CONFIG.SHOOT_EVERY_S[0], CONFIG.SHOOT_EVERY_S[1]) * 1000; }
        }
      }
    } else { nextShootAt = 0; }
    if (shootT0 >= 0) {
      var p = (now - shootT0) / CONFIG.SHOOT_MS;
      if (p >= 1 || perfLevel >= 2) { shootT0 = -1; fx.shootP = -1; } else fx.shootP = p;
    } else fx.shootP = -1;
  }

  // Цель — 60 fps. Если средний fps ниже PERF_MIN_FPS (45): сначала выключаем ветер, потом падающие звёзды.
  function perfCheck(now, busy) {
    if (!perfOn) return;
    if (!perfSince) perfSince = now;
    if (busy || !fpsT0 || now - perfSince < 4000) { fpsT0 = now; fpsFrames = 0; return; } // разогрев 4 с, переходы, чтение — не считаем
    fpsFrames++;
    var dt = now - fpsT0;
    if (dt >= 2500) {
      var fps = fpsFrames * 1000 / dt;
      if (fps < CONFIG.PERF_MIN_FPS && perfLevel < 2 && document.visibilityState === 'visible') {
        perfLevel++;
        console.info('fps ' + fps.toFixed(1) + ' < ' + CONFIG.PERF_MIN_FPS + ' -> отключаю ' + (perfLevel === 1 ? 'ветер' : 'падающие звёзды'));
      }
      fpsT0 = now; fpsFrames = 0;
    }
  }

  // ---------- рендер-цикл ----------
  var t0 = performance.now();
  var lastNow = null;
  var lastDraw = null;
  var swayMix = 0, swayPhase = 0;

  function frame(now) {
    var dt = lastNow === null ? 16.667 : clamp(now - lastNow, 1, 64);
    lastNow = now;
    var rm = reduced();
    var t = rm ? 0 : (now - t0) / 1000;   // облака замирают при «уменьшении движения»
    var retMs = CONFIG.RETURN_MS;

    // --- кроссфейд ---
    if (fade) {
      if (fade.t0 === null) fade.t0 = now;
      var p = (now - fade.t0) / CONFIG.FRAME_CROSSFADE_MS;
      if (p >= 1) {
        frameIndex = fade.to;
        fade = null;
        mixState = 0;
        markDot(frameIndex);
        buildHotspots(frameIndex);
      } else {
        mixState = clamp(EASE(p), 0, 1);
      }
    }

    // --- время суток ---
    if (todAnim) {
      if (todAnim.t0 === null) todAnim.t0 = now;
      var tp = (now - todAnim.t0) / CONFIG.TOD_MS;
      var te = EASE(tp);
      tod.s = clamp(todAnim.s0 + (todAnim.s1 - todAnim.s0) * te, 0, 1);
      tod.n = clamp(todAnim.n0 + (todAnim.n1 - todAnim.n0) * te, 0, 1);
      if (tp >= 1) todAnim = null;
    }

    // Пока открыта карточка подсказки, картинка за ней стоит: точки и карточка не «плывут» за мышью,
    // GPU не тратится на размытый фон.
    if (stage.classList.contains('reading') && !fade && !todAnim) { fpsT0 = 0; requestAnimationFrame(frame); return; }

    // --- наклон ---
    if (ret) {
      if (ret.t0 === null) ret.t0 = now;
      var e = EASE((now - ret.t0) / retMs);
      curX = ret.fx + (targetX - ret.fx) * e;
      curY = ret.fy + (targetY - ret.fy) * e;
      if (now - ret.t0 >= CONFIG.RETURN_MS) ret = null;
    } else if (pointerActive) {
      var kf = lerpK(0.35, dt); // палец: почти без отставания
      curX += (targetX - curX) * kf;
      curY += (targetY - curY) * kf;
    } else {
      var ks = lerpK(CONFIG.SMOOTH, dt);
      curX += (targetX - curX) * ks;
      curY += (targetY - curY) * ks;
    }

    // --- автопокачивание: 3 с без касаний/мыши/наклона -> качаемся (период 8 с, 40% максимума);
    // любое действие гасит его быстро, после 3 с покоя оно снова плавно входит. Выключено — стоит.
    // «Уменьшение движения» на автопокачивание не влияет: у него есть свой переключатель в панели.
    var swayOn = swayEnabled && (performance.now() - lastInputAt) > CONFIG.IDLE_SWAY_AFTER_MS;
    swayMix += ((swayOn ? 1 : 0) - swayMix) * lerpK(swayOn ? 0.035 : 0.14, dt);
    if (!swayEnabled) swayMix = 0;
    if (swayMix > 0.002) swayPhase += dt * 2 * Math.PI / (CONFIG.SWAY_PERIOD_S * 1000);
    var swayAmp = CONFIG.SWAY_AMPLITUDE * swayMix;
    var swayX = swayAmp * Math.sin(swayPhase);
    var swayY = swayAmp * 0.8 * Math.sin(swayPhase + Math.PI / 2);
    var tiltX = clamp(curX + swayX, -1, 1);
    var tiltY = clamp(curY + swayY, -1, 1);

    var ba = rm ? 0 : CONFIG.BREATH_AMPLITUDE;
    var breathX = ba * Math.sin(t * 2 * Math.PI / CONFIG.BREATH_PERIOD_S);
    var breathY = ba * Math.cos(t * 2 * Math.PI / (CONFIG.BREATH_PERIOD_S * 0.7));
    var shiftX = tiltX * CONFIG.MAX_SHIFT_X + breathX;
    var shiftY = tiltY * CONFIG.MAX_SHIFT_Y + breathY;
    // наклон к себе (вниз) — ближние части чуть увеличиваются
    var zoom = CONFIG.ZOOM_NEAR * clamp(tiltY, 0, 1);

    resize(false);

    var fa = store[fade ? fade.from : frameIndex];
    var fb = fade ? store[fade.to] : null;

    if (useGL) {
      var tAmb = (now - t0) / 1000; // настоящее время: ветер, мерцание звёзд, «дыхание» фонарей
      fx.windOn = CONFIG.WIND && perfLevel < 1;
      fx.windAmp = CONFIG.WIND_AMP_PX * (coverUvW / CONFIG.BASE_SCALE) / Math.max(1, stage.clientWidth);
      stepNightFx(fa, fb, now);
      fillLamps(fa, fb, mixState, shiftX, shiftY, zoom, tAmb);
      stage.classList.toggle('is-night', tod.n > 0.5);
      perfCheck(now, !!(fade || todAnim));
      lastDraw = { fa: fa, fb: fb, mix: mixState, shiftX: shiftX, shiftY: shiftY, zoom: zoom, t: t, tAmb: tAmb };
      if (!glLost) drawGL(fa, fb, mixState, shiftX, shiftY, zoom, t, tAmb);
    } else {
      var cssW = stage.clientWidth, cssH = stage.clientHeight;
      var kb = CONFIG.FALLBACK_LAYER_K;
      var ia = fade ? fade.from : frameIndex, ib = fade ? fade.to : -1;
      fbFrames.forEach(function (ff, i) {
        var on = i === ia || i === ib;
        ff.el.style.opacity = i === ia ? '1' : (i === ib ? String(mixState) : '0');
        ff.el.style.visibility = on ? 'visible' : 'hidden';
        if (!on) return;
        var bx = (kb * shiftX / coverUvW) * cssW, by = (kb * shiftY / coverUvH) * cssH;
        ff.bld.style.transform = 'translate(' + bx + 'px,' + by + 'px) scale(' + CONFIG.BASE_SCALE + ')';
        ff.bg.style.transform = 'translate(' + (-bx) + 'px,' + (-by) + 'px) scale(' + CONFIG.BASE_SCALE + ')';
      });
    }

    if (!fade) updateHotspotPositions(shiftX, shiftY, useGL ? zoom : 0);

    requestAnimationFrame(frame);
  }

  // ---------- панель: время суток, миниатюры, настройки, открытка ----------
  var bodyEl = document.body;
  var desktopMQ = window.matchMedia('(min-width: 1024px)');
  var scrimEl = document.getElementById('scrim');
  var thumbsEl = document.getElementById('thumbs');

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  // Выделение меняется мгновенно, в том же кадре, что и запуск смены (без CSS-перехода фона —
  // в WebKit он не перерисовывался, пока рядом рисует WebGL); reflow принудительно.
  function segMark(segId, attr, value) {
    var seg = document.getElementById(segId);
    seg.querySelectorAll('button').forEach(function (b) {
      var on = b.getAttribute(attr) === value;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    void seg.offsetWidth;
  }

  // свернуть/развернуть (ПК) и шторка (телефон)
  if (lsGet('chka-panel') === 'collapsed') bodyEl.classList.add('panel-collapsed');
  function closeSheet() { bodyEl.classList.remove('sheet-open'); }
  panelBtn.addEventListener('click', function () {
    if (desktopMQ.matches) lsSet('chka-panel', bodyEl.classList.toggle('panel-collapsed') ? 'collapsed' : 'open');
    else bodyEl.classList.toggle('sheet-open');
  });
  scrimEl.addEventListener('click', closeSheet);
  (desktopMQ.addEventListener ? desktopMQ.addEventListener('change', closeSheet) : desktopMQ.addListener(closeSheet));

  // время суток: плавная смена за TOD_MS
  var TOD_TARGET = { day: [0, 0], sunset: [1, 0], night: [0, 1] };
  var todAnim = null;
  function setTod(name) {
    var t = TOD_TARGET[name];
    if (!t) return;
    todAnim = { t0: null, s0: tod.s, n0: tod.n, s1: t[0], n1: t[1] };
    segMark('todSeg', 'data-tod', name);
    if (!useGL) fbEl.setAttribute('data-tod', name);
  }
  document.querySelectorAll('#todSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setTod(b.getAttribute('data-tod')); });
  });

  // миниатюры кадров
  function buildThumbs() {
    thumbsEl.innerHTML = '';
    FRAMES.forEach(function (_, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = i === frameIndex ? 'on' : '';
      b.setAttribute('aria-label', (i + 1) + ' / ' + FRAMES.length);
      var im = new Image();
      im.alt = ''; im.src = store[i].thumb;
      b.appendChild(im);
      b.addEventListener('click', function () { goTo(i); });
      thumbsEl.appendChild(b);
    });
  }

  // автопокачивание вкл/выкл
  var swayEnabled = true;
  var swayBtn = document.getElementById('swayToggle');
  swayBtn.addEventListener('click', function () {
    swayEnabled = !swayEnabled;
    swayBtn.classList.toggle('on', swayEnabled);
    swayBtn.setAttribute('aria-checked', swayEnabled ? 'true' : 'false');
    if (swayEnabled) lastInputAt = performance.now(); // снова ждём 3 с тишины
  });

  // полный экран
  var fsBtn = document.getElementById('fsBtn');
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true; // iPhone не умеет
  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  });

  // открытка: PNG текущего вида + подпись карандашным шрифтом внизу
  var cardBtn = document.getElementById('cardBtn');
  if (!useGL) cardBtn.hidden = true;
  cardBtn.addEventListener('click', function () {
    if (!useGL || glLost || !lastDraw) return;
    var d = lastDraw;
    // Буфер WebGL читается только сразу после отрисовки — рисуем ещё раз и копируем тут же.
    // Для открытки рисуем крупнее (~1080 px по ширине), потом возвращаем размер холста.
    var W0 = canvas.width, H0 = canvas.height, kq = clamp(1080 / W0, 1, 2.5);
    canvas.width = Math.round(W0 * kq); canvas.height = Math.round(H0 * kq);
    drawGL(d.fa, d.fb, d.mix, d.shiftX, d.shiftY, d.zoom, d.t, d.tAmb);
    var W = canvas.width, H = canvas.height;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.drawImage(canvas, 0, 0);
    canvas.width = W0; canvas.height = H0; // следующий кадр цикла перерисует холст
    var caption = CONFIG.UI_I18N.title[currentLang] + ' · chka.am';
    var ready = (document.fonts && document.fonts.load) ? document.fonts.load('700 40px Caveat', caption).catch(function () {}) : Promise.resolve();
    ready.then(function () {
      var capH = Math.round(H * 0.085), lw = Math.max(2, Math.round(W / 300));
      x.fillStyle = '#f5ecda';
      x.fillRect(0, H - capH, W, capH);
      x.fillStyle = 'rgba(47,42,37,0.75)';
      x.fillRect(0, H - capH, W, lw); // карандашная черта над подписью
      var fs = Math.round(capH * 0.6);
      x.font = '700 ' + fs + 'px Caveat, "Comic Sans MS", cursive';
      while (x.measureText(caption).width > W * 0.92 && fs > 10) { fs -= 2; x.font = '700 ' + fs + 'px Caveat, "Comic Sans MS", cursive'; }
      x.fillStyle = '#2f2a25';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(caption, W / 2, H - capH / 2 + lw);
      c.toBlob(function (blob) {
        if (!blob) return;
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kukuruznik-1979.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      }, 'image/png');
    });
  });

  // размер текста: крупный (по умолчанию) / обычный
  function setTextSize(v) {
    v = v === 'normal' ? 'normal' : 'large';
    document.documentElement.setAttribute('data-textsize', v);
    segMark('sizeSeg', 'data-size', v);
    lsSet('chka-textsize', v);
  }
  document.querySelectorAll('#sizeSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setTextSize(b.getAttribute('data-size')); });
  });
  setTextSize(lsGet('chka-textsize'));

  // ---------- старт ----------
  // Сначала грузим и декодируем ВСЕ кадры, только потом показываем первый.
  Promise.all(FRAMES.map(function (_, i) { return preloadFrame(i); })).then(function () {
    if (!useGL) buildFallbackDom();
    setNaturalSize(store[0].w, store[0].h);
    buildDots();
    buildThumbs();
    buildHotspots(0);
    lastInputAt = performance.now();
    frame(performance.now());            // первая отрисовка, потом убираем экран загрузки —
    stage.classList.remove('loading');   // пустого кадра не бывает, даже если вкладка в фоне
  }).catch(function (err) {
    console.error(err);
    loader.textContent = 'Не удалось загрузить кадры: ' + (err && err.message ? err.message : err);
  });

})();
</script>
</body>
</html>
