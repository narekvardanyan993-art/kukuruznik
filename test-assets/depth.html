<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D-фото — тест параллакса глубины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5ecda; --paper-2: #ede0c2; --ink: #2f2a25;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);   /* одна кривая для всех анимаций */
    --panelW: 320px;
    --fs-body: 18px; --fs-small: 15px; --fs-card: 22px;
  }
  /* Размер текста: «крупный» по умолчанию (аудитория пожилая). */
  html[data-textsize="normal"] { --fs-body: 15px; --fs-small: 13px; --fs-card: 17px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Armenian", sans-serif;
    overscroll-behavior: none;
  }
  body { user-select: none; }
  #layout { height: 100%; }
  #view { height: 100%; }
  #stage {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: none;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  /* Телефон (до 1024 px): картинка на весь экран, WebGL сам обрезает кадр
     по принципу "cover" (uCoverScale/uCoverOffset), без искажения. */

  /* ПК (от 1024 px): слева панель 320 px, справа картинка по центру с
     бумажными полями. Панель сворачивается в тонкую полоску. */
  @media (min-width: 1024px) {
    #layout {
      display: grid; grid-template-columns: var(--panelW) 1fr;
      transition: grid-template-columns 350ms var(--ease);
    }
    body.panel-collapsed { --panelW: 48px; }
    #view {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; min-width: 0;
    }
    #stage {
      width: min(100%, calc((100vh - 48px) * var(--natW, 768) / var(--natH, 1365)));
      width: min(100%, calc((100dvh - 48px) * var(--natW, 768) / var(--natH, 1365)));
      height: auto;
      aspect-ratio: var(--natW, 768) / var(--natH, 1365);
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(47,42,37,0.35), 0 14px 44px rgba(60,45,20,0.28);
    }
  }

  #stage.loading #gl, #stage.loading #fallback { visibility: hidden; }
  /* Простой бумажный экран, пока все кадры и карты глубины не загружены
     и не декодированы (иначе картинка мигает при смене кадра). Сплошной
     фон, без прозрачности, поверх всего. */
  #loader {
    position: absolute; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: rgba(47,42,37,0.7);
    font: 700 26px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    transition: opacity 300ms var(--ease);
  }
  #stage:not(.loading) #loader { opacity: 0; pointer-events: none; }

  /* Откат без WebGL: два слоя (фон + здание) на кадр, двигаются CSS-ом. */
  #fallback { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #fallback[hidden] { display: none; }
  .fb-frame { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .fb-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; will-change: transform; pointer-events: none;
  }

  /* Меню в тон скетча: бумажный фон, крупно — аудитория пожилая. */
  #topBar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 8;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(rgba(245,236,218,0.92), rgba(245,236,218,0.55) 80%, transparent);
  }
  #backLink {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(47,42,37,0.08);
    color: var(--ink); text-decoration: none;
    font: 600 16px/1 -apple-system, BlinkMacSystemFont, "Noto Sans Armenian", sans-serif;
  }
  #backLink:active { background: rgba(47,42,37,0.18); }
  #pageTitle {
    flex: 1; min-width: 0;
    font: 700 24px/1.15 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(20, 16, 8, 0.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: none; color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background 250ms var(--ease), opacity 250ms var(--ease);
  }
  .nav-btn:hover { background: rgba(20, 16, 8, 0.55); }
  .nav-btn:active { background: rgba(20, 16, 8, 0.7); }
  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }

  #dots {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 5;
  }
  #dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 250ms var(--ease), transform 250ms var(--ease);
  }
  #dots span.on { background: #fff; transform: scale(1.25); }

  /* Кнопка гироскопа в стиле меню (бумага + чернила, как «на сайт»).
     На iPhone разрешение можно запросить только по нажатию. */
  #gyroBtn {
    position: absolute; left: 50%; z-index: 9;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
    transform: translateX(-50%);
    padding: 12px 22px; border: none; border-radius: 14px;
    background: rgba(245,236,218,0.96); color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    font: 700 22px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    white-space: nowrap; cursor: pointer;
  }
  #gyroBtn[hidden] { display: none; }
  #gyroBtn:active { background: rgba(232,221,196,0.98); }

  #build-version {
    position: absolute; right: 8px; bottom: 4px; z-index: 5;
    font: 500 9px/1 -apple-system, sans-serif; color: #fff; opacity: 0.55;
    pointer-events: none;
  }

  /* ---------- Панель (скетч-стиль: бумага, карандашная рамка, мягкая тень) ---------- */
  .sketch {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;
    box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14);
    outline: 1px solid rgba(47,42,37,0.3); outline-offset: -7px;
  }
  #panel { position: relative; overflow: hidden; z-index: 50; }
  .panel-card {
    position: absolute; top: 16px; bottom: 16px; left: 16px; width: 288px;
    overflow-y: auto; padding: 16px 16px 14px; font-size: var(--fs-body);
    transition: opacity 300ms var(--ease), transform 350ms var(--ease);
    scrollbar-width: thin;
  }
  body.panel-collapsed .panel-card { opacity: 0; transform: translateX(-24px); pointer-events: none; }
  .p-title { font: 700 32px/1.1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif; display: block; margin: 0 26px 8px 0; }
  .p-sec { margin: 0 0 14px; }
  .p-sec h3 { margin: 0 0 6px; font: 700 26px/1.1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif; }
  .seg { display: flex; gap: 0; border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 9px 4px; border: none; border-right: 1px solid rgba(47,42,37,0.5);
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 var(--fs-small)/1.1 -apple-system, "Noto Sans Armenian", sans-serif;
    transition: background 250ms var(--ease), color 250ms var(--ease);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  #thumbs button {
    padding: 0; border: 2px solid rgba(47,42,37,0.35); border-radius: 8px 4px 8px 4px;
    overflow: hidden; cursor: pointer; background: #000; aspect-ratio: 4 / 5;
    transition: border-color 250ms var(--ease), transform 250ms var(--ease);
  }
  #thumbs button img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; }
  #thumbs button.on { border-color: var(--ink); transform: scale(1.04); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .p-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch {
    flex: none; width: 54px; height: 30px; border-radius: 15px; border: 2px solid var(--ink);
    background: transparent; position: relative; cursor: pointer;
    transition: background 250ms var(--ease);
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--ink); transition: transform 250ms var(--ease), background 250ms var(--ease);
  }
  .switch.on { background: var(--ink); }
  .switch.on::after { transform: translateX(24px); background: var(--paper); }
  .p-btn {
    display: block; width: 100%; padding: 11px 12px; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px;
    background: transparent; color: var(--ink); text-align: center;
    font: 700 var(--fs-body)/1.1 -apple-system, "Noto Sans Armenian", sans-serif;
    transition: background 250ms var(--ease), color 250ms var(--ease);
  }
  .p-btn:hover { background: var(--ink); color: var(--paper); }
  .p-btn[hidden] { display: none; }
  .p-about p { margin: 0 0 6px; font-size: var(--fs-small); line-height: 1.35; }
  .p-about a { color: var(--ink); font-weight: 700; font-size: var(--fs-small); }

  /* кнопка панели: на ПК — стрелка свернуть/развернуть, на телефоне — круглая кнопка снизу слева */
  #panelBtn {
    position: fixed; z-index: 60; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; padding: 0; font: 700 22px/1 -apple-system, sans-serif;
    box-shadow: 0 6px 16px rgba(60,45,20,0.3), 2px 3px 0 rgba(47,42,37,0.14);
    display: flex; align-items: center; justify-content: center;
    transition: left 350ms var(--ease), transform 350ms var(--ease), background 250ms var(--ease);
  }
  #panelBtn:active { background: var(--paper-2); }
  #panelBtn .ic-arrow { display: none; }
  #scrim { display: none; }

  @media (min-width: 1024px) {
    #panelBtn {
      top: 26px; left: calc(var(--panelW) - 46px); width: 34px; height: 34px; border-radius: 50% 40% 50% 40%;
    }
    #panelBtn .ic-menu { display: none; }
    #panelBtn .ic-arrow { display: block; transition: transform 350ms var(--ease); }
    body.panel-collapsed #panelBtn { left: 7px; }
    body.panel-collapsed #panelBtn .ic-arrow { transform: rotate(180deg); }
  }

  /* Телефон: та же панель, свёрнутая в круглую кнопку; по тапу выезжает снизу шторкой на 60% высоты */
  @media (max-width: 1023.98px) {
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; height: 60dvh; overflow: visible;
      transform: translateY(108%); transition: transform 400ms var(--ease); z-index: 70;
    }
    body.sheet-open #panel { transform: none; }
    .panel-card {
      left: 8px; right: 8px; top: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: auto;
      border-radius: 22px 22px 12px 12px / 18px 18px 12px 12px; padding-top: 18px;
    }
    #panelBtn {
      left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 54px; height: 54px; border-radius: 50%;
    }
    body.sheet-open #panelBtn { transform: scale(0.9); }
    #scrim {
      display: block; position: fixed; inset: 0; z-index: 65; background: rgba(20,16,8,0.32);
      opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
    }
    body.sheet-open #scrim { opacity: 1; pointer-events: auto; }
  }

  /* без WebGL время суток — CSS-фильтром (окна ночью не светятся) */
  .fb-frame { transition: filter 1200ms var(--ease); }
  #fallback[data-tod="sunset"] .fb-frame { filter: sepia(0.55) saturate(1.5) hue-rotate(-12deg) brightness(0.93); }
  #fallback[data-tod="night"] .fb-frame { filter: brightness(0.38) sepia(0.35) hue-rotate(185deg) saturate(1.5); }

  #hint {
    position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%);
    z-index: 5; font-size: 12px; color: #fff; text-align: center; max-width: calc(100% - 24px);
    background: rgba(20, 16, 8, 0.4); padding: 6px 12px; border-radius: 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0.9; pointer-events: none;
    transition: opacity 450ms var(--ease);
  }
  #hint.gone { opacity: 0; }

  /* Точки-подсказки: маленький пульсирующий маркер, привязанный к
     объекту на слое (двигается вместе с ним при параллаксе — позиция
     считается в JS той же формулой смещения, что и в шейдере). */
  /* Птицы в небе — единственная анимация помимо теней облаков, летят
     медленно и независимо от параллакса (они и так на предельно
     дальнем плане, где смещение практически нулевое). */
  #birds { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .bird {
    position: absolute; left: -10%; top: var(--y, 10%);
    width: 26px; height: 13px;
    fill: none; stroke: #3a332a; stroke-width: 1.4; stroke-linecap: round;
    opacity: 0.5;
    animation: birdFly var(--fly-dur, 42s) linear infinite;
    animation-delay: var(--fly-delay, 0s);
  }
  @keyframes birdFly {
    0%   { left: -10%; margin-top: 0; }
    48%  { margin-top: -9px; }
    50%  { left: 52%; }
    100% { left: 112%; margin-top: 0; }
  }

  #hotspots { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .hs-dot {
    position: absolute; top: 0; left: 0;
    width: 22px; height: 22px; margin: -11px;
    border: none; padding: 0; background: none;
    pointer-events: auto; cursor: pointer;
    opacity: 0; transition: opacity 400ms var(--ease);
  }
  .hs-dot.show { opacity: 1; }
  .hs-dot::before, .hs-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .hs-dot::before {
    width: 10px; height: 10px;
    background: #fff; border: 2px solid rgba(20,16,8,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hs-dot::after {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.7);
    animation: hsPulse 2.2s var(--ease) infinite;
  }
  @keyframes hsPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  /* Карточка подсказки: бумага, крупный текст, растёт из точки (0.9 -> 1, 350 мс),
     закрывается за 300 мс. Фон за ней темнеет/размывается/обесцвечивается. */
  #hsPopup {
    position: absolute; z-index: 7;
    width: max-content; max-width: min(84vw, 360px);
    padding: 16px 18px 14px;
    font-size: var(--fs-card); line-height: 1.35; color: var(--ink);
    --shift: 0px;
    transform-origin: calc(50% - var(--shift)) calc(100% + 16px);
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(0.9);
    opacity: 0; pointer-events: none;
    transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  #hsPopup.show {
    opacity: 1; pointer-events: auto;
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(1);
    transition-duration: 350ms;
  }
  /* точка у верхнего края — карточка раскрывается вниз */
  #hsPopup.below { transform-origin: calc(50% - var(--shift)) -16px; transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(0.9); }
  #hsPopup.below.show { transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(1); }
  #hsPopup::after {
    /* хвостик остаётся над точкой, даже если сам блок сдвинут от края */
    content: ''; position: absolute; left: calc(50% - var(--shift)); top: 100%;
    width: 14px; height: 14px; margin-left: -7px; margin-top: -8px;
    background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transform: rotate(45deg);
  }
  #hsPopup.below::after { top: 0; margin-top: -6px; border: none; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); }
  #hsText { margin-bottom: 12px; }
  #hsBack { display: inline-block; width: auto; padding: 8px 16px; font-size: var(--fs-small); }

  #gl, #fallback { transition: filter 400ms var(--ease); }
  #stage.reading #gl, #stage.reading #fallback { filter: brightness(0.6) saturate(0.4) blur(6px); }

  /* Уменьшение движения: без фоновых анимаций и плавных переходов */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important; scroll-behavior: auto !important;
    }
    .bird, .hs-dot::after { display: none; }
  }
</style>
</head>
<body>

<div id="layout">
<aside id="panel" aria-label="Menu">
  <div class="panel-card sketch">
    <span class="p-title" data-i18n="panelTitle">Кукурузник</span>
    <section class="p-sec">
      <h3 data-i18n="tod">Время суток</h3>
      <div class="seg" id="todSeg" role="group">
        <button type="button" data-tod="day" class="on" data-i18n="day">День</button>
        <button type="button" data-tod="sunset" data-i18n="sunset">Закат</button>
        <button type="button" data-tod="night" data-i18n="night">Ночь</button>
      </div>
    </section>
    <section class="p-sec">
      <h3 data-i18n="frames">Кадры</h3>
      <div id="thumbs"></div>
    </section>
    <section class="p-sec p-row">
      <span data-i18n="sway">Автопокачивание</span>
      <button type="button" id="swayToggle" class="switch on" role="switch" aria-checked="true" aria-label="Auto-sway"></button>
    </section>
    <section class="p-sec"><button type="button" id="fsBtn" class="p-btn" data-i18n="fullscreen">Полный экран</button></section>
    <section class="p-sec"><button type="button" id="cardBtn" class="p-btn" data-i18n="postcard">Сохранить открытку</button></section>
    <section class="p-sec">
      <h3 data-i18n="textSize">Размер текста</h3>
      <div class="seg" id="sizeSeg" role="group">
        <button type="button" data-size="large" class="on" data-i18n="sizeLarge">Крупный</button>
        <button type="button" data-size="normal" data-i18n="sizeNormal">Обычный</button>
      </div>
    </section>
    <section class="p-sec">
      <h3 data-i18n="language">Язык</h3>
      <div class="seg" id="langSeg" role="group">
        <button type="button" data-lang="hy">Հայ</button>
        <button type="button" data-lang="ru">Рус</button>
        <button type="button" data-lang="en">Eng</button>
      </div>
    </section>
    <section class="p-sec p-about">
      <h3 data-i18n="about">О здании</h3>
      <div id="aboutText"></div>
      <a id="aboutLink" href="../../kukuruznik/index.html" data-i18n="more">подробнее ›</a>
    </section>
  </div>
</aside>
<button type="button" id="panelBtn" aria-label="Menu"><span class="ic-menu">☰</span><span class="ic-arrow">‹</span></button>
<div id="scrim"></div>
<main id="view">
<div id="stage" class="loading">
  <div id="loader">загрузка…</div>
  <canvas id="gl"></canvas>
  <div id="fallback" hidden></div>
  <div id="topBar">
    <a id="backLink" href="../../kukuruznik/index.html">‹ <span id="backLinkText">на сайт</span></a>
    <div id="pageTitle">Кукурузник, 1979</div>
  </div>
  <button id="prevBtn" class="nav-btn" type="button" aria-label="Предыдущий кадр">‹</button>
  <button id="nextBtn" class="nav-btn" type="button" aria-label="Следующий кадр">›</button>
  <div id="dots"></div>
  <div id="birds" aria-hidden="true">
    <svg class="bird" style="--y:8%; --fly-dur:39s; --fly-delay:-4s" viewBox="0 0 24 12"><path d="M1,6 Q6,0 12,6 Q18,0 23,6"/></svg>

    'uniform vec2  uShift;',      // max-сдвиг * наклон + «дыхание», в долях картинки
    'uniform float uZoom;',       // добавка к масштабу для самых ближних (0..0.02)
    'uniform float uScale;',      // общий масштаб (1.05), чтобы не видеть краёв
    'uniform vec2  uCoverScale;', // "cover"-обрезка кадра под экран
    'uniform vec2  uCoverOffset;',
    'uniform float uTime;',
    '',
    // Мягкое пятно тени от облака: смещённый и чуть "разлохмаченный"
    // синусами круг, край размыт smoothstep — не ровный диск.
    'float blob(vec2 uv, vec2 center, vec2 radius) {',
    '  vec2 d = (uv - center) / radius;',
    '  float wobble = 0.15 * sin(d.x * 6.0 + center.x * 9.0) * sin(d.y * 5.0 + center.y * 7.0);',
    '  float dist = length(d) + wobble;',
    '  return smoothstep(1.0, 0.15, dist);',
    '}',
    // Две тени от облаков не спеша ползут по кадру слева направо,
    // один полный проход ~40с, без всякой другой анимации.
    'float cloudShadow(vec2 uv, float t) {',
    '  float cycle1 = 40.0;',
    '  float p1 = fract(t / cycle1);',
    '  float b1 = blob(uv, vec2(mix(-0.35, 1.35, p1), 0.58), vec2(0.30, 0.17));',
    '  float cycle2 = 53.0;',
    '  float p2 = fract((t + cycle1 * 0.5) / cycle2);',
    '  float b2 = blob(uv, vec2(mix(-0.35, 1.35, p2), 0.32), vec2(0.22, 0.13));',
    '  return clamp(b1 + b2, 0.0, 1.0);',
    '}',
    '',
    'vec4 sampleFrame(sampler2D bg, sampler2D depth, sampler2D bld, sampler2D win, vec2 kd, vec2 uv) {',
    // фон и земля: у каждого пикселя свой сдвиг (3 итерации против «резины» на краях)
    '  vec2 p = uv;',
    '  for (int i = 0; i < 3; i++) {',
    '    float d = texture2D(depth, p).r;',                  // 0 = далеко, 1 = близко
    '    float k = d * 2.0 - 1.0;',                           // -1..1, 0 — плоскость фокуса
    '    p = 0.5 + (uv - 0.5) / (1.0 + uZoom * d) - k * uShift;',
    '  }',
    '  vec3 col = texture2D(bg, clamp(p, 0.0, 1.0)).rgb;',
    // здание: один общий сдвиг и масштаб на весь предмет — жёсткое тело
    '  vec2 pb = 0.5 + (uv - 0.5) / (1.0 + uZoom * kd.y) - kd.x * uShift;',
    '  vec4 b = texture2D(bld, pb);',                         // цвет уже умножен на альфу
    '  col = b.rgb + col * (1.0 - b.a);',
    '  float w = texture2D(win, pb).r * b.a;',                // маска окон, едет вместе со зданием
    '  return vec4(col, w);',
    '}',
    '',
    'void main() {',
    '  vec2 uv = vUv * uCoverScale + uCoverOffset;',
    '  uv = 0.5 + (uv - 0.5) / uScale;',
    '  vec4 c = sampleFrame(uBgA, uDepthA, uBldA, uWinA, uKdA, uv);',
    '  if (uMix > 0.0) c = mix(c, sampleFrame(uBgB, uDepthB, uBldB, uWinB, uKdB, uv), uMix);',
    '  float shadow = cloudShadow(uv, uTime);',
    '  c.rgb *= (1.0 - 0.12 * shadow);',
    '  gl_FragColor = c;',
    '}'
  ].join('\n');

  // Время суток: цветовая обработка готовой картинки, новых кадров не нужно.
  var POST_FRAG = [
    'precision highp float;',
    'varying vec2 vTc;',
    'uniform sampler2D uScene;',
    'uniform float uSunset;',   // 0..1
    'uniform float uNight;',    // 0..1
    'float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }',
    'void main() {',
    '  vec4 s = texture2D(uScene, vTc);',
    '  vec3 c = s.rgb;',
    '  if (uSunset > 0.001) {',
    // тени длиннее: тёмное «стекает» вдоль направления от низкого солнца
    '    vec2 dir = vec2(1.0, -0.28) * 0.012;',
    '    float smear = 0.0;',
    '    for (int i = 1; i <= 10; i++) {',
    '      vec3 tap = texture2D(uScene, vTc - dir * float(i)).rgb;',
    '      smear += smoothstep(0.66, 0.34, lum(tap)) * (1.0 - float(i) / 11.0);',
    '    }',
    '    smear = clamp(smear / 4.0, 0.0, 1.0);',
    '    float l = lum(c);',
    '    vec3 warm = c * vec3(1.08, 0.86, 0.62);',                     // тёплый оранжевый тон
    '    warm *= 1.0 - 0.5 * smear;',                                  // длинные тени
    '    warm *= mix(1.0, 0.68, smoothstep(0.55, 0.25, l));',          // тени темнее
    '    c = mix(c, warm, uSunset);',
    '  }',
    '  if (uNight > 0.001) {',
    '    vec3 night = c * vec3(0.28, 0.34, 0.55);',                    // тёмно-синий, яркость ~35%
    '    night += vec3(1.0, 0.78, 0.38) * s.a * 0.95;',                // окна башни светятся тёплым
    '    night += vec3(1.0, 0.72, 0.32) * s.a * s.a * 0.25;',
    '    c = mix(c, night, uNight);',
    '  }',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  var scenePrg = null, postPrg = null;
  var US = {}, UP = {};
  var fbo = null, sceneTex = null, fboW = 0, fboH = 0;

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }

  function makeProgram(frag, names, out) {
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.bindAttribLocation(prog, 0, 'aPos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    names.forEach(function (n) { out[n] = gl.getUniformLocation(prog, n); });
    return prog;
  }

  function initGLProgram() {
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    scenePrg = makeProgram(SCENE_FRAG, ['uBgA', 'uDepthA', 'uBldA', 'uWinA', 'uBgB', 'uDepthB', 'uBldB', 'uWinB',
      'uKdA', 'uKdB', 'uMix', 'uShift', 'uZoom', 'uScale', 'uCoverScale', 'uCoverOffset', 'uTime'], US);
    // юниты: A = 0..3 (фон, глубина, здание, окна), B = 4..7. Сами текстуры
    // подставляются при отрисовке — подгрузки во время показа нет.
    ['uBgA', 'uDepthA', 'uBldA', 'uWinA', 'uBgB', 'uDepthB', 'uBldB', 'uWinB'].forEach(function (n, i) { gl.uniform1i(US[n], i); });
    gl.uniform1f(US.uScale, CONFIG.BASE_SCALE);

    postPrg = makeProgram(POST_FRAG, ['uScene', 'uSunset', 'uNight'], UP);
    gl.uniform1i(UP.uScene, 0);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    fbo = null; sceneTex = null; fboW = 0; fboH = 0;
  }

  function makeTexture(filter) {
    var tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    return tex;
  }

  function uploadL(d) { // одноканальная карта
    var tex = makeTexture(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, d.w, d.h, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, d.d);
    return tex;
  }

  // Заливает в GPU уже декодированные данные кадра. Вызывается один раз
  // при загрузке (и повторно, если iOS потеряет WebGL-контекст).
  function uploadFrame(f) {
    f.bgTex = makeTexture(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, f.bgSrc);
    f.depthTex = uploadL(f.depth);
    f.bldTex = makeTexture(gl.LINEAR);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true); // края здания без тёмной каймы
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, f.bldSrc);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    f.winTex = uploadL(f.win);
  }

  function bindFrame(f, unit0) {
    var t = [f.bgTex, f.depthTex, f.bldTex, f.winTex];
    for (var i = 0; i < 4; i++) {
      gl.activeTexture(gl.TEXTURE0 + unit0 + i);
      gl.bindTexture(gl.TEXTURE_2D, t[i]);
    }
  }

  function ensureFbo(w, h) {
    if (fbo && fboW === w && fboH === h) return;
    if (sceneTex) gl.deleteTexture(sceneTex);
    if (fbo) gl.deleteFramebuffer(fbo);
    sceneTex = makeTexture(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    fboW = w; fboH = h;
  }

  // s = состояние кадра: fa/fb (готовые кадры), mix, shiftX/Y, zoom, t
  function drawGL(fa, fb, mix, shiftX, shiftY, zoom, t) {
    ensureFbo(canvas.width, canvas.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
    // --- проход 1: сцена -> текстура ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.useProgram(scenePrg);
    bindFrame(fa, 0);
    if (fb) bindFrame(fb, 4);
    gl.uniform2f(US.uKdA, fa.kB, fa.dB);
    if (fb) gl.uniform2f(US.uKdB, fb.kB, fb.dB);
    gl.uniform2f(US.uShift, shiftX, shiftY);
    gl.uniform1f(US.uZoom, zoom);
    gl.uniform1f(US.uMix, mix);
    gl.uniform1f(US.uTime, t);
    gl.uniform2f(US.uCoverScale, coverUvW, coverUvH);
    gl.uniform2f(US.uCoverOffset, coverOffX, coverOffY);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // --- проход 2: время суток -> экран ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(postPrg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1f(UP.uSunset, tod.s);
    gl.uniform1f(UP.uNight, tod.n);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var glLost = false;
  var tod = { s: 0, n: 0 }; // время суток: вес заката и ночи (0..1), день = оба 0
  if (useGL) {
    try { initGLProgram(); } catch (err) { console.warn('WebGL shader failed, fallback:', err); useGL = false; canvas.style.display = 'none'; }
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); glLost = true; });
    canvas.addEventListener('webglcontextrestored', function () {
      try {
        initGLProgram();
        // текстуры заново: CPU-копии картинок мы не держим (память iPhone),
        // поэтому перечитываем файлы — кэш браузера отдаёт их сразу.
        Promise.all(FRAMES.map(function (_, k) { return preloadFrame(k); }))
          .then(function () { resize(true); glLost = false; });
      } catch (err) { console.warn('WebGL restore failed', err); }
    });
  }

  // ---------- загрузка и подготовка картинок ----------
  function whenLoaded(img) {
    return new Promise(function (resolve, reject) {
      if (img.complete && img.naturalWidth) return resolve(img);
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('не загрузилось: ' + img.src)); };
    });
  }

  // Картинка полностью загружена И декодирована до первого показа —
  // иначе iOS декодирует её лениво прямо во время кроссфейда (мерцание).
  function loadImage(url) {
    var img = new Image();
    img.src = url;
    return whenLoaded(img).then(function () {
      return typeof img.decode === 'function' ? img.decode().catch(function () {}) : null;
    }).then(function () { return img; });
  }

  // Не больше MAX_TEX_SIZE по длинной стороне — иначе iPhone выгружает
  // большие кадры из памяти. Возвращает {src, w, h}: src — img или canvas.
  function fitToCap(img) {
    var w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h), cap = CONFIG.MAX_TEX_SIZE;
    if (m <= cap) return { src: img, w: w, h: h };
    var s = cap / m, c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { src: c, w: c.width, h: c.height };
  }

  // Скользящий бокс-блюр по одной оси с зажатием краёв.
  function blurPass(src, dst, w, h, r, horiz) {
    var n = horiz ? w : h, lines = horiz ? h : w;
    var stride = horiz ? 1 : w, lineStride = horiz ? w : 1, div = 2 * r + 1;
    for (var l = 0; l < lines; l++) {
      var base = l * lineStride, sum = 0, k, i;
      for (k = -r; k <= r; k++) sum += src[base + Math.min(n - 1, Math.max(0, k)) * stride];
      for (i = 0; i < n; i++) {
        dst[base + i * stride] = (sum / div + 0.5) | 0;
        sum += src[base + Math.min(n - 1, i + r + 1) * stride] - src[base + Math.max(0, i - r) * stride];
      }
    }
  }
  function boxBlur(a, w, h, r) { // блюр на месте (две оси)
    var tmp = new Uint8Array(a.length);
    blurPass(a, tmp, w, h, r, true);
    blurPass(tmp, a, w, h, r, false);
  }

  // Карта глубины -> 1 канал: растягиваем контраст по 2–98 перцентилю
  // (плоскость фокуса всегда в середине диапазона), затем размываем
  // 3 проходами бокс-блюра (~CONFIG.DEPTH_BLUR_PX) — резкие ступеньки
  // глубины на границе здания и неба иначе рвут картинку.
  function prepareDepth(img) {
    var fit = fitToCap(img), w = fit.w, h = fit.h;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fit.src, 0, 0, w, h);
    var px = ctx.getImageData(0, 0, w, h).data, n = w * h;
    var a = new Uint8Array(n), hist = new Uint32Array(256), i;
    for (i = 0; i < n; i++) { a[i] = px[i * 4]; hist[a[i]]++; }
    var lo = 0, hi = 255, acc = 0;
    for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= n * 0.02) { lo = i; break; } }
    acc = 0;
    for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n * 0.02) { hi = i; break; } }
    if (hi - lo < 8) { lo = 0; hi = 255; }
    var span = hi - lo;
    for (i = 0; i < n; i++) a[i] = clamp(Math.round((a[i] - lo) * 255 / span), 0, 255);
    var r = Math.max(1, Math.round(CONFIG.DEPTH_BLUR_PX / 2)), tmp = new Uint8Array(n);
    for (i = 0; i < 3; i++) {
      blurPass(a, tmp, w, h, r, true);
      blurPass(tmp, a, w, h, r, false);
    }
    return { w: w, h: h, d: a };
  }

  // Вырезка здания (RGBA, маска SAM): оставляем только самый большой
  // связный кусок (обрывки фона в маске не должны ехать вместе со зданием),
  // считаем маску окон (окна темнее своего окружения) и среднюю глубину
  // здания — по ней здание двигается целиком.
  function analyzeBuilding(img, depth, frameImg, bgImg) {
    var fit = fitToCap(img), w = fit.w, h = fit.h, n = w * h, i;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fit.src, 0, 0, w, h);
    var id = ctx.getImageData(0, 0, w, h), px = id.data;

    // 1) самый большой связный кусок маски (alpha > 128)
    var lab = new Int32Array(n), stack = new Int32Array(n), sizes = [0], nl = 0, best = 0, bestSize = 0;
    for (i = 0; i < n; i++) {
      if (lab[i] || px[i * 4 + 3] <= 128) continue;
      nl++;
      var sp = 0, size = 0;
      stack[sp++] = i; lab[i] = nl;
      while (sp) {
        var p = stack[--sp], x = p % w, y = (p / w) | 0;
        size++;
        if (x > 0 && !lab[p - 1] && px[(p - 1) * 4 + 3] > 128) { lab[p - 1] = nl; stack[sp++] = p - 1; }
        if (x < w - 1 && !lab[p + 1] && px[(p + 1) * 4 + 3] > 128) { lab[p + 1] = nl; stack[sp++] = p + 1; }
        if (y > 0 && !lab[p - w] && px[(p - w) * 4 + 3] > 128) { lab[p - w] = nl; stack[sp++] = p - w; }
        if (y < h - 1 && !lab[p + w] && px[(p + w) * 4 + 3] > 128) { lab[p + w] = nl; stack[sp++] = p + w; }
      }
      if (size > bestSize) { bestSize = size; best = nl; }
    }
    // Пиксели чужих кусков и мягкий ореол вокруг них убираем; ореол главного
    // куска (label 0, но рядом с ним) оставляем как есть.
    var keep = new Uint8Array(n);
    for (i = 0; i < n; i++) keep[i] = lab[i] === best ? 1 : 0;
    var grown = new Uint8Array(n); // главный кусок, расширенный на 6 px — там мягкий край оставляем
    for (i = 0; i < n; i++) grown[i] = keep[i] * 255;
    boxBlur(grown, w, h, 6);
    for (i = 0; i < n; i++) if (!keep[i] && grown[i] === 0) px[i * 4 + 3] = 0;
    for (i = 0; i < n; i++) if (lab[i] && lab[i] !== best) px[i * 4 + 3] = 0;

    // 2) маска окон: темнее своего окружения (окно 9 px против 2 px)
    var L = new Uint8Array(n), sum = 0, cnt = 0;
    for (i = 0; i < n; i++) {
      var l = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) | 0;
      L[i] = l;
      if (keep[i]) { sum += l; cnt++; }
    }
    var mean = cnt ? (sum / cnt) | 0 : 128;
    for (i = 0; i < n; i++) if (!keep[i]) L[i] = mean;
    var big = L.slice(), small = L.slice();
    boxBlur(big, w, h, 9);
    boxBlur(small, w, h, 2);
    var win = new Uint8Array(n);
    for (i = 0; i < n; i++) {
      var dv = (big[i] - small[i]) / 255;
      var wv = clamp((dv - 0.06) / 0.10, 0, 1);
      win[i] = keep[i] ? (wv * (px[i * 4 + 3] / 255) * 255) | 0 : 0;
    }
    blurPass(win, small, w, h, 1, true); blurPass(small, win, w, h, 1, false); // мягкое свечение

    // 3) средняя глубина здания по маске
    var dsum = 0, dc = 0, dm = depth;
    for (i = 0; i < n; i++) {
      if (!keep[i]) continue;
      var xx = i % w, yy = (i / w) | 0;
      dsum += dm.d[clamp(((yy + 0.5) / h * dm.h) | 0, 0, dm.h - 1) * dm.w + clamp(((xx + 0.5) / w * dm.w) | 0, 0, dm.w - 1)];
      dc++;
    }
    var meanD = dc ? dsum / dc / 255 : 0.5;

    // 4) «земля»: цельный кадр (подиум, лестницы, всё вокруг), а на месте
    // самого здания — фон без здания. Здание поверх едет жёстко и открывает этот фон.
    function pixelsOf(im) {
      var cc = document.createElement('canvas');
      cc.width = w; cc.height = h;
      var x2 = cc.getContext('2d', { willReadFrequently: true });
      x2.drawImage(im, 0, 0, w, h);
      return { cv: cc, ctx: x2, id: x2.getImageData(0, 0, w, h) };
    }
    var G = pixelsOf(frameImg), gp = G.id.data, bp = pixelsOf(bgImg).id.data;
    var hole = new Uint8Array(n);
    for (i = 0; i < n; i++) hole[i] = px[i * 4 + 3];
    boxBlur(hole, w, h, 3); // маска чуть шире здания: его ореол в землю не попадает
    for (i = 0; i < n; i++) {
      var ha = Math.min(255, hole[i] * 3) / 255;
      if (ha <= 0) continue;
      gp[i * 4] = gp[i * 4] * (1 - ha) + bp[i * 4] * ha;

    requestAnimationFrame(frame);
  }

  // ---------- панель: время суток, миниатюры, настройки, открытка ----------
  var bodyEl = document.body;
  var desktopMQ = window.matchMedia('(min-width: 1024px)');
  var scrimEl = document.getElementById('scrim');
  var thumbsEl = document.getElementById('thumbs');

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function segMark(segId, attr, value) {
    document.querySelectorAll('#' + segId + ' button').forEach(function (b) { b.classList.toggle('on', b.getAttribute(attr) === value); });
  }

  // свернуть/развернуть (ПК) и шторка (телефон)
  if (lsGet('chka-panel') === 'collapsed') bodyEl.classList.add('panel-collapsed');
  function closeSheet() { bodyEl.classList.remove('sheet-open'); }
  panelBtn.addEventListener('click', function () {
    if (desktopMQ.matches) lsSet('chka-panel', bodyEl.classList.toggle('panel-collapsed') ? 'collapsed' : 'open');
    else bodyEl.classList.toggle('sheet-open');
  });
  scrimEl.addEventListener('click', closeSheet);
  (desktopMQ.addEventListener ? desktopMQ.addEventListener('change', closeSheet) : desktopMQ.addListener(closeSheet));

  // время суток: плавная смена за TOD_MS
  var TOD_TARGET = { day: [0, 0], sunset: [1, 0], night: [0, 1] };
  var todAnim = null;
  function setTod(name) {
    var t = TOD_TARGET[name];
    if (!t) return;
    todAnim = { t0: null, s0: tod.s, n0: tod.n, s1: t[0], n1: t[1] };
    segMark('todSeg', 'data-tod', name);
    if (!useGL) fbEl.setAttribute('data-tod', name);
  }
  document.querySelectorAll('#todSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setTod(b.getAttribute('data-tod')); });
  });

  // миниатюры кадров
  function buildThumbs() {
    thumbsEl.innerHTML = '';
    FRAMES.forEach(function (_, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = i === frameIndex ? 'on' : '';
      b.setAttribute('aria-label', (i + 1) + ' / ' + FRAMES.length);
      var im = new Image();
      im.alt = ''; im.src = store[i].thumb;
      b.appendChild(im);
      b.addEventListener('click', function () { goTo(i); });
      thumbsEl.appendChild(b);
    });
  }

  // автопокачивание вкл/выкл
  var swayEnabled = true;
  var swayBtn = document.getElementById('swayToggle');
  swayBtn.addEventListener('click', function () {
    swayEnabled = !swayEnabled;
    swayBtn.classList.toggle('on', swayEnabled);
    swayBtn.setAttribute('aria-checked', swayEnabled ? 'true' : 'false');
    if (swayEnabled) { userTouched = false; lastInputAt = performance.now(); } // снова ждём 4 с тишины
  });

  // полный экран
  var fsBtn = document.getElementById('fsBtn');
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true; // iPhone не умеет
  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  });

  // открытка: PNG текущего вида + подпись карандашным шрифтом внизу
  var cardBtn = document.getElementById('cardBtn');
  if (!useGL) cardBtn.hidden = true;
  cardBtn.addEventListener('click', function () {
    if (!useGL || glLost || !lastDraw) return;
    var d = lastDraw;
    // Буфер WebGL читается только сразу после отрисовки — рисуем ещё раз и копируем тут же.
    // Для открытки рисуем крупнее (~1080 px по ширине), потом возвращаем размер холста.
    var W0 = canvas.width, H0 = canvas.height, kq = clamp(1080 / W0, 1, 2.5);
    canvas.width = Math.round(W0 * kq); canvas.height = Math.round(H0 * kq);
    drawGL(d.fa, d.fb, d.mix, d.shiftX, d.shiftY, d.zoom, d.t);
    var W = canvas.width, H = canvas.height;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.drawImage(canvas, 0, 0);
    canvas.width = W0; canvas.height = H0; // следующий кадр цикла перерисует холст
    var caption = CONFIG.UI_I18N.title[currentLang] + ' · chka.am';
    var ready = (document.fonts && document.fonts.load) ? document.fonts.load('700 40px Caveat', caption).catch(function () {}) : Promise.resolve();
    ready.then(function () {
      var capH = Math.round(H * 0.085), lw = Math.max(2, Math.round(W / 300));
      x.fillStyle = '#f5ecda';
      x.fillRect(0, H - capH, W, capH);
      x.fillStyle = 'rgba(47,42,37,0.75)';
      x.fillRect(0, H - capH, W, lw); // карандашная черта над подписью
      var fs = Math.round(capH * 0.6);
      x.font = '700 ' + fs + 'px Caveat, "Comic Sans MS", cursive';
      while (x.measureText(caption).width > W * 0.92 && fs > 10) { fs -= 2; x.font = '700 ' + fs + 'px Caveat, "Comic Sans MS", cursive'; }
      x.fillStyle = '#2f2a25';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(caption, W / 2, H - capH / 2 + lw);
      c.toBlob(function (blob) {
        if (!blob) return;
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kukuruznik-1979.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      }, 'image/png');
    });
  });

  // размер текста: крупный (по умолчанию) / обычный
  function setTextSize(v) {
    v = v === 'normal' ? 'normal' : 'large';
    document.documentElement.setAttribute('data-textsize', v);
    segMark('sizeSeg', 'data-size', v);
    lsSet('chka-textsize', v);
  }
  document.querySelectorAll('#sizeSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setTextSize(b.getAttribute('data-size')); });
  });
  setTextSize(lsGet('chka-textsize'));

  // ---------- старт ----------
  // Сначала грузим и декодируем ВСЕ кадры, только потом показываем первый.
  Promise.all(FRAMES.map(function (_, i) { return preloadFrame(i); })).then(function () {
    if (!useGL) buildFallbackDom();
    setNaturalSize(store[0].w, store[0].h);
    buildDots();
    buildThumbs();
    buildHotspots(0);
    lastInputAt = performance.now();
    frame(performance.now());            // первая отрисовка, потом убираем экран загрузки —
    stage.classList.remove('loading');   // пустого кадра не бывает, даже если вкладка в фоне
  }).catch(function (err) {
    console.error(err);
    loader.textContent = 'Не удалось загрузить кадры: ' + (err && err.message ? err.message : err);
  });

})();
</script>
</body>
</html>
