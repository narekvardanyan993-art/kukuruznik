<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D-фото — тест параллакса глубины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5ecda; --ink: #2f2a25; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Armenian", sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%;
    touch-action: none;
    user-select: none;
  }
  #stage {
    position: relative;
    /* На широком экране не растягиваем картинку больше её исходного
       разрешения — по бокам остаётся фон бумаги, как у остальных сцен
       сайта. */
    width: 100%;
    max-width: 1080px;
    aspect-ratio: var(--natW, 1080) / var(--natH, 1920);
    overflow: hidden;
    touch-action: none;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  /* На узком (телефонном) экране картинка должна занимать весь экран без
     пустых полос сверху/снизу — вместо вписывания по ширине с полями
     бумаги стейдж растягивается на весь вьюпорт, а WebGL сам обрезает
     кадр по принципу "cover" (см. uCoverScale/uCoverOffset в шейдере),
     без искажения пропорций. */
  @media (max-width: 820px) {
    body { display: block; }
    #stage {
      width: 100vw; height: 100vh; height: 100dvh;
      max-width: none; aspect-ratio: auto;
    }
  }

  #stage.loading #gl, #stage.loading #fallback { visibility: hidden; }
  /* Простой бумажный экран, пока все кадры и карты глубины не загружены
     и не декодированы (иначе картинка мигает при смене кадра). Сплошной
     фон, без прозрачности, поверх всего. */
  #loader {
    position: absolute; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: rgba(47,42,37,0.7);
    font: 700 26px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    transition: opacity 300ms ease;
  }
  #stage:not(.loading) #loader { opacity: 0; pointer-events: none; }

  /* Откат без WebGL: два слоя (фон + здание) на кадр, двигаются CSS-ом. */
  #fallback { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #fallback[hidden] { display: none; }
  .fb-frame { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .fb-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; will-change: transform; pointer-events: none;
  }

  /* Меню в тон скетча: бумажный фон, крупно — аудитория пожилая. */
  #topBar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 8;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: linear-gradient(rgba(245,236,218,0.92), rgba(245,236,218,0.55) 80%, transparent);
  }
  #backLink {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(47,42,37,0.08);
    color: var(--ink); text-decoration: none;
    font: 600 16px/1 -apple-system, BlinkMacSystemFont, "Noto Sans Armenian", sans-serif;
  }
  #backLink:active { background: rgba(47,42,37,0.18); }
  #pageTitle {
    flex: 1; min-width: 0;
    font: 700 24px/1.15 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #langSwitch {
    position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 8; display: flex; gap: 6px;
    background: rgba(20,16,8,0.4);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 4px;
  }
  #langSwitch button {
    min-width: 38px; padding: 7px 9px; border: none; border-radius: 10px;
    background: transparent; color: #fff; opacity: 0.7;
    font: 700 14px/1 -apple-system, "Noto Sans Armenian", sans-serif;
    cursor: pointer;
  }
  #langSwitch button.on { background: rgba(255,255,255,0.85); color: var(--ink); opacity: 1; }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(20, 16, 8, 0.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: none; color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background 150ms ease, opacity 150ms ease;
  }
  .nav-btn:hover { background: rgba(20, 16, 8, 0.55); }
  .nav-btn:active { background: rgba(20, 16, 8, 0.7); }
  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }

  #dots {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 5;
  }
  #dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 150ms ease, transform 150ms ease;
  }
  #dots span.on { background: #fff; transform: scale(1.25); }

  /* Кнопка гироскопа в стиле меню (бумага + чернила, как «на сайт»).
     На iPhone разрешение можно запросить только по нажатию. */
  #gyroBtn {
    position: absolute; left: 50%; z-index: 9;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
    transform: translateX(-50%);
    padding: 12px 22px; border: none; border-radius: 14px;
    background: rgba(245,236,218,0.96); color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    font: 700 22px/1 'Caveat', -apple-system, "Noto Sans Armenian", sans-serif;
    white-space: nowrap; cursor: pointer;
  }
  #gyroBtn[hidden] { display: none; }
  #gyroBtn:active { background: rgba(232,221,196,0.98); }

  #build-version {
    position: absolute; left: 8px; bottom: 4px; z-index: 5;
    font: 500 9px/1 -apple-system, sans-serif; color: #fff; opacity: 0.55;
    pointer-events: none;
  }

  #hint {
    position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%);
    z-index: 5; font-size: 12px; color: #fff; text-align: center; max-width: calc(100% - 24px);
    background: rgba(20, 16, 8, 0.4); padding: 6px 12px; border-radius: 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0.9; pointer-events: none;
    transition: opacity 600ms ease;
  }
  #hint.gone { opacity: 0; }

  /* Точки-подсказки: маленький пульсирующий маркер, привязанный к
     объекту на слое (двигается вместе с ним при параллаксе — позиция
     считается в JS той же формулой смещения, что и в шейдере). */
  /* Птицы в небе — единственная анимация помимо теней облаков, летят
     медленно и независимо от параллакса (они и так на предельно
     дальнем плане, где смещение практически нулевое). */
  #birds { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .bird {
    position: absolute; left: -10%; top: var(--y, 10%);
    width: 26px; height: 13px;
    fill: none; stroke: #3a332a; stroke-width: 1.4; stroke-linecap: round;
    opacity: 0.5;
    animation: birdFly var(--fly-dur, 42s) linear infinite;
    animation-delay: var(--fly-delay, 0s);
  }
  @keyframes birdFly {
    0%   { left: -10%; margin-top: 0; }
    48%  { margin-top: -9px; }
    50%  { left: 52%; }
    100% { left: 112%; margin-top: 0; }
  }

  #hotspots { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .hs-dot {
    position: absolute; top: 0; left: 0;
    width: 22px; height: 22px; margin: -11px;
    border: none; padding: 0; background: none;
    pointer-events: auto; cursor: pointer;
    opacity: 0; transition: opacity 400ms ease;
  }
  .hs-dot.show { opacity: 1; }
  .hs-dot::before, .hs-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .hs-dot::before {
    width: 10px; height: 10px;
    background: #fff; border: 2px solid rgba(20,16,8,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hs-dot::after {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.7);
    animation: hsPulse 2.2s ease-out infinite;
  }
  @keyframes hsPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  #hsPopup {
    position: absolute; z-index: 7;
    max-width: min(78vw, 280px);
    width: max-content;
    background: var(--paper); color: var(--ink);
    border-radius: 12px; padding: 10px 13px;
    font-size: 13px; line-height: 1.4;
    box-shadow: 0 8px 22px rgba(0,0,0,0.3);
    --shift: 0px;
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-14px);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  #hsPopup.show { opacity: 1; pointer-events: auto; }
  #hsPopup::after {
    /* хвостик остаётся над точкой, даже если сам блок сдвинут от края */
    content: ''; position: absolute; left: calc(50% - var(--shift)); top: 100%;
    width: 10px; height: 10px; margin-left: -5px; margin-top: -5px;
    background: var(--paper); transform: rotate(45deg);
  }
</style>
</head>
<body>

<div id="stage" class="loading">
  <div id="loader">загрузка…</div>
  <canvas id="gl"></canvas>
  <div id="fallback" hidden></div>
  <div id="topBar">
    <a id="backLink" href="../../kukuruznik/index.html">‹ <span id="backLinkText">на сайт</span></a>
    <div id="pageTitle">Кукурузник, 1979</div>
  </div>
  <div id="langSwitch">
    <button type="button" data-lang="hy">Հ</button>
    <button type="button" data-lang="ru">Ру</button>
    <button type="button" data-lang="en">En</button>
  </div>
  <button id="prevBtn" class="nav-btn" type="button" aria-label="Предыдущий кадр">‹</button>
  <button id="nextBtn" class="nav-btn" type="button" aria-label="Следующий кадр">›</button>
  <div id="dots"></div>
  <div id="birds" aria-hidden="true">
    <svg class="bird" style="--y:8%; --fly-dur:39s; --fly-delay:-4s" viewBox="0 0 24 12"><path d="M1,6 Q6,0 12,6 Q18,0 23,6"/></svg>
    <svg class="bird" style="--y:14%; --fly-dur:48s; --fly-delay:-22s" viewBox="0 0 24 12"><path d="M1,6 Q6,0 12,6 Q18,0 23,6"/></svg>
    <svg class="bird" style="--y:5%; --fly-dur:44s; --fly-delay:-33s" viewBox="0 0 24 12"><path d="M1,6 Q6,0 12,6 Q18,0 23,6"/></svg>
  </div>
  <div id="hotspots"></div>
  <div id="hsPopup"></div>
  <button id="gyroBtn" type="button" hidden>Наклоняй телефон</button>
  <div id="hint">Веди пальцем / мышью · свайп — сменить кадр</div>
  <div id="build-version">test/depth-photo · v4 · 2026-09-24</div>
</div>

<script>
/* ===================== CONFIG =====================
   Все параметры эффекта «3D-фото» собраны здесь, ничего похожего
   больше в коде не настраивается. */
var CONFIG = {
  // Смещение по карте глубины: максимум у самых близких/дальних пикселей
  // фона и земли (плоскость фокуса — середина карты), доли ширины/высоты
  // кадра. Здание двигается целиком по своей средней глубине, тем же максимумом.
  MAX_SHIFT_X: 0.02,
  MAX_SHIFT_Y: 0.012,
  BASE_SCALE: 1.05,          // общий масштаб, чтобы не были видны края
  ZOOM_NEAR: 0.02,           // при наклоне к себе ближние части +до 2%
  DEPTH_BLUR_PX: 6,          // размытие карты глубины фона (6 px) против «резины» на краях

  // Кадры и карты глубины ужимаются до этой длинной стороны — иначе iPhone
  // выгружает большие текстуры из памяти.
  MAX_TEX_SIZE: 1600,

  // Наклон гироскопа, дающий полное смещение (мышь/палец — свои правила).
  MAX_TILT_X_DEG: 20,
  MAX_TILT_Y_DEG: 20,
  GYRO_ACTIVITY_DEG: 2,      // наклон больше — считаем, что человек взял телефон в руки

  SMOOTH: 0.12,              // сглаживание гироскопа/мыши (доля пути за кадр при 60 fps)
  RETURN_MS: 800,            // возврат в центр после отпускания пальца

  // Быстрый росчерк пальцем = смена кадра; медленное перетаскивание двигает объём.
  SWIPE_MIN_PX: 50,
  SWIPE_MAX_MS: 350,

  // Автопокачивание, если 4 секунды нет ни касаний, ни наклона.
  IDLE_SWAY_AFTER_MS: 4000,
  SWAY_PERIOD_S: 8,
  SWAY_AMPLITUDE: 0.4,       // доля максимального смещения

  // "Дыхание" в состоянии покоя.
  BREATH_AMPLITUDE: 0.004,   // доля ширины кадра
  BREATH_PERIOD_S: 6,

  // Кроссфейд между кадрами, мс (ease-in-out).
  FRAME_CROSSFADE_MS: 450,

  // Откат без WebGL: множитель сдвига слоя здания (+) и фона (−).
  FALLBACK_LAYER_K: 0.6,

  // Список ниже между метками генерируется автоматически командой
  // .venv-depth/bin/python tools/build_frames.py — руками не редактировать,
  // править картинки в test-assets/frames/ и перезапускать скрипт.
  // color/depth — цельный кадр и его карта глубины (для WebGL).
  // bg/building — два слоя (фон без здания и вырезка здания) — только
  // для отката, если у браузера нет WebGL.
  FRAMES: [
    /* FRAMES:START */
    { color: 'frames/v_angle_0.png', depth: 'frames/v_angle_0_depth.png', bg: { color: 'frames/v_angle_0_bg.png', depth: 'frames/v_angle_0_bg_depth.png' }, building: { color: 'frames/v_angle_0_building.png', depth: 'frames/v_angle_0_depth.png' } },
    { color: 'frames/v_angle_1.png', depth: 'frames/v_angle_1_depth.png', bg: { color: 'frames/v_angle_1_bg.png', depth: 'frames/v_angle_1_bg_depth.png' }, building: { color: 'frames/v_angle_1_building.png', depth: 'frames/v_angle_1_depth.png' } },
    { color: 'frames/v_angle_2.png', depth: 'frames/v_angle_2_depth.png', bg: { color: 'frames/v_angle_2_bg.png', depth: 'frames/v_angle_2_bg_depth.png' }, building: { color: 'frames/v_angle_2_building.png', depth: 'frames/v_angle_2_depth.png' } },
    { color: 'frames/v_angle_3.png', depth: 'frames/v_angle_3_depth.png', bg: { color: 'frames/v_angle_3_bg.png', depth: 'frames/v_angle_3_bg_depth.png' }, building: { color: 'frames/v_angle_3_building.png', depth: 'frames/v_angle_3_depth.png' } },
    { color: 'frames/v_angle_4.png', depth: 'frames/v_angle_4_depth.png', bg: { color: 'frames/v_angle_4_bg.png', depth: 'frames/v_angle_4_bg_depth.png' }, building: { color: 'frames/v_angle_4_building.png', depth: 'frames/v_angle_4_depth.png' } },
    { color: 'frames/v_angle_5.png', depth: 'frames/v_angle_5_depth.png', bg: { color: 'frames/v_angle_5_bg.png', depth: 'frames/v_angle_5_bg_depth.png' }, building: { color: 'frames/v_angle_5_building.png', depth: 'frames/v_angle_5_depth.png' } },
    /* FRAMES:END */
  ],

  // Точки-подсказки: 2-4 на кадр. u/v — позиция на исходной картинке
  // (0..1, как у текстур). В режиме WebGL глубина точки читается из той же
  // (размытой) карты, что и в шейдере, — точка двигается ровно как то место,
  // к которому привязана. layer (building/bg) нужен только для отката без
  // WebGL; поле depth — справочное. key — ключ текста в I18N ниже.
  HOTSPOTS: [
    [ // v_angle_0
      { key: 'tower1', layer: 'building', u: 0.50, v: 0.50, depth: 0.247 },
      { key: 'tower2', layer: 'building', u: 0.50, v: 0.36, depth: 0.251 },
      { key: 'architects', layer: 'bg', u: 0.15, v: 0.60, depth: 0.220 }
    ],
    [ // v_angle_1
      { key: 'tower1', layer: 'building', u: 0.48, v: 0.50, depth: 0.463 },
      { key: 'tower2', layer: 'building', u: 0.48, v: 0.37, depth: 0.486 },
      { key: 'architects', layer: 'bg', u: 0.60, v: 0.68, depth: 0.306 },
      { key: 'mother_armenia', layer: 'bg', u: 0.17, v: 0.43, depth: 0.071 }
    ],
    [ // v_angle_2
      { key: 'tower1', layer: 'building', u: 0.47, v: 0.48, depth: 0.384 },
      { key: 'tower2', layer: 'building', u: 0.47, v: 0.35, depth: 0.369 },
      { key: 'architects', layer: 'bg', u: 0.80, v: 0.62, depth: 0.361 }
    ],
    [ // v_angle_3
      { key: 'tower1', layer: 'building', u: 0.50, v: 0.55, depth: 0.275 },
      { key: 'tower2', layer: 'building', u: 0.50, v: 0.38, depth: 0.290 },
      { key: 'architects', layer: 'bg', u: 0.50, v: 0.635, depth: 0.176 }
    ],
    [ // v_angle_4
      { key: 'tower1', layer: 'building', u: 0.62, v: 0.48, depth: 0.498 },
      { key: 'tower2', layer: 'building', u: 0.62, v: 0.38, depth: 0.486 },
      { key: 'mother_armenia', layer: 'bg', u: 0.87, v: 0.25, depth: 0.031 },
      { key: 'construction', layer: 'bg', u: 0.90, v: 0.58, depth: 0.455 }
    ],
    [ // v_angle_5
      { key: 'tower1', layer: 'building', u: 0.45, v: 0.45, depth: 0.514 },
      { key: 'tower2', layer: 'building', u: 0.55, v: 0.12, depth: 0.486 },
      { key: 'architects', layer: 'bg', u: 0.50, v: 0.88, depth: 0.800 }
    ]
  ],

  // Тексты подсказок. ТОЛЬКО эти пять, свои факты не добавлять.
  // hy (армянский) — черновой перевод, ПОМЕЧЕН для вычитки владельцем.
  I18N: {
    tower1: {
      ru: 'Дом молодёжи, открыт в 1979. В народе — Кукурузник',
      en: 'Youth Palace, opened in 1979. Nicknamed "the Corncob"',
      hy: 'Երիտասարդության պալատ, բացվել է 1979-ին։ Ժողովրդականում՝ Կուկուրուզնիկ' // TODO: армянский — вычитать мне
    },
    tower2: {
      ru: 'Снесён в 2006, официально — из-за сейсмической безопасности',
      en: 'Demolished in 2006, officially for seismic safety reasons',
      hy: 'Քանդվել է 2006-ին, պաշտոնապես՝ սեյսմիկ անվտանգության պատճառով' // TODO: армянский — вычитать мне
    },
    architects: {
      ru: 'Архитекторы: А. Тарханян, С. Хачикян, Г. Погосян, М. Захарян',
      en: 'Architects: A. Tarkhanyan, S. Khachikyan, G. Poghosyan, M. Zakaryan',
      hy: 'Ճարտարապետներ՝ Ա. Թարխանյան, Ս. Խաչիկյան, Գ. Պողոսյան, Մ. Զաքարյան' // TODO: армянский — вычитать мне
    },
    mother_armenia: {
      ru: 'Мать Армения, 1967',
      en: 'Mother Armenia, 1967',
      hy: 'Մայր Հայաստան, 1967' // TODO: армянский — вычитать мне
    },
    construction: {
      ru: 'Строительство, 1976–1977',
      en: 'Construction, 1976–1977',
      hy: 'Շինարարություն, 1976–1977' // TODO: армянский — вычитать мне
    }
  },

/* ==================================================== */

(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('gl');
  var loader = document.getElementById('loader');
  var hint = document.getElementById('hint');
  var gyroBtn = document.getElementById('gyroBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var dotsEl = document.getElementById('dots');
  var fbEl = document.getElementById('fallback');

  var FRAMES = CONFIG.FRAMES;

  // ---------- общие функции ----------
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth01(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }            // ease-in-out
  function easeInOutCubic(t) { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  // Сглаживание, не зависящее от частоты кадров: k — доля пути за кадр на 60 fps.
  function lerpK(k, dt) { return 1 - Math.pow(1 - k, dt / 16.667); }

  // ---------- язык (общий с сайтом: тот же ключ localStorage) ----------
  var currentLang = (function () {
    var l = 'hy';
    try {
      l = localStorage.getItem('chka-lang') ||
        ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0, 2).toLowerCase();
    } catch (e) {}
    if (!CONFIG.I18N.tower1[l]) l = 'hy';
    return l;
  })();

  var backLinkText = document.getElementById('backLinkText');
  var pageTitleEl = document.getElementById('pageTitle');
  var langButtons = document.querySelectorAll('#langSwitch button');
  var hintKey = 'hint'; // какая строка сейчас в подсказке внизу

  function applyLang() {
    var t = CONFIG.UI_I18N;
    pageTitleEl.textContent = t.title[currentLang];
    backLinkText.textContent = t.back[currentLang];
    hint.textContent = t[hintKey][currentLang];
    loader.textContent = t.loading[currentLang];
    gyroBtn.textContent = t.gyroBtn[currentLang];
    langButtons.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === currentLang); });
    document.documentElement.lang = currentLang;
  }

  langButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      currentLang = b.getAttribute('data-lang');
      try { localStorage.setItem('chka-lang', currentLang); } catch (e) {}
      applyLang();

  });
  applyLang();

  // ---------- WebGL (если нет — остаётся двухслойный DOM-вариант) ----------
  var wantGL = !/[?&]nogl=1/.test(location.search); // ?nogl=1 — принудительно проверить откат
  var gl = null;
  if (wantGL) {
    gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false })

  }
  var useGL = !!gl;
  if (!useGL) canvas.style.display = 'none';

  // Кадр = два слоя, оба берутся из одного цельного набора:
  //  • фон и земля (bg — кадр без здания) сдвигаются попиксельно по карте
  //    глубины (X и Y), карта заранее размыта (prepareDepth);
  //  • здание (вырезка по маске SAM) двигается ЦЕЛИКОМ — один общий сдвиг
  //    по его средней глубине, поэтому башня никогда не гнётся.
  // Первый проход рисует сцену в текстуру (цвет + маска окон в альфе),
  // второй — время суток (закат/ночь) поверх готовой картинки.
  var VERT = [
    'attribute vec2 aPos;',
    'varying vec2 vUv;',   // координаты картинки (y вниз)
    'varying vec2 vTc;',   // координаты текстуры (y вверх)
    'void main() {',
    '  vTc = aPos * 0.5 + 0.5;',
    '  vUv = vec2(vTc.x, 1.0 - vTc.y);',
    '  gl_Position = vec4(aPos, 0.0, 1.0);',
    '}'
  ].join('\n');

  var SCENE_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uBgA; uniform sampler2D uDepthA; uniform sampler2D uBldA; uniform sampler2D uWinA;',
    'uniform sampler2D uBgB; uniform sampler2D uDepthB; uniform sampler2D uBldB; uniform sampler2D uWinB;',
    'uniform vec2  uKdA;',        // здание кадра A: x = k (-1..1), y = средняя глубина 0..1
    'uniform vec2  uKdB;',
    'uniform float uMix;',        // 0 = кадр A, 1 = кадр B
    'uniform vec2  uShift;',      // max-сдвиг * наклон + «дыхание», в долях картинки
    'uniform float uZoom;',       // добавка к масштабу для самых ближних (0..0.02)
    'uniform float uScale;',      // общий масштаб (1.05), чтобы не видеть краёв
    'uniform vec2  uCoverScale;', // "cover"-обрезка кадра под экран
    'uniform vec2  uCoverOffset;',
    'uniform float uTime;',
    '',
    // Мягкое пятно тени от облака: смещённый и чуть "разлохмаченный"
    // синусами круг, край размыт smoothstep — не ровный диск.
    'float blob(vec2 uv, vec2 center, vec2 radius) {',
    '  vec2 d = (uv - center) / radius;',
    '  float wobble = 0.15 * sin(d.x * 6.0 + center.x * 9.0) * sin(d.y * 5.0 + center.y * 7.0);',
    '  float dist = length(d) + wobble;',
    '  return smoothstep(1.0, 0.15, dist);',
    '}',
    // Две тени от облаков не спеша ползут по кадру слева направо,
    // один полный проход ~40с, без всякой другой анимации.
    'float cloudShadow(vec2 uv, float t) {',
    '  float cycle1 = 40.0;',
    '  float p1 = fract(t / cycle1);',
    '  float b1 = blob(uv, vec2(mix(-0.35, 1.35, p1), 0.58), vec2(0.30, 0.17));',
    '  float cycle2 = 53.0;',
    '  float p2 = fract((t + cycle1 * 0.5) / cycle2);',
    '  float b2 = blob(uv, vec2(mix(-0.35, 1.35, p2), 0.32), vec2(0.22, 0.13));',
    '  return clamp(b1 + b2, 0.0, 1.0);',
    '}',
    '',
    'vec4 sampleFrame(sampler2D bg, sampler2D depth, sampler2D bld, sampler2D win, vec2 kd, vec2 uv) {',
    // фон и земля: у каждого пикселя свой сдвиг (3 итерации против «резины» на краях)
    '  vec2 p = uv;',
    '  for (int i = 0; i < 3; i++) {',
    '    float d = texture2D(depth, p).r;',                  // 0 = далеко, 1 = близко
    '    float k = d * 2.0 - 1.0;',                           // -1..1, 0 — плоскость фокуса
    '    p = 0.5 + (uv - 0.5) / (1.0 + uZoom * d) - k * uShift;',
    '  }',
    '  vec3 col = texture2D(bg, clamp(p, 0.0, 1.0)).rgb;',
    // здание: один общий сдвиг и масштаб на весь предмет — жёсткое тело
    '  vec2 pb = 0.5 + (uv - 0.5) / (1.0 + uZoom * kd.y) - kd.x * uShift;',
    '  vec4 b = texture2D(bld, pb);',                         // цвет уже умножен на альфу
    '  col = b.rgb + col * (1.0 - b.a);',
    '  float w = texture2D(win, pb).r * b.a;',                // маска окон, едет вместе со зданием
    '  return vec4(col, w);',
    '}',
    '',
    'void main() {',
    '  vec2 uv = vUv * uCoverScale + uCoverOffset;',
    '  uv = 0.5 + (uv - 0.5) / uScale;',
    '  vec4 c = sampleFrame(uBgA, uDepthA, uBldA, uWinA, uKdA, uv);',
    '  if (uMix > 0.0) c = mix(c, sampleFrame(uBgB, uDepthB, uBldB, uWinB, uKdB, uv), uMix);',
    '  float shadow = cloudShadow(uv, uTime);',
    '  c.rgb *= (1.0 - 0.12 * shadow);',
    '  gl_FragColor = c;',
    '}'
  ].join('\n');

  // Время суток: цветовая обработка готовой картинки, новых кадров не нужно.
  var POST_FRAG = [
    'precision highp float;',
    'varying vec2 vTc;',
    'uniform sampler2D uScene;',
    'uniform float uSunset;',   // 0..1
    'uniform float uNight;',    // 0..1
    'float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }',
    'void main() {',
    '  vec4 s = texture2D(uScene, vTc);',
    '  vec3 c = s.rgb;',
    '  if (uSunset > 0.001) {',
    // тени длиннее: тёмное «стекает» вдоль направления от низкого солнца
    '    vec2 dir = vec2(1.0, -0.28) * 0.012;',
    '    float smear = 0.0;',
    '    for (int i = 1; i <= 10; i++) {',
    '      vec3 tap = texture2D(uScene, vTc - dir * float(i)).rgb;',
    '      smear += smoothstep(0.66, 0.34, lum(tap)) * (1.0 - float(i) / 11.0);',
    '    }',
    '    smear = clamp(smear / 4.0, 0.0, 1.0);',
    '    float l = lum(c);',
    '    vec3 warm = c * vec3(1.10, 0.82, 0.56);',                     // тёплый оранжевый тон
    '    warm *= 1.0 - 0.5 * smear;',                                  // длинные тени
    '    warm *= mix(1.0, 0.68, smoothstep(0.55, 0.25, l));',          // тени темнее
    '    c = mix(c, warm, uSunset);',
    '  }',
    '  if (uNight > 0.001) {',
    '    vec3 night = c * vec3(0.28, 0.34, 0.55);',                    // тёмно-синий, яркость ~35%
    '    night += vec3(1.0, 0.78, 0.38) * s.a * 0.95;',                // окна башни светятся тёплым
    '    night += vec3(1.0, 0.72, 0.32) * s.a * s.a * 0.25;',
    '    c = mix(c, night, uNight);',
    '  }',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  var scenePrg = null, postPrg = null;
  var US = {}, UP = {};
  var fbo = null, sceneTex = null, fboW = 0, fboH = 0;

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }

  function makeProgram(frag, names, out) {
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.bindAttribLocation(prog, 0, 'aPos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    names.forEach(function (n) { out[n] = gl.getUniformLocation(prog, n); });
    return prog;
  }

  function initGLProgram() {
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // юниты: A = 0..3 (фон, глубина, здание, окна), B = 4..7. Сами текстуры
    // подставляются при отрисовке — подгрузки во время показа нет.
    ['uBgA', 'uDepthA', 'uBldA', 'uWinA', 'uBgB', 'uDepthB', 'uBldB', 'uWinB'].forEach(function (n, i) { gl.uniform1i(US[n], i); });
    gl.uniform1f(US.uScale, CONFIG.BASE_SCALE);

    postPrg = makeProgram(POST_FRAG, ['uScene', 'uSunset', 'uNight'], UP);
    gl.uniform1i(UP.uScene, 0);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

  function makeTexture(filter) {

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);

  }

  function uploadL(d) { // одноканальная карта

  function uploadFrame(f) {

  }

  function bindFrame(f, unit0) {

      gl.bindTexture(gl.TEXTURE_2D, t[i]);
    }

  function ensureFbo(w, h) {
    if (fbo && fboW === w && fboH === h) return;
    if (sceneTex) gl.deleteTexture(sceneTex);
    if (fbo) gl.deleteFramebuffer(fbo);
    sceneTex = makeTexture(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    fboW = w; fboH = h;
  }

  // s = состояние кадра: fa/fb (готовые кадры), mix, shiftX/Y, zoom, t
  function drawGL(fa, fb, mix, shiftX, shiftY, zoom, t) {
    ensureFbo(canvas.width, canvas.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
    // --- проход 1: сцена -> текстура ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.useProgram(scenePrg);
    bindFrame(fa, 0);
    if (fb) bindFrame(fb, 4);
    gl.uniform2f(US.uKdA, fa.kB, fa.dB);
    if (fb) gl.uniform2f(US.uKdB, fb.kB, fb.dB);
    gl.uniform2f(US.uShift, shiftX, shiftY);
    gl.uniform1f(US.uZoom, zoom);
    gl.uniform1f(US.uMix, mix);
    gl.uniform1f(US.uTime, t);
    gl.uniform2f(US.uCoverScale, coverUvW, coverUvH);
    gl.uniform2f(US.uCoverOffset, coverOffX, coverOffY);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // --- проход 2: время суток -> экран ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(postPrg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1f(UP.uSunset, tod.s);
    gl.uniform1f(UP.uNight, tod.n);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var glLost = false;
  var tod = { s: 0, n: 0 }; // время суток: вес заката и ночи (0..1), день = оба 0
  if (useGL) {
    try { initGLProgram(); } catch (err) { console.warn('WebGL shader failed, fallback:', err); useGL = false; canvas.style.display = 'none'; }
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); glLost = true; });
    canvas.addEventListener('webglcontextrestored', function () {
      try {
        initGLProgram();
        // текстуры заново: CPU-копии картинок мы не держим (память iPhone),
        // поэтому перечитываем файлы — кэш браузера отдаёт их сразу.
        Promise.all(FRAMES.map(function (_, k) { return preloadFrame(k); }))
          .then(function () { resize(true); glLost = false; });
      } catch (err) { console.warn('WebGL restore failed', err); }
    });
  }

  // ---------- загрузка и подготовка картинок ----------
  function whenLoaded(img) {
    return new Promise(function (resolve, reject) {
      if (img.complete && img.naturalWidth) return resolve(img);
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('не загрузилось: ' + img.src)); };
    });
  }

  // Картинка полностью загружена И декодирована до первого показа —
  // иначе iOS декодирует её лениво прямо во время кроссфейда (мерцание).
  function loadImage(url) {
    var img = new Image();
    img.src = url;
    return whenLoaded(img).then(function () {
      return typeof img.decode === 'function' ? img.decode().catch(function () {}) : null;
    }).then(function () { return img; });
  }

  // Не больше MAX_TEX_SIZE по длинной стороне — иначе iPhone выгружает
  // большие кадры из памяти. Возвращает {src, w, h}: src — img или canvas.
  function fitToCap(img) {
    var w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h), cap = CONFIG.MAX_TEX_SIZE;
    if (m <= cap) return { src: img, w: w, h: h };
    var s = cap / m, c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { src: c, w: c.width, h: c.height };
  }

  // Скользящий бокс-блюр по одной оси с зажатием краёв.
  function blurPass(src, dst, w, h, r, horiz) {
    var n = horiz ? w : h, lines = horiz ? h : w;
    var stride = horiz ? 1 : w, lineStride = horiz ? w : 1, div = 2 * r + 1;
    for (var l = 0; l < lines; l++) {
      var base = l * lineStride, sum = 0, k, i;
      for (k = -r; k <= r; k++) sum += src[base + Math.min(n - 1, Math.max(0, k)) * stride];
      for (i = 0; i < n; i++) {
        dst[base + i * stride] = (sum / div + 0.5) | 0;
        sum += src[base + Math.min(n - 1, i + r + 1) * stride] - src[base + Math.max(0, i - r) * stride];
      }
    }
  }
  function boxBlur(a, w, h, r) { // блюр на месте (две оси)
    var tmp = new Uint8Array(a.length);
    blurPass(a, tmp, w, h, r, true);
    blurPass(tmp, a, w, h, r, false);
  }

  // Карта глубины -> 1 канал: растягиваем контраст по 2–98 перцентилю
  // (плоскость фокуса всегда в середине диапазона), затем размываем
  // 3 проходами бокс-блюра (~CONFIG.DEPTH_BLUR_PX) — резкие ступеньки
  // глубины на границе здания и неба иначе рвут картинку.
  function prepareDepth(img) {
    var fit = fitToCap(img), w = fit.w, h = fit.h;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fit.src, 0, 0, w, h);
    var px = ctx.getImageData(0, 0, w, h).data, n = w * h;
    var a = new Uint8Array(n), hist = new Uint32Array(256), i;
    for (i = 0; i < n; i++) { a[i] = px[i * 4]; hist[a[i]]++; }

    var t = (now - t0) / 1000;

    // --- кроссфейд ---
    if (fade) {
      if (fade.t0 === null) fade.t0 = now;
      var p = (now - fade.t0) / CONFIG.FRAME_CROSSFADE_MS;
      if (p >= 1) {
        frameIndex = fade.to;
        fade = null;
        mixState = 0;
        markDot(frameIndex);
        buildHotspots(frameIndex);
      } else {
        mixState = smooth01(p);
      }
    }

    // --- наклон ---
    if (ret) {
      if (ret.t0 === null) ret.t0 = now;
      var e = easeInOutCubic((now - ret.t0) / CONFIG.RETURN_MS);
      curX = ret.fx + (targetX - ret.fx) * e;
      curY = ret.fy + (targetY - ret.fy) * e;
      if (now - ret.t0 >= CONFIG.RETURN_MS) ret = null;
    } else if (pointerActive) {
      var kf = lerpK(0.35, dt); // палец: почти без отставания
      curX += (targetX - curX) * kf;
      curY += (targetY - curY) * kf;
    } else {
      var ks = lerpK(CONFIG.SMOOTH, dt);
      curX += (targetX - curX) * ks;
      curY += (targetY - curY) * ks;
    }

    // --- автопокачивание: только пока никто не трогал экран ---
    var swayX = 0, swayY = 0;
    if (!userTouched) {
      var idle = performance.now() - lastInputAt - CONFIG.IDLE_SWAY_AFTER_MS;
      if (idle > 0) {
        var amp = CONFIG.SWAY_AMPLITUDE * smooth01(idle / 1500); // плавно набирает амплитуду
        var ph = 2 * Math.PI * (idle / 1000) / CONFIG.SWAY_PERIOD_S;
        swayX = amp * Math.sin(ph);
        swayY = amp * 0.5 * Math.sin(ph + Math.PI / 2);
      }
    }
    var tiltX = clamp(curX + swayX, -1, 1);
    var tiltY = clamp(curY + swayY, -1, 1);

    var breathX = CONFIG.BREATH_AMPLITUDE * Math.sin(t * 2 * Math.PI / CONFIG.BREATH_PERIOD_S);
    var breathY = CONFIG.BREATH_AMPLITUDE * Math.cos(t * 2 * Math.PI / (CONFIG.BREATH_PERIOD_S * 0.7));
    var shiftX = tiltX * CONFIG.MAX_SHIFT_X + breathX;
    var shiftY = tiltY * CONFIG.MAX_SHIFT_Y + breathY;
    // наклон к себе (вниз) — ближние части чуть увеличиваются
    var zoom = CONFIG.ZOOM_NEAR * clamp(tiltY, 0, 1);

    dbg.tiltX = tiltX; dbg.tiltY = tiltY; dbg.curX = curX; dbg.curY = curY;
    dbg.mix = mixState; dbg.frameIndex = frameIndex; dbg.fading = !!fade; dbg.sway = !userTouched && (performance.now() - lastInputAt) > CONFIG.IDLE_SWAY_AFTER_MS;

    resize(false);

    var fa = store[fade ? fade.from : frameIndex];
    var fb = fade ? store[fade.to] : null;

    if (useGL) {
      if (!glLost) drawGL(fa, fb, mixState, shiftX, shiftY, zoom, t);
    } else {
      var cssW = stage.clientWidth, cssH = stage.clientHeight;
      var kb = CONFIG.FALLBACK_LAYER_K;
      var ia = fade ? fade.from : frameIndex, ib = fade ? fade.to : -1;
      fbFrames.forEach(function (ff, i) {
        var on = i === ia || i === ib;
        ff.el.style.opacity = i === ia ? '1' : (i === ib ? String(mixState) : '0');
        ff.el.style.visibility = on ? 'visible' : 'hidden';
        if (!on) return;
        var bx = (kb * shiftX / coverUvW) * cssW, by = (kb * shiftY / coverUvH) * cssH;
        ff.bld.style.transform = 'translate(' + bx + 'px,' + by + 'px) scale(' + CONFIG.BASE_SCALE + ')';
        ff.bg.style.transform = 'translate(' + (-bx) + 'px,' + (-by) + 'px) scale(' + CONFIG.BASE_SCALE + ')';
      });
    }

    if (!fade) updateHotspotPositions(shiftX, shiftY, useGL ? zoom : 0);

    requestAnimationFrame(frame);
  }

  // ---------- старт ----------
  // Сначала грузим и декодируем ВСЕ кадры, только потом показываем первый.
  Promise.all(FRAMES.map(function (_, i) { return preloadFrame(i); })).then(function () {
    if (!useGL) buildFallbackDom();
    setNaturalSize(store[0].w, store[0].h);
    buildDots();
    buildHotspots(0);
    lastInputAt = performance.now();
    frame(performance.now());            // первая отрисовка, потом убираем экран загрузки —
    stage.classList.remove('loading');   // пустого кадра не бывает, даже если вкладка в фоне
  }).catch(function (err) {
    console.error(err);
    loader.textContent = 'Не удалось загрузить кадры: ' + (err && err.message ? err.message : err);
  });

})();
</script>
</body>
</html>
