<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D-фото — тест параллакса глубины</title>
<style>
  :root { --paper: #f5ecda; --ink: #2f2a25; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%;
    touch-action: none;
    user-select: none;
  }
  #stage {
    position: relative;
    /* На широком экране не растягиваем картинку больше её исходного
       разрешения — по бокам остаётся фон бумаги, как у остальных сцен
       сайта. */
    width: 100%;
    max-width: 1080px;
    aspect-ratio: var(--natW, 1080) / var(--natH, 1920);
    overflow: hidden;
    touch-action: none;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  /* На узком (телефонном) экране картинка должна занимать весь экран без
     пустых полос сверху/снизу — вместо вписывания по ширине с полями
     бумаги стейдж растягивается на весь вьюпорт, а WebGL сам обрезает
     кадр по принципу "cover" (см. uCoverScale/uCoverOffset в шейдере),
     без искажения пропорций. */
  @media (max-width: 820px) {
    body { display: block; }
    #stage {
      width: 100vw; height: 100vh; height: 100dvh;
      max-width: none; aspect-ratio: auto;
    }
  }

  #stage.loading #gl { visibility: hidden; }
  #loader {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-size: 14px; opacity: 0.7;
    transition: opacity 300ms ease;
  }
  #stage:not(.loading) #loader { opacity: 0; pointer-events: none; }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(20, 16, 8, 0.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: none; color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background 150ms ease, opacity 150ms ease;
  }
  .nav-btn:hover { background: rgba(20, 16, 8, 0.55); }
  .nav-btn:active { background: rgba(20, 16, 8, 0.7); }
  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }

  #dots {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 5;
  }
  #dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 150ms ease, transform 150ms ease;
  }
  #dots span.on { background: #fff; transform: scale(1.25); }

  /* Крупный, заметный запрос на гироскоп при первом открытии на iPhone —
     не мелкая кнопка сбоку, а центральная карточка поверх сцены. */
  #gyroOverlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(12, 10, 6, 0.5);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    transition: opacity 300ms ease;
  }
  #gyroOverlay[hidden] { display: none; }
  #gyroOverlay.gone { opacity: 0; pointer-events: none; }
  .gyro-card {
    max-width: 320px; width: 100%;
    background: var(--paper); color: var(--ink);
    border-radius: 20px; padding: 26px 22px 20px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .gyro-card .gyro-icon { font-size: 40px; margin-bottom: 10px; }
  .gyro-card p {
    margin: 0 0 18px; font-size: 16px; line-height: 1.4;
  }
  #gyroBtn {
    display: block; width: 100%;
    padding: 15px 18px; border-radius: 14px; border: none;
    background: var(--ink); color: var(--paper);
    font: 700 16px/1 -apple-system, sans-serif;
    cursor: pointer;
  }
  #gyroBtn:active { opacity: 0.85; }
  #gyroSkip {
    display: block; width: 100%; margin-top: 10px;
    padding: 10px; border: none; background: none;
    color: var(--ink); opacity: 0.6;
    font: 500 13px/1 -apple-system, sans-serif;
    cursor: pointer;
  }

  #hint {
    position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%);
    z-index: 5; font-size: 12px; color: #fff; text-align: center; max-width: calc(100% - 24px);
    background: rgba(20, 16, 8, 0.4); padding: 6px 12px; border-radius: 14px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0.9; pointer-events: none;
    transition: opacity 600ms ease;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div id="stage" class="loading">
  <div id="loader">Загрузка…</div>
  <canvas id="gl"></canvas>
  <button id="prevBtn" class="nav-btn" type="button" aria-label="Предыдущий кадр">‹</button>
  <button id="nextBtn" class="nav-btn" type="button" aria-label="Следующий кадр">›</button>
  <div id="dots"></div>
  <div id="gyroOverlay" hidden>
    <div class="gyro-card">
      <div class="gyro-icon">📱</div>
      <p>Наклони телефон — здание отзовётся объёмом</p>
      <button id="gyroBtn" type="button">Включить наклон</button>
      <button id="gyroSkip" type="button">Не сейчас</button>
    </div>
  </div>
  <div id="hint">Веди пальцем / мышью · свайп — сменить кадр</div>
</div>

<script>
/* ===================== CONFIG =====================
   Все параметры эффекта «3D-фото» собраны здесь, ничего похожего
   больше в коде не настраивается. */
var CONFIG = {
  // Сила смещения слоёв по глубине, доля ширины кадра. На мобильном
  // сильнее — там управление гироскопом/пальцем, а экран мельче.
  STRENGTH: 0.05,          // десктоп
  STRENGTH_MOBILE: 0.06,   // узкий экран (см. медиа-запрос #stage ниже)

  // Максимальный наклон гироскопа для полного смещения (мышь/палец на
  // силу смещения не влияют — там наклон уже определяется позицией
  // указателя относительно центра кадра).
  MAX_TILT_X_DEG: 20,   // по горизонтали
  MAX_TILT_Y_DEG: 20,   // по вертикали

  // Плавность возврата в центр после отпускания (0..1, больше = быстрее).
  RETURN_SMOOTH: 0.12,

  // "Дыхание" в состоянии покоя.
  BREATH_AMPLITUDE: 0.004,   // доля ширины кадра
  BREATH_PERIOD_S: 6,        // секунд на полный цикл

  // Кроссфейд между кадрами при свайпе/стрелках, мс.
  FRAME_CROSSFADE_MS: 320,

  // Список ниже между метками генерируется автоматически командой
  // .venv-depth/bin/python tools/build_frames.py — руками не редактировать,
  // править картинки в test-assets/frames/ и перезапускать скрипт.
  // У каждого кадра два слоя (против размазывания на границе башни):
  // bg — фон без здания, building — вырезка здания (RGBA) со своей глубиной.
  FRAMES: [
    /* FRAMES:START */
    { bg: { color: 'frames/v_angle_0_bg.png', depth: 'frames/v_angle_0_bg_depth.png' }, building: { color: 'frames/v_angle_0_building.png', depth: 'frames/v_angle_0_depth.png' } },
    { bg: { color: 'frames/v_angle_1_bg.png', depth: 'frames/v_angle_1_bg_depth.png' }, building: { color: 'frames/v_angle_1_building.png', depth: 'frames/v_angle_1_depth.png' } },
    { bg: { color: 'frames/v_angle_2_bg.png', depth: 'frames/v_angle_2_bg_depth.png' }, building: { color: 'frames/v_angle_2_building.png', depth: 'frames/v_angle_2_depth.png' } },
    { bg: { color: 'frames/v_angle_3_bg.png', depth: 'frames/v_angle_3_bg_depth.png' }, building: { color: 'frames/v_angle_3_building.png', depth: 'frames/v_angle_3_depth.png' } },
    { bg: { color: 'frames/v_angle_4_bg.png', depth: 'frames/v_angle_4_bg_depth.png' }, building: { color: 'frames/v_angle_4_building.png', depth: 'frames/v_angle_4_depth.png' } },
    { bg: { color: 'frames/v_angle_5_bg.png', depth: 'frames/v_angle_5_bg_depth.png' }, building: { color: 'frames/v_angle_5_building.png', depth: 'frames/v_angle_5_depth.png' } },
    /* FRAMES:END */
  ]
};
/* ==================================================== */

(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('gl');
  var loader = document.getElementById('loader');
  var hint = document.getElementById('hint');
  var gyroOverlay = document.getElementById('gyroOverlay');
  var gyroBtn = document.getElementById('gyroBtn');
  var gyroSkip = document.getElementById('gyroSkip');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var dotsEl = document.getElementById('dots');

  var gl = canvas.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false })
        || canvas.getContext('experimental-webgl');
  if (!gl) {
    loader.textContent = 'WebGL не поддерживается этим браузером.';
    return;
  }

  // ---------- шейдеры ----------
  var VERT = [
    'attribute vec2 aPos;',
    'varying vec2 vUv;',
    'void main() {',
    '  vUv = aPos * 0.5 + 0.5;',
    '  vUv.y = 1.0 - vUv.y;',
    '  gl_Position = vec4(aPos, 0.0, 1.0);',
    '}'
  ].join('\n');

  // Два слоя на кадр — фон (bg) и вырезка здания (building, RGBA) — у
  // каждого своя глубина. Так граница башни не "размазывает" фон и
  // наоборот: смещаются независимо, а собираются через alpha-blend.
  var FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uBgColorA;',
    'uniform sampler2D uBgDepthA;',
    'uniform sampler2D uBldColorA;',
    'uniform sampler2D uBldDepthA;',
    'uniform sampler2D uBgColorB;',
    'uniform sampler2D uBgDepthB;',
    'uniform sampler2D uBldColorB;',
    'uniform sampler2D uBldDepthB;',
    'uniform float uMix;',       // 0 = кадр A, 1 = кадр B
    'uniform vec2  uTilt;',      // текущий сглаженный наклон, -1..1
    'uniform vec2  uBreath;',    // офсет "дыхания"
    'uniform float uStrength;',
    'uniform vec2  uCoverScale;', // "cover"-обрезка кадра под экран (моб.)
    'uniform vec2  uCoverOffset;',
    '',
    'vec3 layer(sampler2D bgColor, sampler2D bgDepth, sampler2D bldColor, sampler2D bldDepth, vec2 uv) {',
    '  float dBg = texture2D(bgDepth, uv).r;',
    '  vec2 offBg = dBg * (uStrength * uTilt + uBreath);',
    '  vec2 uvBg = clamp(uv - offBg, 0.0, 1.0);',
    '  vec3 bg = texture2D(bgColor, uvBg).rgb;',
    '',
    '  float dBld = texture2D(bldDepth, uv).r;',
    '  vec2 offBld = dBld * (uStrength * uTilt + uBreath);',
    '  vec2 uvBld = clamp(uv - offBld, 0.0, 1.0);',
    '  vec4 bld = texture2D(bldColor, uvBld);',
    '',
    '  return mix(bg, bld.rgb, bld.a);',
    '}',
    '',
    'void main() {',
    '  vec2 uv = vUv * uCoverScale + uCoverOffset;',
    '  vec3 a = layer(uBgColorA, uBgDepthA, uBldColorA, uBldDepthA, uv);',
    '  vec3 b = layer(uBgColorB, uBgDepthB, uBldColorB, uBldDepthB, uv);',
    '  gl_FragColor = vec4(mix(a, b, uMix), 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  var quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uMix = gl.getUniformLocation(prog, 'uMix');
  var uTilt = gl.getUniformLocation(prog, 'uTilt');
  var uBreath = gl.getUniformLocation(prog, 'uBreath');
  var uStrength = gl.getUniformLocation(prog, 'uStrength');
  var uCoverScale = gl.getUniformLocation(prog, 'uCoverScale');
  var uCoverOffset = gl.getUniformLocation(prog, 'uCoverOffset');

  // 8 текстурных юнитов: {bg,bld} x {color,depth} x {A,B}
  var LAYER_KEYS = ['bgColor', 'bgDepth', 'bldColor', 'bldDepth'];
  var texUnits = {};
  var unitIndex = 0;
  ['A', 'B'].forEach(function (slot) {
    LAYER_KEYS.forEach(function (key) {
      var name = key + slot; // напр. bgColorA
      var loc = gl.getUniformLocation(prog, 'u' + name.charAt(0).toUpperCase() + name.slice(1));
      texUnits[name] = { tex: null, unit: unitIndex, loc: loc };
      unitIndex++;
    });
  });

  // Тот же брейкпоинт, что и у #stage в CSS (узкий экран = мобильный режим).
  var mobileQuery = window.matchMedia('(max-width: 820px)');
  function updateStrength() {
    gl.uniform1f(uStrength, mobileQuery.matches ? CONFIG.STRENGTH_MOBILE : CONFIG.STRENGTH);
  }
  updateStrength();

  // ---------- текстуры ----------
  function makeTexUnit(entry) {
    var tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + entry.unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    // 1x1 прозрачная заглушка, пока не пришла настоящая картинка
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
    entry.tex = tex;
    gl.uniform1i(entry.loc, entry.unit);
  }
  Object.keys(texUnits).forEach(function (k) { makeTexUnit(texUnits[k]); });

  function loadInto(name, url) {
    var entry = texUnits[name];
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        gl.activeTexture(gl.TEXTURE0 + entry.unit);
        gl.bindTexture(gl.TEXTURE_2D, entry.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        resolve(img);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- размер холста ----------
  var natW = 1080, natH = 1920; // перезапишется по первой реальной картинке
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }

    // "cover": если пропорции стейджа (моб. — во весь экран) не совпадают
    // с пропорциями картинки, вписываем без искажений и обрезаем лишнее,
    // а не растягиваем и не оставляем пустых полос. Считаем через
    // отображаемый размер картинки при масштабе "cover", как в CSS
    // background-size: cover.
    var factor = Math.max(cssW / natW, cssH / natH);
    var dispW = natW * factor, dispH = natH * factor;
    var uvW = cssW / dispW, uvH = cssH / dispH;
    gl.uniform2f(uCoverScale, uvW, uvH);
    gl.uniform2f(uCoverOffset, (1 - uvW) / 2, (1 - uvH) / 2);

    updateStrength();
  }
  window.addEventListener('resize', resize);

  function setNaturalSize(w, h) {
    natW = w; natH = h;
    document.documentElement.style.setProperty('--natW', String(w));
    document.documentElement.style.setProperty('--natH', String(h));
    stage.style.maxWidth = w + 'px';
    resize();
  }

  // ---------- загрузка кадров ----------
  var frameIndex = 0;

  function loadLayerSet(i, slot) {
    var f = CONFIG.FRAMES[i];
    return Promise.all([
      loadInto('bgColor' + slot, f.bg.color),
      loadInto('bgDepth' + slot, f.bg.depth),
      loadInto('bldColor' + slot, f.building.color),
      loadInto('bldDepth' + slot, f.building.depth)
    ]);
  }

  function buildDots() {
    dotsEl.innerHTML = '';
    CONFIG.FRAMES.forEach(function (_, i) {
      var d = document.createElement('span');
      if (i === frameIndex) d.className = 'on';
      dotsEl.appendChild(d);
    });
  }

  function markDot(i) {
    var kids = dotsEl.children;
    for (var k = 0; k < kids.length; k++) kids[k].classList.toggle('on', k === i);
  }

  var mixState = 0;
  var crossfading = false;
  var _pendingIndex = 0;

  function goTo(newIndex) {
    if (crossfading) return;
    var n = CONFIG.FRAMES.length;
    newIndex = ((newIndex % n) + n) % n;
    if (newIndex === frameIndex) return;
    crossfading = true;
    _pendingIndex = newIndex;
    loadLayerSet(newIndex, 'B').then(function (imgs) {
      var bgImg = imgs[0];
      if (bgImg.naturalWidth) setNaturalSize(bgImg.naturalWidth, bgImg.naturalHeight);
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / CONFIG.FRAME_CROSSFADE_MS);
        mixState = t;
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          loadLayerSet(newIndex, 'A'); // B становится A для следующего перехода
          frameIndex = newIndex;
          markDot(frameIndex);
          crossfading = false;
          mixState = 0;
        }
      }
      requestAnimationFrame(step);
    });
  }

  function initFirstFrame() {
    return loadLayerSet(0, 'A').then(function (imgs) {
      var bgImg = imgs[0];
      if (bgImg.naturalWidth) setNaturalSize(bgImg.naturalWidth, bgImg.naturalHeight);
      stage.classList.remove('loading');
      buildDots();
    });
  }

  // ---------- ввод: мышь/палец, позиционный наклон ----------
  var targetTiltX = 0, targetTiltY = 0; // -1..1
  var curTiltX = 0, curTiltY = 0;
  var pointerActive = false;
  var gyroActive = false;

  function setTiltFromClient(clientX, clientY) {
    var r = stage.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var nx = (clientX - cx) / (r.width / 2);
    var ny = (clientY - cy) / (r.height / 2);
    nx = Math.max(-1, Math.min(1, nx));
    ny = Math.max(-1, Math.min(1, ny));
    targetTiltX = nx;
    targetTiltY = ny;
  }

  var swipeStartX = null, swipeStartY = null, swipeMoved = false;

  stage.addEventListener('pointerdown', function (e) {
    pointerActive = true;
    hint.classList.add('gone');
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    swipeMoved = false;
    setTiltFromClient(e.clientX, e.clientY);
  });

  stage.addEventListener('pointermove', function (e) {
    // На десктопе (мышь) наклон следует за курсором и без нажатия.
    // На тач-устройствах pointermove без активного касания не приходит,
    // так что здесь же обрабатывается и перетаскивание пальцем.
    if (e.pointerType === 'mouse' || pointerActive) {
      setTiltFromClient(e.clientX, e.clientY);
    }
    if (pointerActive && swipeStartX !== null) {
      if (Math.abs(e.clientX - swipeStartX) > 6 || Math.abs(e.clientY - swipeStartY) > 6) {
        swipeMoved = true;
      }
    }
  });

  function releasePointer(e) {
    pointerActive = false;
    if (e && e.pointerType !== 'mouse') {
      // Мышь просто продолжает управлять наклоном по hover (см. mouseleave),
      // а для пальца — плавный возврат в центр сразу после отпускания.
      targetTiltX = 0;
      targetTiltY = 0;
    }
    if (e && swipeMoved && e.pointerType !== 'mouse') {
      var dx = e.clientX - swipeStartX;
      if (Math.abs(dx) > 40) {
        goTo(frameIndex + (dx < 0 ? 1 : -1));
      }
    }
    swipeStartX = null;
  }
  stage.addEventListener('pointerup', releasePointer);
  stage.addEventListener('pointercancel', releasePointer);

  stage.addEventListener('mouseleave', function () {
    if (!pointerActive) { targetTiltX = 0; targetTiltY = 0; }
  });

  // ---------- клавиатура и кнопки ----------
  prevBtn.addEventListener('click', function () { goTo(frameIndex - 1); });
  nextBtn.addEventListener('click', function () { goTo(frameIndex + 1); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') goTo(frameIndex - 1);
    else if (e.key === 'ArrowRight') goTo(frameIndex + 1);
  });

  // ---------- гироскоп (iPhone) ----------
  var gyroBaseBeta = null, gyroBaseGamma = null;

  function onOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    if (gyroBaseBeta === null) { gyroBaseBeta = e.beta; gyroBaseGamma = e.gamma; }
    var dGamma = e.gamma - gyroBaseGamma; // лево/право
    var dBeta = e.beta - gyroBaseBeta;    // вперёд/назад
    if (!pointerActive) {
      targetTiltX = Math.max(-1, Math.min(1, dGamma / CONFIG.MAX_TILT_X_DEG));
      targetTiltY = Math.max(-1, Math.min(1, dBeta / CONFIG.MAX_TILT_Y_DEG));
    }
  }

  function hideGyroOverlay() {
    gyroOverlay.classList.add('gone');
    setTimeout(function () { gyroOverlay.hidden = true; }, 320);
  }

  function enableGyro() {
    gyroActive = true;
    window.addEventListener('deviceorientation', onOrientation);
    hideGyroOverlay();
  }

  var needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';

  if (needsPermission) {
    // Крупная, заметная карточка сразу при первом открытии — не мелкая
    // кнопка сбоку, легко не заметить на фоне картинки.
    gyroOverlay.hidden = false;
    gyroBtn.addEventListener('click', function () {
      DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state === 'granted') enableGyro();
        else hideGyroOverlay();
      }).catch(function () {
        hideGyroOverlay();
      });
    });
    gyroSkip.addEventListener('click', hideGyroOverlay);
  } else if (typeof DeviceOrientationEvent !== 'undefined' && window.DeviceOrientationEvent) {
    // Android и прочие — разрешение не требуется, карточка не нужна.
    enableGyro();
  }

  // ---------- рендер-цикл ----------
  var t0 = performance.now();

  function frame(now) {
    var t = (now - t0) / 1000;

    // сглаживание к целевому наклону (или к центру)
    curTiltX += (targetTiltX - curTiltX) * CONFIG.RETURN_SMOOTH;
    curTiltY += (targetTiltY - curTiltY) * CONFIG.RETURN_SMOOTH;

    var breathX = CONFIG.BREATH_AMPLITUDE * Math.sin(t * 2 * Math.PI / CONFIG.BREATH_PERIOD_S);
    var breathY = CONFIG.BREATH_AMPLITUDE * Math.cos(t * 2 * Math.PI / (CONFIG.BREATH_PERIOD_S * 0.7));

    // curTiltX/Y уже нормированы в -1..1: 1 соответствует MAX_TILT_*_DEG
    // градусов реального наклона (см. setTiltFromClient и onOrientation).
    // Сама сила смещения (доля ширины кадра) — это STRENGTH из CONFIG.
    var tiltX = curTiltX;
    var tiltY = curTiltY;

    resize();
    gl.uniform2f(uTilt, tiltX, tiltY);
    gl.uniform2f(uBreath, breathX, breathY);
    gl.uniform1f(uMix, mixState);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(frame);
  }

  initFirstFrame().then(function () {
    requestAnimationFrame(frame);
  }).catch(function (err) {
    loader.textContent = 'Не удалось загрузить кадры: ' + err;
  });

})();
</script>
</body>
</html>
