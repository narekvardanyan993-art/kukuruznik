<link rel="preload" href="welcome-loader.js" as="script">

<link rel="preload" href="fonts/NotoSerif-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/NotoSerifArmenian-armenian.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Один шрифт для hy/ru/en — Noto Serif: латиница и кириллица (Noto Serif) и армянский (Noto Serif Armenian)
     из одной системы дизайна, лицензия OFL (fonts/LICENSE.txt). Подключён локально, один вес 400–700. */
  @font-face { font-family: "Kukuruznik Serif"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(fonts/NotoSerif-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Kukuruznik Serif"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(fonts/NotoSerif-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Kukuruznik Serif"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(fonts/NotoSerifArmenian-armenian.woff2) format("woff2"); unicode-range: U+0308, U+0530-058F, U+2010, U+2024, U+25CC, U+FB13-FB17; }
  :root {
    --font: "Kukuruznik Serif", "Noto Serif", serif;
    --paper: #f5ecda; --paper-2: #ede0c2; --ink: #2f2a25;
    /* Пружина как в iOS: response 0.65 с, damping ratio 0.86 (мягкий разгон, плавное торможение,
       оседание ~0.5% без заметного отскока). Кривая — ступенчатый отклик пружины, оседает за ~0.86 с. */
    --spring: cubic-bezier(0.22, 1, 0.36, 1);   /* запасной вариант, если браузер не знает linear() */
    --dur: 860ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);     /* прежняя кривая — только шторка и окна подсказок на телефоне */
    --panelW: 416px;   /* v12: панель шире на 30% (было 320) */
    /* Сетка отступов: шаг 8 px (8 / 16 / 24 / 32) — все внешние и внутренние отступы панели и оверлеев. */
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
    --fs-body: 18px; --fs-small: 15px; --fs-card: 22px;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, 0.0193, 0.0683, 0.1365, 0.2155, 0.2993, 0.3832, 0.4643, 0.5405, 0.6104, 0.6734, 0.7293, 0.7782, 0.8205, 0.8565, 0.8869, 0.9123, 0.9332, 0.9502, 0.9639, 0.9748, 0.9834, 0.9899, 0.9949, 0.9985, 1.0011, 1.0029, 1.0041, 1.0047, 1.005, 1.005, 1.0048, 1.0045, 1.0042, 1.0038, 1.0033, 1.0029, 1.0025, 1.0021, 1.0018, 1); }
  }
  /* Размер текста: «крупный» по умолчанию (аудитория пожилая). */
  html[data-textsize="normal"] { --fs-body: 15px; --fs-small: 13px; --fs-card: 17px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 var(--font);
    overscroll-behavior: none;
  }
  body { user-select: none; }
  #layout { height: 100%; }
  #view { height: 100%; }
  #stage {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: none;
    background: #000;
  }
  #gl { display: block; width: 100%; height: 100%; }

  /* Телефон (до 1024 px): картинка на весь экран, WebGL сам обрезает кадр
     по принципу "cover" (uCoverScale/uCoverOffset), без искажения. */

  /* ПК (от 1024 px): слева панель 320 px, справа картинка по центру с
     бумажными полями. Панель сворачивается в тонкую полоску. */
  @media (min-width: 1024px) {
    #layout {
      display: grid; grid-template-columns: var(--panelW) 1fr;
      transition: grid-template-columns var(--dur) var(--spring);
    }
    body.panel-collapsed { --panelW: 48px; }
    /* Картинка как экспонат: паспарту (светлая бумага, поля 28 px) в тонкой рамке, мягкая тень — «висит на стене»;
       рисованный город на фоне — стена зала; под рамкой музейная табличка; стрелки прикреплены к краям рамки по центру высоты. */
    #view {
      container-type: inline-size;      /* 100cqw — ширина стены, плавно следует за панелью */
      display: grid; place-items: center; padding: var(--s3); min-width: 0;
    }
    #exhibit { margin: 0; display: grid; justify-items: center; row-gap: var(--s3); }
    #frame {
      position: relative; padding: 28px; background: #faf4e6;
      border: 3px solid #3b332b; border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), 0 1px 0 rgba(47,42,37,0.4), 0 22px 48px rgba(60,45,20,0.30), 0 4px 10px rgba(60,45,20,0.18);
    }
    #stage {
      /* доступная ширина: стена − паспарту − место для стрелок; высота: окно − отступы − паспарту − табличка */
      width: min(calc(100cqw - 56px - 128px), calc((100dvh - 48px - 56px - 6px - 64px - var(--s3)) * var(--natW, 768) / var(--natH, 1365)));
      height: auto;
      aspect-ratio: var(--natW, 768) / var(--natH, 1365);
      border-radius: 1px;
      box-shadow: 0 0 0 1px rgba(47,42,37,0.45), inset 0 0 0 1px rgba(47,42,37,0.2);   /* тонкая линия окна паспарту */
    }
    #prevSide, #nextSide { position: absolute; top: 50%; z-index: 6; margin-top: -32px; }
    #prevSide { left: -35px; }
    #nextSide { right: -35px; }
    #exhibit #plaque {
      display: block; max-width: min(460px, 100%); padding: 10px 24px; text-align: center;
      background: #f8f1e0; color: var(--ink); border: 1px solid rgba(47,42,37,0.55); border-radius: 2px;
      box-shadow: inset 0 0 0 3px #f8f1e0, inset 0 0 0 4px rgba(47,42,37,0.25), 0 3px 8px rgba(60,45,20,0.22);
      font: 600 15px/1.35 var(--font); letter-spacing: 0.02em;
    }
  }
  /* телефон: обёртки-экспонат не нужны, картинка на весь экран */
  @media (max-width: 1023.98px) { #exhibit, #frame { display: contents; } }

  #plaque { display: none; }   /* только на ПК (см. блок выше) */
  #stage.loading { background: var(--paper); }
  #stage.loading #gl, #stage.loading #fallback { visibility: hidden; }
  /* Откат без WebGL: два слоя (фон + здание) на кадр, двигаются CSS-ом. */
  #fallback { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #fallback[hidden] { display: none; }
  .fb-frame { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .fb-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; will-change: transform; pointer-events: none;
  }

  /* Бумажная круглая кнопка сайта: карандашный контур, мягкая тень. Так выглядят стрелки ‹ ›, «домой» и кнопка панели;
     наведение и нажатие — как у кнопок панели (на 4% темнее, при нажатии бумага темнее и кнопка чуть меньше). */
  .arrow-btn {
    display: grid; place-items: center; padding: 0; flex: none;
    border: 2px solid var(--ink); border-radius: 50% 44% 50% 44%; background: var(--paper); color: var(--ink);
    box-shadow: 0 6px 16px rgba(60,45,20,0.26), 2px 3px 0 rgba(47,42,37,0.14);
    cursor: pointer; text-decoration: none;
    transition: filter 200ms var(--spring), transform 200ms var(--spring), background-color 200ms var(--spring);
  }
  .arrow-btn svg { display: block; }
  .arrow-btn:active { background-color: var(--paper-2); transform: scale(0.96); }
  .nav-next svg { transform: rotate(180deg); }
  .nav-btn { position: absolute; top: calc(50% - 24px); width: 48px; height: 48px; z-index: 5; }
  #prevBtn { left: calc(var(--safe-l) + var(--s2)); }
  #nextBtn { right: calc(var(--safe-r) + var(--s2)); }

  /* Телефон: одна полоса снизу (с учётом safe-area): слева кнопка панели, по центру название, справа «домой».
     Сверху на картинке ничего нет. */
  :root { --bar-h: calc(56px + 2 * var(--s1)); }
  #bottomBar { display: none; }
  #barTitle {
    min-width: 0; text-align: center; color: var(--ink);
    font: 700 18px/1.2 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #homeBtn { width: 56px; height: 56px; }
  @media (max-width: 1023.98px) {
    /* Раскладка нижней полосы (вид кнопок и подписи — в конце файла: мягкая бумажная подложка, v12.1). */
    #bottomBar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; pointer-events: none;
      display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; column-gap: var(--s1);
      padding: var(--s1) calc(var(--safe-r) + var(--s2)) calc(var(--safe-b) + var(--s1)) calc(var(--safe-l) + var(--s2));
      background: none; border: 0; box-shadow: none;
    }
    #barTitle { grid-column: 2; }
    #homeBtn { grid-column: 3; }
    .nav-btn { width: 56px; height: 56px; top: calc(50% - 28px); }
    .nav-btn svg { width: 36px; height: 36px; }
    #bottomBar #flagBtnB { display: grid; position: absolute; right: calc(var(--safe-r) + var(--s2)); bottom: 100%; width: 56px; height: 56px; margin-bottom: 0; }
    #bottomBar #flagBtnB[hidden] { display: none; }
    #bottomBar #flagBtnB svg { width: 36px; height: 36px; }
    #build-version { right: auto; left: calc(var(--safe-l) + var(--s1)); max-width: calc(50% - 44px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* Кнопка «Парад»: маленькая, флаг Армении карандашом. ПК — в панели рядом с «домиком»; телефон — в нижней полосе над «домой».
     Живёт только на кадре 1 (на других гаснет). Пока идёт показ, флаг колышется, а ореол переливается красным-синим-абрикосовым.
     При fps < 45 или «уменьшении движения» кнопка скрыта. */
  .flag-btn, .p-home { width: 44px; height: 44px; }
  .flag-btn svg { display: block; width: 30px; height: 30px; overflow: visible; }
  .p-home svg { display: block; width: 28px; height: 28px; }
  .flag-btn[aria-disabled="true"] { cursor: default; }
  .flag-btn[hidden] { display: none; }
  .flag-btn { transition: opacity 400ms var(--spring), transform 200ms var(--spring); }
  .flag-btn.off-frame { opacity: 0; pointer-events: none; transform: scale(0.8); }
  #flagBtnB { display: none; }
  /* упрощённый парад (слабое устройство, «уменьшить движение», нет WebGL): флаг проявляется в небе, чуть колышется и растворяется, ~6 с */
  .flag-lite { position: absolute; left: 50%; top: 14%; margin-left: -70px; z-index: 5; pointer-events: none; opacity: 0; animation: liteFlag 6.4s ease-in-out both; }
  .flag-lite svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .flag-lite .fb { transform-box: fill-box; transform-origin: 0% 50%; animation: flagWave 1.2s ease-in-out infinite; }
  .flag-lite .fb2 { animation-delay: -0.2s; } .flag-lite .fb3 { animation-delay: -0.4s; }
  @keyframes liteFlag { 0% { opacity: 0; transform: translateY(8px); } 14% { opacity: 1; transform: none; } 82% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { html:not([data-motion="on"]) .flag-lite .fb { animation: none; } }
  .p-top-row { display: flex; align-items: center; gap: var(--s2); }
  .flag-btn .fb { transform-box: fill-box; transform-origin: 0% 50%; }
  .flag-btn.busy .fb { animation: flagWave 800ms ease-in-out infinite; }
  .flag-btn.busy .fb2 { animation-delay: -130ms; }
  .flag-btn.busy .fb3 { animation-delay: -260ms; }
  .flag-btn.busy svg { animation: flagGlow 2.4s linear infinite; }
  @keyframes flagWave { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-9deg) scaleX(0.9); } }
  @keyframes flagGlow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(217,0,18,0.95)); }
    33% { filter: drop-shadow(0 0 4px rgba(36,84,200,0.95)); }
    66% { filter: drop-shadow(0 0 4px rgba(242,168,0,0.95)); }
  }
  @media (prefers-reduced-motion: reduce) { html:not([data-motion="on"]) .flag-btn.busy .fb, html:not([data-motion="on"]) .flag-btn.busy svg { animation: none; } }

  #dots {
    position: absolute; left: 50%; bottom: calc(var(--safe-b) + var(--bar-h) + var(--s1)); transform: translateX(-50%);
    display: flex; gap: var(--s1); z-index: 5;
  }
  #dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background var(--dur) var(--spring), transform var(--dur) var(--spring);
  }
  #dots span.on { background: #fff; transform: scale(1.25); }

  #build-version {
    position: absolute; right: calc(var(--safe-r) + var(--s1)); bottom: calc(var(--safe-b) + var(--bar-h) + var(--s1)); z-index: 5;
    font: 500 9px/1 var(--font); color: #fff; opacity: 0.55;
    pointer-events: none;
  }

  /* ПК: на самой картинке остаются только картинка и точки-подсказки; «на сайт» и название — вверху
     панели, стрелки — в пустых полях по бокам, миниатюры вместо кружков-точек. Телефон не меняется. */
  .p-top, .nav-side, .p-build { display: none; }
  .nav-side { width: 64px; height: 64px; }
  @media (min-width: 1024px) {
    #bottomBar, #dots, #build-version, #prevBtn, #nextBtn, .panel-scroll > .p-title { display: none; }
    .p-top { display: grid; justify-items: start; row-gap: var(--s1); margin-right: var(--s4); }
    .p-name { font: 700 26px/1.2 var(--font); }
    .p-build { display: block; font: 500 10px/1.2 var(--font); opacity: 0.5; }
    .nav-side { display: grid; }
  }
  /* Фон-стена на ПК (v12.2): армянские буквы и несколько тонких символов, тон в тон с бумагой; расстановку под размер окна делает wall.js
     (данные и буквы Noto Serif Armenian, OFL — wall-data.js). На телефоне стены нет. */
  #wall { display: none; }
  @media (min-width: 1024px) {
    #wall { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 450ms var(--spring); }
    #wall.on { opacity: 1; }
    #wall .w { fill: none; stroke: #5d4c31; stroke-opacity: 0.17; stroke-linecap: round; stroke-linejoin: round; }
    #layout { position: relative; z-index: 1; }
  }

  /* ---------- Панель (скетч-стиль: бумага, карандашная рамка, мягкая тень) ---------- */
  .sketch {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;
    box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14);
    outline: 1px solid rgba(47,42,37,0.3); outline-offset: -7px;
  }
  #panel { position: relative; overflow: hidden; z-index: 50; }
  .panel-card {
    position: absolute; top: var(--s2); bottom: var(--s2); left: var(--s2); width: 384px;   /* 416 − 2×16: карточка не сжимается, когда колонка сворачивается */
    display: grid; grid-template-rows: minmax(0, 1fr); overflow: hidden; padding: 0; font-size: var(--fs-body);
  }
  /* Прокручивается внутренняя область: пункты стоят сеткой с единым шагом 16, сверху и снизу всегда 24.
     У краёв контент растворяется маской (16 px), поэтому при прокрутке он не «прилипает» к рамке. */
  .panel-scroll {
    min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
    display: grid; align-content: start; row-gap: var(--s2);
    padding: var(--s3) var(--s2);
    scroll-padding: var(--s3) 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--s2), #000 calc(100% - var(--s2)), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--s2), #000 calc(100% - var(--s2)), transparent 100%);
  }
  .panel-scroll > * { min-width: 0; }
  /* Перо рисует контур листа (SVG поверх карточки, его путь строит скрипт по размеру карточки). Только ПК. */
  .pen { display: none; }
  @media (min-width: 1024px) {
    #panel { overflow: visible; }   /* карточка и перо не обрезаются, пока колонка сжимается/растёт */
    .pen { display: block; position: absolute; left: var(--s2); top: var(--s2); width: 384px; height: calc(100% - 2 * var(--s2)); overflow: visible; pointer-events: none; z-index: 2; }
    .pen path { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pen .pen-1 { stroke-width: 2.4; }
    .pen .pen-2 { stroke-width: 1.1; opacity: 0.4; }
    .pen .nib { fill: var(--ink); opacity: 0; offset-rotate: 0deg; }   /* кончик пера: точка, бегущая по контуру (offset-path ставит скрипт) */
    /* свёрнута без анимации (страница открыта уже свёрнутой): карточки нет */
    body.panel-collapsed .panel-card { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ---- Появление (~1.5 с): перо ведёт основной контур листа (0.15–1.05 с; виден кончик пера), следом внутренний карандашный,
       потом бумага наливается цветом, потом текст проявляется по пунктам. Запускается при загрузке и при раскрытии панели. ---- */
    body:not(.panel-collapsed) .pen .pen-1 { animation: penDraw 900ms cubic-bezier(0.4, 0.05, 0.3, 1) 150ms both, penFade 250ms linear 1050ms both; }
    body:not(.panel-collapsed) .pen .pen-2 { animation: penDraw 800ms cubic-bezier(0.4, 0.05, 0.3, 1) 450ms both, penFade 250ms linear 1250ms both; }
    body:not(.panel-collapsed) .pen .nib { animation: nibGo 900ms cubic-bezier(0.4, 0.05, 0.3, 1) 150ms both; }
    body:not(.panel-collapsed) .panel-card { animation: sheetIn 1000ms linear 500ms both; }
    body:not(.panel-collapsed) .panel-scroll > * { animation: itemIn 380ms var(--ease) both; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(1) { animation-delay: 1000ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(2) { animation-delay: 1030ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(3) { animation-delay: 1060ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(4) { animation-delay: 1090ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(5) { animation-delay: 1120ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(6) { animation-delay: 1150ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(7) { animation-delay: 1180ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(8) { animation-delay: 1210ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(9) { animation-delay: 1240ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(10) { animation-delay: 1270ms; }
    body:not(.panel-collapsed) .panel-scroll > *:nth-child(11) { animation-delay: 1300ms; }

    /* ---- Закрытие (~0.9 с) — то же наоборот: текст гаснет, бумага бледнеет, контур «собирается» — перо втягивает линию обратно
       по пути, кончик пера уходит к началу; потом колонка сжимается. Только после первого нажатия кнопки (html.panel-anim). ---- */
    html.panel-anim body.panel-collapsed .pen .pen-1 { animation: penUndraw 650ms cubic-bezier(0.5, 0, 0.3, 1) 150ms both; }
    html.panel-anim body.panel-collapsed .pen .pen-2 { animation: penUndraw 550ms cubic-bezier(0.5, 0, 0.3, 1) 100ms both; }
    html.panel-anim body.panel-collapsed .pen .nib { animation: nibBack 650ms cubic-bezier(0.5, 0, 0.3, 1) 150ms both; }
    html.panel-anim body.panel-collapsed .panel-card { animation: sheetOut 850ms linear both; }
    html.panel-anim body.panel-collapsed .panel-scroll > * { animation: itemOut 260ms ease both; }
    html.panel-anim body.panel-collapsed #layout { transition-delay: 350ms; }
    html.panel-anim body.panel-collapsed #panelBtn { transition-delay: 350ms, 0ms, 0ms; }
  }
  @keyframes penDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes penUndraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1; } }
  @keyframes penFade { from { opacity: 1; } to { opacity: 0; } }
  @keyframes nibGo { 0% { offset-distance: 0%; opacity: 1; } 96% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  @keyframes nibBack { 0% { offset-distance: 100%; opacity: 1; } 96% { offset-distance: 0%; opacity: 1; } 100% { offset-distance: 0%; opacity: 0; } }
  /* бумага: пока идёт контур (первая половина) листа как бы нет — только линия пера; потом заливка, тень и родная рамка (под линией пера) */
  @keyframes sheetIn {
    0%, 10% { background-color: rgba(245,236,218,0); border-color: transparent; outline-color: transparent; box-shadow: 0 12px 32px rgba(60,45,20,0), 3px 4px 0 rgba(47,42,37,0); }
    55% { background-color: rgba(245,236,218,1); border-color: transparent; outline-color: transparent; box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14); }
    70% { border-color: #2f2a25; outline-color: rgba(47,42,37,0.3); }
    100% { background-color: rgba(245,236,218,1); border-color: #2f2a25; outline-color: rgba(47,42,37,0.3); box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14); }
  }
  @keyframes sheetOut {
    0% { opacity: 1; visibility: visible; background-color: rgba(245,236,218,1); border-color: #2f2a25; outline-color: rgba(47,42,37,0.3); box-shadow: 0 12px 32px rgba(60,45,20,0.24), 3px 4px 0 rgba(47,42,37,0.14); }
    10% { opacity: 1; visibility: visible; border-color: transparent; outline-color: transparent; }
    30% { opacity: 1; visibility: visible; background-color: rgba(245,236,218,1); border-color: transparent; }
    85% { opacity: 1; visibility: visible; background-color: rgba(245,236,218,0); border-color: transparent; outline-color: transparent; box-shadow: 0 12px 32px rgba(60,45,20,0), 3px 4px 0 rgba(47,42,37,0); }
    100% { opacity: 0; visibility: hidden; background-color: rgba(245,236,218,0); border-color: transparent; box-shadow: none; }
  }
  @keyframes itemIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes itemOut { from { opacity: 1; } to { opacity: 0; } }
  /* «Уменьшение движения»: обычное плавное появление и исчезновение, без пера и сдвигов */
  @media (min-width: 1024px) and (prefers-reduced-motion: reduce) {
    html:not([data-motion="on"]) .pen { display: none; }
    html:not([data-motion="on"]) body:not(.panel-collapsed) .panel-card { animation: sheetFade 450ms ease both; }
    html:not([data-motion="on"]) body:not(.panel-collapsed) .panel-scroll > * { animation: none; }
    html:not([data-motion="on"]).panel-anim body.panel-collapsed .panel-card { animation: sheetFadeOut 250ms ease both; }
    html:not([data-motion="on"]).panel-anim body.panel-collapsed .panel-scroll > * { animation: none; }
    html:not([data-motion="on"]).panel-anim body.panel-collapsed #layout, html:not([data-motion="on"]).panel-anim body.panel-collapsed #panelBtn { transition-delay: 0ms; }
  }
  @keyframes sheetFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetFadeOut { from { opacity: 1; visibility: visible; } 99% { opacity: 0; visibility: visible; } to { opacity: 0; visibility: hidden; } }
  .p-title { font: 700 26px/1.2 var(--font); display: block; margin: 0 var(--s3) 0 0; }
  .p-sec { margin: 0; }
  .p-sec h3 { margin: 0 0 var(--s1); font: 700 20px/1.2 var(--font); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px; overflow: hidden; }
  .seg button {
    min-height: 48px; padding: var(--s1) 4px; border: none; border-right: 1px solid rgba(47,42,37,0.5);
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 var(--fs-small)/1.15 var(--font);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s1); }
  #thumbs button {
    padding: 0; border: 2px solid rgba(47,42,37,0.35); border-radius: 8px 4px 8px 4px;
    overflow: hidden; cursor: pointer; background: #000; aspect-ratio: 4 / 5;
    transition: border-color var(--dur) var(--spring), transform var(--dur) var(--spring);
  }
  #thumbs button img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; }
  #thumbs button.on { border-color: var(--ink); transform: scale(1.04); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .p-row { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: var(--s1); }
  .switch {
    flex: none; width: 54px; height: 30px; border-radius: 15px; border: 2px solid var(--ink);
    background: transparent; position: relative; cursor: pointer;
    transition: background var(--dur) var(--spring);
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--ink); transition: transform var(--dur) var(--spring), background var(--dur) var(--spring);
  }
  .switch.on { background: var(--ink); }
  .switch.on::after { transform: translateX(24px); background: var(--paper); }
  .p-btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; padding: var(--s1) var(--s2); cursor: pointer;
    border: 2px solid var(--ink); border-radius: 12px 6px 12px 6px / 6px 12px 6px 12px;
    background: transparent; color: var(--ink); text-align: center;
    font: 700 var(--fs-body)/1.15 var(--font);
    transition: background var(--dur) var(--spring), color var(--dur) var(--spring);
  }
  .p-btn[hidden] { display: none; }
  .p-about p { margin: 0 0 var(--s1); font-size: var(--fs-small); line-height: 1.35; }
  .p-about a { color: var(--ink); font-weight: 700; font-size: var(--fs-small); }

  /* Наведение мышью: подсвечивается только элемент прямо под курсором и еле заметно —
     фон на 4% темнее; без подъёма и теней, группой ничего не подсвечивается. */
  @media (hover: hover) and (pointer: fine) {
    .seg button, .p-btn, .switch, #thumbs button, #panelBtn, .arrow-btn { cursor: pointer; }
    .seg button, .p-btn { transition: background-color 200ms var(--spring); }
    .switch, #thumbs button { transition: filter 200ms var(--spring); }
    #panelBtn { transition: left var(--dur) var(--spring), filter 200ms var(--spring); }
    .seg button:not(.on):hover, .p-btn:hover { background-color: rgba(47,42,37,0.04); }
    .switch:hover, #thumbs button:hover, #panelBtn:hover, .arrow-btn:hover { filter: brightness(0.96); }
  }

  /* кнопка панели (v12.1): своя иконка — знак вечности (колесо с восемью лучами). На ПК свернуть/развернуть, на телефоне —
     открыть/закрыть шторку. При переключении колесо поворачивается на пружине, а лучи по очереди прорисовываются заново. */
  #panelBtn {
    position: fixed; z-index: 60; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; padding: 0;
    box-shadow: 0 6px 16px rgba(60,45,20,0.3), 2px 3px 0 rgba(47,42,37,0.14);
    display: flex; align-items: center; justify-content: center;
    transition: left var(--dur) var(--spring), transform var(--dur) var(--spring), background var(--dur) var(--spring);
  }
  #panelBtn:active { background: var(--paper-2); }
  #panelBtn svg { display: block; flex: none; }
  .ic-wheel { transition: transform 800ms var(--spring); overflow: visible; }
  .ic-wheel .arm { stroke-dasharray: 1; stroke-dashoffset: 0; }
  @keyframes armA { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes armB { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  #scrim { display: none; }

  @media (min-width: 1024px) {
    #panelBtn {
      top: var(--s3); left: calc(var(--panelW) - 56px); width: 40px; height: 40px; border-radius: 50% 42% 50% 42%;
    }
    #panelBtn .ic-wheel { width: 28px; height: 28px; transform: rotate(180deg); }
    body.panel-collapsed #panelBtn { left: 4px; }
    body.panel-collapsed #panelBtn .ic-wheel { transform: rotate(0deg); }
    html.panel-anim body:not(.panel-collapsed) #panelBtn .arm { animation: armA 700ms var(--ease) both; animation-delay: calc(var(--i) * 55ms + 150ms); }
    html.panel-anim body.panel-collapsed #panelBtn .arm { animation: armB 700ms var(--ease) both; animation-delay: calc(var(--i) * 55ms); }
  }

  /* Телефон: та же панель, свёрнутая в круглую кнопку; по тапу выезжает снизу шторкой на 60% высоты */
  @media (max-width: 1023.98px) {
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; height: 60dvh; overflow: visible;
      transform: translateY(108%); transition: transform 400ms var(--ease); z-index: 70;
    }
    body.sheet-open #panel { transform: none; }
    .panel-scroll { padding: var(--s4); grid-template-columns: minmax(0, 420px); justify-content: center; scroll-padding: var(--s4) 0; }
    .panel-card {
      left: max(var(--s1), var(--safe-l)); right: max(var(--s1), var(--safe-r)); top: 0; bottom: calc(var(--safe-b) + var(--s1)); width: auto;
      border-radius: 22px 22px 12px 12px / 18px 18px 12px 12px;
    }
    #panelBtn {
      left: calc(var(--safe-l) + var(--s2)); bottom: calc(var(--safe-b) + var(--s1)); width: 56px; height: 56px; border-radius: 50%;
      transition: transform 350ms var(--ease), background 250ms var(--ease);
    }
    body.sheet-open #panelBtn { transform: scale(0.9); }
    #scrim {
      display: block; position: fixed; inset: 0; z-index: 65; background: rgba(20,16,8,0.32);
      opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
    }
    body.sheet-open #scrim { opacity: 1; pointer-events: auto; }
  }

  /* без WebGL время суток — CSS-фильтром (окна ночью не светятся) */
  .fb-frame { transition: filter 1500ms var(--spring); }
  #fallback[data-tod="sunset"] .fb-frame { filter: sepia(0.55) saturate(1.5) hue-rotate(-12deg) brightness(0.93); }
  #fallback[data-tod="night"] .fb-frame { filter: brightness(0.38) sepia(0.35) hue-rotate(185deg) saturate(1.5); }


  /* Точки-подсказки: маленький пульсирующий маркер, привязанный к
     объекту на слое (двигается вместе с ним при параллаксе — позиция
     считается в JS той же формулой смещения, что и в шейдере). */
  /* Птицы, облака, солнце и прочее в небе рисует details.js на 2D-холсте (с v12 — вместо DOM-птиц). */

  #hotspots { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .hs-dot {
    position: absolute; top: 0; left: 0;
    width: 22px; height: 22px; margin: -11px;
    border: none; padding: 0; background: none;
    pointer-events: auto; cursor: pointer;
    opacity: 0; transition: opacity var(--dur) var(--spring);
  }
  .hs-dot.show { opacity: 1; }
  .hs-dot::before, .hs-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .hs-dot::before {
    width: 10px; height: 10px;
    background: #fff; border: 2px solid rgba(20,16,8,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hs-dot::after {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.7);
    animation: hsPulse 2.2s var(--ease) infinite;
  }
  @keyframes hsPulse {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  /* Карточка подсказки: бумага, крупный текст, растёт из точки (0.9 -> 1, 350 мс),
     закрывается за 300 мс. Фон за ней темнеет/размывается/обесцвечивается. */
  #hsPopup {
    position: absolute; z-index: 7;
    width: max-content; max-width: min(84vw, 360px);
    display: grid; row-gap: var(--s2); padding: var(--s2) var(--s3);
    font-size: var(--fs-card); line-height: 1.35; color: var(--ink);
    --shift: 0px;
    transform-origin: calc(50% - var(--shift)) calc(100% + 16px);
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(0.9);
    opacity: 0; pointer-events: none;
    transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  #hsPopup.show {
    opacity: 1; pointer-events: auto;
    transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(1);
    transition-duration: 350ms;
  }
  /* точка у верхнего края — карточка раскрывается вниз */
  #hsPopup.below { transform-origin: calc(50% - var(--shift)) -16px; transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(0.9); }
  #hsPopup.below.show { transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(1); }
  #hsPopup::after {
    /* хвостик остаётся над точкой, даже если сам блок сдвинут от края */
    content: ''; position: absolute; left: calc(50% - var(--shift)); top: 100%;
    width: 14px; height: 14px; margin-left: -7px; margin-top: -8px;
    background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transform: rotate(45deg);
  }
  #hsPopup.below::after { top: 0; margin-top: -6px; border: none; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); }
  #hsText { margin: 0; }
  #hsBack { display: inline-flex; justify-self: start; width: auto; padding: var(--s1) var(--s2); font-size: var(--fs-small); }
  .lbl-phone { display: none; }
  /* Телефон: заметная кнопка «× закрыть» внизу карточки (не ниже 44 px), тап мимо тоже закрывает */
  @media (max-width: 1023.98px) {
    .lbl-pc { display: none; }
    .lbl-phone { display: inline; }
    #hsBack { display: flex; justify-self: stretch; width: 100%; min-height: 48px; padding: var(--s1) var(--s2); font-size: 19px; }
  }

  #gl, #fallback { transition: filter 650ms var(--ease); }
  /* ПК: карточка растёт из точки на пружине (0.85 -> 1), фон затемняется/размывается/обесцвечивается
     за 650 мс; карточка закрывается за 300 мс через 250 мс после ухода мыши. На телефоне остаётся прежнее появление. */
  @media (min-width: 1024px) {
    #hsPopup {
      transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(0.85);
      transition: opacity 300ms var(--spring), transform 300ms var(--spring);   /* закрытие 300 мс */
    }
    #hsPopup.show { transform: translate(calc(-50% + var(--shift)), -100%) translateY(-16px) scale(1); transition-duration: var(--dur); }
    #hsPopup.below { transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(0.85); }
    #hsPopup.below.show { transform: translate(calc(-50% + var(--shift)), 0) translateY(16px) scale(1); }
    #gl, #fallback { transition: filter 650ms var(--spring); }
  }
  #stage.reading #gl, #stage.reading #fallback { filter: brightness(0.6) saturate(0.4) blur(6px); }

  /* «Уменьшение движения» в системе: отключаем только фоновое бесконечное движение (небо и живые детали, пульс
     точек, «дыхание», тени облаков, ветер, звёзды). Плавные переходы интерфейса и автопокачивание
     остаются: у автопокачивания есть свой переключатель в панели. */
  @media (prefers-reduced-motion: reduce) {
    .hs-dot::after { display: none; }
  }
  /* ТЕЛЕФОН (v12.1): кнопки и название были плохо видны на картинке. Теперь у каждой кнопки и у названия — мягкая полупрозрачная
     подложка цвета бумаги с растушёванными краями (радиальный градиент, не плашка и не круг с обводкой); значки и текст — тёмное перо.
     Ночью подложка тёмно-синяя, значки светлые (html[data-night="1"] ставит скрипт). Нажимаемая зона (56 px) прежняя. */
  :root { --bk: 245,236,218; --fg: #2f2a25; }
  html[data-night="1"] { --bk: 22,28,50; --fg: #f3e9d2; }
  @media (max-width: 1023.98px) {
    .arrow-btn, #panelBtn {
      pointer-events: auto; color: var(--fg); border: 0; border-radius: 50%; box-shadow: none; filter: none;
      background: radial-gradient(closest-side, rgba(var(--bk),0.9) 0, rgba(var(--bk),0.86) 60%, rgba(var(--bk),0) 100%);
    }
    .arrow-btn:active, #panelBtn:active { background: radial-gradient(closest-side, rgba(var(--bk),0.9) 0, rgba(var(--bk),0.86) 60%, rgba(var(--bk),0) 100%); transform: scale(0.9); opacity: 0.85; }
    #panelBtn { left: calc(var(--safe-l) + var(--s2)); bottom: calc(var(--safe-b) + var(--s1)); width: 56px; height: 56px; transition: transform 350ms var(--ease), opacity 250ms var(--ease); }
    #panelBtn .ic-wheel { width: 34px; height: 34px; }
    body.sheet-open #panelBtn { transform: scale(0.94); }
    body.sheet-open #panelBtn .ic-wheel { transform: rotate(180deg); }
    html.panel-anim body.sheet-open #panelBtn .arm { animation: armA 700ms var(--ease) both; animation-delay: calc(var(--i) * 55ms + 150ms); }
    html.panel-anim body:not(.sheet-open) #panelBtn .arm { animation: armB 700ms var(--ease) both; animation-delay: calc(var(--i) * 55ms); }
    #barTitle {
      justify-self: center; max-width: 100%; padding: 12px 16px; color: var(--fg); text-shadow: none; font-size: 17px;
      background: radial-gradient(ellipse closest-side, rgba(var(--bk),0.88) 0, rgba(var(--bk),0.84) 62%, rgba(var(--bk),0) 100%);
    }
    .nav-btn svg { width: 34px; height: 34px; }
  }
</style>

<script>
/* ===================== CONFIG =====================
   Все параметры эффекта «3D-фото» собраны здесь, ничего похожего
   больше в коде не настраивается. */
var CONFIG = {
  // Смещение по карте глубины: максимум у самых близких/дальних пикселей
  // фона и земли (плоскость фокуса — середина карты), доли ширины/высоты
  // кадра. Здание двигается целиком по своей средней глубине, тем же максимумом.
  MAX_SHIFT_X: 0.02,
  MAX_SHIFT_Y: 0.012,
  BASE_SCALE: 1.05,          // общий масштаб, чтобы не были видны края
  ZOOM_NEAR: 0.02,           // при наклоне к себе ближние части +до 2%
  DEPTH_BLUR_PX: 6,          // размытие карты глубины фона (6 px) против «резины» на краях

  // Кадры и карты глубины ужимаются до этой длинной стороны — иначе iPhone
  // выгружает большие текстуры из памяти.
  MAX_TEX_SIZE: 1600,

  // Наклон гироскопа, дающий полное смещение (мышь/палец — свои правила).
  MAX_TILT_X_DEG: 20,
  MAX_TILT_Y_DEG: 20,

  SMOOTH: 0.12,              // сглаживание гироскопа/мыши (доля пути за кадр при 60 fps)
  RETURN_MS: 800,            // возврат в центр после отпускания пальца

  // Быстрый росчерк пальцем = смена кадра; медленное перетаскивание двигает объём.
  SWIPE_MIN_PX: 50,

<script>
/* Перо (ПК): путь по границе карточки панели — углы те же, что у рамки .sketch (22/8/18/10 px по горизонтали, 10/18/8/22 по вертикали).
   Ставится сразу, до первой отрисовки, чтобы прорисовка началась с готового контура; при смене высоты окна пересчитывается. */
(function () {
  var pen = document.getElementById('pen'); if (!pen) return;
  var H = [22, 8, 18, 10], V = [10, 18, 8, 22];   // радиусы углов: левый верх, правый верх, правый низ, левый низ
  function path(w, h, i) {
    var r = H.map(function (x, k) { return [Math.max(0.5, x - i), Math.max(0.5, V[k] - i)]; }), x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return ['M', x0 + r[0][0], y0, 'L', x1 - r[1][0], y0, 'A', r[1][0], r[1][1], 0, 0, 1, x1, y0 + r[1][1], 'L', x1, y1 - r[2][1],
      'A', r[2][0], r[2][1], 0, 0, 1, x1 - r[2][0], y1, 'L', x0 + r[3][0], y1, 'A', r[3][0], r[3][1], 0, 0, 1, x0, y1 - r[3][1],
      'L', x0, y0 + r[0][1], 'A', r[0][0], r[0][1], 0, 0, 1, x0 + r[0][0], y0].join(' ');
  }
  function fit() {
    var w = 384, h = Math.max(200, window.innerHeight - 32);
    pen.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var d1 = path(w, h, 1);
    pen.querySelector('.pen-1').setAttribute('d', d1);                 // центр 2-пиксельной рамки
    pen.querySelector('.nib').style.offsetPath = 'path("' + d1 + '")';   // кончик пера бежит по тому же пути
    pen.querySelector('.pen-2').setAttribute('d', path(w, h, 6.5));   // внутренняя карандашная линия (outline-offset −7)
  }
  fit();
  window.__penFit = fit;
})();
</script>
