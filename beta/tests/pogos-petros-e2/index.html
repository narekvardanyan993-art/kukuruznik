     область — прямоугольник, вдвинутый внутрь скруглений рамки, а растворение у краёв — две полоски-градиента цвета бумаги */

stic reconstruction after archive photos"},"panelTitle":{"hy":"Պողոս-Պետրոս եկեղեցի","ru":"Церковь Погос-Петрос","en":"Poghos-Petros Church"},"welcome":{"hy":"Բարի գալուստ Պողոս-Պետրոս եկեղեցի","ru":"Добро пожаловать к церкви Погос-Петрос","en":"Welcome to Poghos-Petros Church"}},"facts":{"church":{"hy":"Պողոս-Պետրոս եկեղեցի։ Հին Երևանի ամենահին և ամենամեծ եկեղեցին։ Հիմնադրվել է V–VI դարերում։","ru":"Церковь Погос-Петрос. Старейшая и крупнейшая церковь старого Еревана. Основана в V–VI вв.","en":"Poghos-Petros Church. The oldest and largest church of old Yerevan, founded in the 5th–6th centuries."},"belfry":{"hy":"Զանգակատուն։ Սյունազարդ ռոտոնդայով եռայարուս զանգակատունը արևմտյան մուտքին կցվել է ավելի ուշ և ոճով չի համապատասխանում բազիլիկին։","ru":"Колокольня. Трёхъярусную колокольню с ротондой на колоннах пристроили к западному входу позже — она «не в стиле» самой базилики.","en":"Belfry. The three-tier belfry with a columned rotunda was added to the west entrance later, in a different style from the basilica."},"roof":{"hy":"Տանիք։ Անգմբեթ բազիլիկ՝ երկթեք տանիքով։ XIX դարում քարե ծածկը պատել են թիթեղով։","ru":"Крыша. Бескупольная базилика с двускатной крышей. В XIX в. каменную кровлю перекрыли жестью.","en":"Roof. A domeless basilica with a gable roof. In the 19th century its stone roof was covered with tin."},"rebuilt":{"hy":"Վերակառուցում։ 1679 թվականի երկրաշարժը ավերել է եկեղեցին, և այն վերակառուցել են պահպանված արևելյան մասի վրա։ Պատերում ագուցված խաչքարերին փորագրված են 1691 և 1692 թվականները։","ru":"Отстроена заново. Землетрясение 1679 г. разрушило церковь, её подняли на уцелевшей восточной части. На хачкарах в стенах — даты 1691 и 1692.","en":"Rebuilt. The 1679 earthquake ruined the church; it was rebuilt on the surviving east part. Khachkars in the walls bear the dates 1691 and 1692."},"repairs":{"hy":"Նորոգումներ։ Արձանագրությունները պատմում են 1778 և 1820 թվականների նորոգումների մասին։ 1820-ին եկեղեցին նորոգել են ծխականների միջոցներով, ինչն այն ժամանակ հազվադեպ էր։","ru":"Ремонты. Надписи рассказывают о ремонтах 1778 и 1820 гг. В 1820-м церковь чинили «на средства благословенного народа этой церкви» — на деньги прихожан, что тогда было редкостью.","en":"Repairs. Inscriptions record repairs in 1778 and 1820. The 1820 work was paid for by the parishioners, which was rare at the time."},"doors":{"hy":"Երեք մուտք։ Եկեղեցին մուտքեր ուներ հարավից, արևմուտքից և հյուսիսից։ Հյուսիսային մուտքին՝ այժմյան Աբովյան փողոցի կողմից, հետագայում կցել են կամարակապ նախասրահ։","ru":"Три входа. Входы были с юга, запада и севера. К северному, со стороны нынешней улицы Абовяна, позже пристроили арочный притвор.","en":"Three entrances. The church had doors on the south, west and north. An arched porch was later added to the north one, facing today’s Abovyan Street."},"shahar":{"hy":"Շահար թաղամաս։ Եկեղեցին գտնվում էր հին Շահար թաղամասում՝ այժմյան Աբովյան և Թումանյան փողոցների անկյունում։","ru":"Квартал Шаар. Церковь стояла в старом квартале Шаар — на углу нынешних улиц Абовяна и Туманяна.","en":"Shahar quarter. The church stood in the old Shahar quarter, at the corner of today’s Abovyan and Tumanyan streets."},"mosque":{"hy":"Զալխանի մզկիթ։ Մոտակայքում էր Շահարի Զալխանի մզկիթը։ Նրա մինարեթը և եկեղեցու զանգակատունը երևում են 1923 թվականի նույն լուսանկարում։","ru":"Мечеть Залхан. Рядом стояла Шаарская мечеть Залхан. Её минарет и колокольня церкви попали на один снимок 1923 г.","en":"Zalkhan Mosque. The Zalkhan (Shahar) mosque stood nearby. Its minaret and the church belfry appear in the same 1923 photo."},"door_bayazet":{"hy":"Բայազետի դուռը։ Երկփեղկ երկաթե հարավային դուռը բերվել է Հին Բայազետի բերդից։ 1835-ին այն գնել և եկեղեցուն է նվիրել տեր Վարդանը։ Այժմ դուռը Երևանի պատմության թանգարանում է։","ru":"Дверь из Баязета. Двустворчатая железная южная дверь — из крепости Старый Баязет: в 1835 г. её купил и подарил церкви тер Вардан. Сейчас она в Музее истории Еревана.","en":"Door from Bayazet. The double iron south door came from the Old Bayazet fortress: Ter Vardan bought it and gave it to the church in 1835. It is now in the History Museum of Yerevan."},"chapels":{"hy":"Երկու մատուռ։ Խորանի կողքին Սուրբ Ստեփանոս և Սուրբ Հովհաննես Մկրտիչ մատուռներն էին՝ երկուսն էլ կառուցված 1831-ին։","ru":"Два придела. У алтаря — приделы Св. Степаноса и Иоанна Крестителя. Оба построены в 1831 г.","en":"Two chapels. Beside the altar were the chapels of St Stepanos and St John the Baptist, both built in 1831."},"frescoes":{"hy":"Որմնանկարների վեց շերտ։ Խորանը քանդելիս հայտնաբերվել է տարբեր դարերի որմնանկարների վեց շերտ։ Քանդումը դադարեցվել է, և կիևցի վերականգնող Բ. Յուկինը պատից հանել է 14,25 մ² որմնանկար։","ru":"Шесть слоёв росписи. При разборке алтаря нашли шесть слоёв росписи разных веков. Снос приостановили, и киевский реставратор Б. Юкин снял 14,25 м² фресок.","en":"Six layers of murals. Dismantling the altar revealed six layers of paintings from different centuries. Demolition was paused, and the Kyiv restorer B. Yukin removed 14.25 m² of frescoes."},"frescoes_now":{"hy":"Որմնանկարներն այսօր։ Ստորին շերտը բուսական զարդանախշ է, մյուս շերտերում՝ Պետրոս և Պողոս առաքյալները։ Որմնանկարները պահվում են Հայաստանի ազգային պատկերասրահում և Հայաստանի պատմության թանգարանում, իսկ Երևանի պատմության թանգարանի տվյալներով՝ նաև այնտեղ։","ru":"Фрески сегодня. Нижний слой — растительный орнамент, в других слоях — апостолы Пётр и Павел. Фрески хранятся в Национальной галерее и Историческом музее Армении, а по данным Музея истории Еревана — и в нём.","en":"The frescoes today. The lowest layer is a plant ornament; other layers show the apostles Peter and Paul. The frescoes are kept in the National Gallery and the History Museum of Armenia — and, according to the History Museum of Yerevan, there too."},"cinema":{"hy":"«Մոսկվա» կինոթատրոն։ Եկեղեցու տեղում «Մոսկվա» կինոթատրոնն է՝ ճարտարապետներ Տ. Երկանյանի և Գ. Քոչարի նախագծով։ Այն բացվել է 1936 թվականի դեկտեմբերի 12-ին «Պեպո» ֆիլմով։","ru":"Кинотеатр «Москва». На месте церкви — кинотеатр «Москва» архитекторов Т. Ерканяна и Г. Кочара. Его открыли 12 декабря 1936 г. фильмом «Пэпо».","en":"Moscow Cinema. The Moscow Cinema by the architects T. Yerkanyan and G. Kochar stands on the church’s site. It opened on 12 December 1936 with the film “Pepo”."},"tamanyan":{"hy":"Թամանյանը՝ քանդման դեմ։ 1930 թվականի մարտի 2-ին Ալեքսանդր Թամանյանը գրել է, որ հուշարձանը շատ կարևոր է և պետք է պահպանել։ Քանդմանը դեմ էր նաև Գ. Չիրիկովը։ Քանդելուց առաջ շենքը չափագրել և փաստագրել են։","ru":"Таманян против сноса. 2 марта 1930 г. Александр Таманян написал: «памятник очень значим, его надо сохранить». Против был и Г. Чириков. Перед сносом здание обмерили и задокументировали.","en":"Tamanyan against demolition. On 2 March 1930 Alexander Tamanyan wrote that the monument was very significant and had to be saved. G. Chirikov opposed it too. Before demolition the building was measured and documented."},"open_hall":{"hy":"Բացօթյա դահլիճ։ 2010-ին կառավարությունը որոշեց «Մոսկվա» կինոթատրոնի բացօթյա դահլիճի տարածքը տալ Էջմիածնին՝ հին եկեղեցու տեղում նորը կառուցելու համար։ Բողոքի ակցիան հավաքեց մոտ 18 000 ստորագրություն, և ծրագիրը չեղարկվեց։","ru":"Открытый зал. В 2010 г. землю открытого зала «Москвы» решили отдать Эчмиадзину под новую церковь на месте старой. Протест собрал около 18 000 подписей, и план отменили.","en":"Open-air hall. In 2010 the government decided to give the cinema’s open-air hall to Etchmiadzin for a new church on the old site. A protest gathered about 18,000 signatures, and the plan was dropped."},"demolished":{"hy":"Քանդումը։ Եկեղեցին քանդվել է 1930–1931 թվականներին, իսկ 1936-ին նրա տեղում բացվել է «Մոսկվա» կինոթատրոնը։","ru":"Снос. Церковь снесли в 1930–1931 гг., а в 1936 г. на её месте открыли кинотеатр «Москва».","en":"Demolition. The church was torn down in 1930–1931; in 1936 the Moscow Cinema opened on its site."}},"aboutFacts":["church","rebuilt","demolished"],"postcardFile":"pogos-petros.png","postcard":{"name":{"hy":"Պողոս-Պետրոս","ru":"Погос-Петрос","en":"Poghos-Petros"},"years":{"hy":"V–VI դդ. – 1930–1931","ru":"V–VI вв. – 1930–1931","en":"5th–6th c. – 1930–1931"},"url":"chka.am/pogos-petros","no":3,"fact":{"hy":"Հին Երևանի ամենահին և ամենամեծ եկեղեցին, հիմնադրված V–VI դարերում։ Այն քանդվեց 1930–1931-ին, և ներսում գտան որմնանկարների վեց շերտ։ Այժմ նրա տեղում «Մոսկվա» կինոթատրոնն է։","ru":"Старейшая и крупнейшая церковь старого Еревана, основана в V–VI вв. Её снесли в 1930–1931 гг., внутри нашли шесть слоёв фресок. Сейчас на этом месте — кинотеатр «Москва».","en":"The oldest and largest church of old Yerevan, founded in the 5th–6th centuries. It was torn down in 1930–1931; six layers of frescoes were found inside. The Moscow Cinema stands there now."},"show":{"frame":0,"t":5,"frames":{"1":{"t":9},"2":{"t":12,"night":12},"3":{"t":8,"night":8},"4":{"t":12,"night":12},"5":{"t":9,"night":9}}}},"live":{"slug":"pogos-petros","meta":{"url":"https://chka.am/pogos-petros/","ogImage":"og.jpg","favicon":"../assets/favicon-32.png","appleTouchIcon":"../assets/icon-180.png","viewerVersion":"pogos-petros-1"},"links":{"home":"../"}},"card":{"eyebrow":{"hy":"Ինտերակտիվ · 1915–1929","ru":"Интерактив · 1915–1929","en":"Interactive · 1915–1929"},"meta":{"hy":"Շահար թաղամաս · Երևան","ru":"Квартал Шаар · Ереван","en":"Shahar quarter · Yerevan"},"image":"card.webp","history":"history.html","stack":"b"},"sale":{"url":"/buy/","total":8,"left":8,"note":"e1.57: продажа мест под надписи (Polar, org Chka). После каждой продажи — left минус 1 и publish_building"},"look":{"frameSize":[768,1365],"sunSide":"left"},"effects":{"parallax":{"shiftX":0.0156,"shiftY":0.0094,"zoomNear":0.0156,"baseScale":1.05,"depthBlurPx":6,"smooth":0.12,"returnMs":800,"crossfadeMs":1200,"maxTiltDeg":20,"breath":{"amp":0.0031,"periodS":6}},"tod":{"day":{"skyTop":[0.58,0.78,0.97],"skyHor":[0.83,0.92,0.99],"mix":0.8,"greenHue":0.3,"greenPull":0.78,"greenSat":1.9},"noon":{"wb":[0.97,1.0,1.03],"sat":1.0,"lift":0.0,"bright":1.04,"sky":0.9},"daySunsetS":2.5,"sunsetNightS":3,"sunset
