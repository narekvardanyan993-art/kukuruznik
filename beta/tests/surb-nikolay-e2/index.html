avicon":"../../assets/favicon-32.png","appleTouchIcon":"../../assets/icon-180.png","viewerVersion":"test"},"app":{"name":"Никольский собор","shortName":"Никольский"},"links":{"home":"../../","history":"about.html"},"text":{"title":{"hy":"Սուրբ Նիկոլայ","ru":"Никольский собор","en":"St Nikolai Cathedral"},"pageTitle":{"hy":"Սուրբ Նիկոլայ տաճար, Երևան | Չկա","ru":"Никольский собор, Ереван | Չկա","en":"Saint Nikolai Cathedral, Yerevan | Չկա"},"plaque":{"hy":"Սուրբ Նիկոլայ տաճար (1890-ականներ – 1920–30-ականների սահման) · Մայր տաճարի հրապարակ, Երևան · գեղարվեստական վերակառուցում արխիվային լուսանկարներից","ru":"Никольский собор (1890-е — рубеж 1920–30-х) · Соборная площадь, Ереван · художественная реконструкция по архивным фото","en":"Saint Nikolai Cathedral (1890s – around 1930) · Cathedral Square, Yerevan · artistic reconstruction after archive photos"},"panelTitle":{"hy":"Սուրբ Նիկոլայ տաճար","ru":"Никольский собор","en":"Saint Nikolai Cathedral"},"welcome":{"hy":"Բարի գալուստ Սուրբ Նիկոլայ տաճար","ru":"Добро пожаловать к Никольскому собору","en":"Welcome to Saint Nikolai Cathedral"}},"facts":{"place":{"hy":"Որտեղ էր կանգնած։ Մայր տաճարի հրապարակի հյուսիսարևելյան կողմի մեջտեղում՝ այնտեղ, որտեղ այսօր Շահումյանի հուշարձանն է։","ru":"Где он стоял. В середине северо-восточной стороны Соборной площади — там, где сегодня памятник Шаумяну.","en":"Where it stood. In the middle of the north-eastern side of Cathedral Square, where the Shahumyan monument stands today."},"domes":{"hy":"Հինգ գմբեթ։ Հինգ սոխաձև գմբեթ՝ այն ժամանակ Ռուսաստանում ընդունված «ռուսական ոճով»․ դրանք երևում են 1899-ի, մոտ 1906-ի և 1919-ի լուսանկարներում։","ru":"Пять глав. Пять луковичных глав в «русском стиле», принятом тогда в России, — их видно на снимках 1899, около 1906 и 1919 годов.","en":"Five domes. Five onion domes in the “Russian style” then common in Russia — they show on photos of 1899, around 1906 and 1919."},"tiflis":{"hy":"Սխալ բացիկը։ Մոտ 1906 թ. բացիկի վրա Երևանի տաճարը ստորագրված է «Թիֆլիս»․ հրատարակիչը շփոթել է քաղաքը։","ru":"Ошибка на открытке. На открытке около 1906 года ереванский собор подписан «Тифлисъ» — издатель перепутал город.","en":"The wrong postcard. On a postcard of around 1906 Yerevan’s cathedral is labelled “Tiflis” — the publisher mixed up the city."},"military":{"hy":"Զինվորական տաճար։ Քաղաքում այն կոչում էին Զինվորական տաճար․ նրան էր կցված կայազորը։","ru":"Военный собор. В городе его звали Военным: к собору был приписан гарнизон.","en":"The Military Cathedral. Locals called it the Military Cathedral: the garrison was attached to it."},"tuff":{"hy":"Կարմիր և սև տուֆ։ Նկարագրությունների համաձայն՝ տաճարը շարված էր տեղական կարմիր և սև տուֆից, ինչպես հին Երևանի շատ շենքեր։","ru":"Красный и чёрный туф. По описаниям, собор сложили из местного красного и чёрного туфа — как многие дома старого Еревана.","en":"Red and black tuff. By the descriptions, the cathedral was built of local red and black tuff, like many houses of old Yerevan."},"building":{"hy":"Երկար շինարարություն։ Նախագիծը հաստատվեց 1894-ին․ 1899-ին գմբեթներն արդեն կանգնած են, բայց հարդարումը շարունակվում է, իսկ 1901-ին դեռ նվիրատվություններ էին հավաքում։","ru":"Стройка на годы. Проект утвердили в 1894 году; в 1899-м главы уже стоят, но идёт отделка, а в 1901-м ещё собирали пожертвования.","en":"Years of building. The design was approved in 1894; by 1899 the domes stand but the finishing goes on, and in 1901 donations were still being collected."},"builders":{"hy":"Երկու շինարար։ Շինարարությունը սկսել է Վ. Միրզոևը, ավարտել՝ Կիտկինը (ըստ Վիքիպեդիայի)։","ru":"Двое строителей. Стройку начинал В. Мирзоев, заканчивал Киткин (по данным Википедии).","en":"Two builders. V. Mirzoev began the work and Kitkin finished it (according to Wikipedia)."},"square":{"hy":"Հրապարակը փոխեց անունը։ Մայր տաճարի հրապարակը դարձավ Շահումյանի հրապարակ։","ru":"Площадь сменила имя. Соборная площадь стала площадью Шаумяна.","en":"The square changed its name. Cathedral Square became Shahumyan Square."},"demolished":{"hy":"Ինչ կա այսօր։ Տաճարը քանդեցին 1920–30-ականների սահմանին, իսկ 1931-ին նրա տեղում բացվեց Ստեփան Շահումյանի հուշարձանը (քանդակագործ՝ Ս. Մերկուրով, ճարտարապետ՝ Ի. Ժոլտովսկի)։","ru":"Что на месте. Собор разобрали на рубеже 1920–30-х, а в 1931 году на его месте открыли памятник Степану Шаумяну (скульптор С. Меркуров, архитектор И. Жолтовский).","en":"What is there now. The cathedral was taken down around 1930, and in 1931 a monument to Stepan Shahumyan (sculptor S. Merkurov, architect I. Zholtovsky) opened on its site."}},"aboutFacts":["place","domes","demolished"],"postcardFile":"surb-nikolay.png","postcard":{"name":{"hy":"Սուրբ Նիկոլայ","ru":"Никольский собор","en":"St Nikolai"},"years":{"hy":"1890-ականներ – մոտ 1930","ru":"1890-е – ок. 1930","en":"1890s – c. 1930"},"url":"chka.am/surb-nikolay","no":4,"fact":{"hy":"Հինգգմբեթ տաճարը քառորդ դարից ավելի կանգնած էր Երևանի Մայր տաճարի հրապարակում։ Այն քանդեցին, և 1931-ին նույն տեղում բացվեց Շահումյանի հուշարձանը։","ru":"Пятиглавый собор больше четверти века стоял на Соборной площади Еревана. Его разобрали, и в 1931 году на этом месте открыли памятник Шаумяну.","en":"For more than a quarter of a century a five-domed cathedral stood on Yerevan’s Cathedral Square. It was taken down, and in 1931 a monument to Shahumyan opened on the spot."}},"live":{"slug":"surb-nikolay","meta":{"url":"https://chka.am/surb-nikolay/","ogImage":"og.jpg","favicon":"../assets/favicon-32.png","appleTouchIcon":"../assets/icon-180.png","viewerVersion":"surb-nikolay-1"},"links":{"home":"../"}},"card":{"eyebrow":{"hy":"Ինտերակտիվ · մոտ 1906","ru":"Интерактив · около 1906","en":"Interactive · around 1906"},"meta":{"hy":"Մայր տաճարի հրապարակ · Երևան","ru":"Соборная площадь · Ереван","en":"Cathedral Square · Yerevan"},"image":"card.webp","history":"about.html"},"look":{"frameSize":[768,1365],"sunSide":"left"},"effects":{"parallax":{"shiftX":0.02,"shiftY":0.012,"zoomNear":0.02,"baseScale":1.05,"depthBlurPx":6,"smooth":0.12,"returnMs":800,"crossfad
